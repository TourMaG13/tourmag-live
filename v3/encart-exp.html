<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TourMaG Live — Encart Expédition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

.encart{
  display:flex;align-items:stretch;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#0f172a 100%);
  border-radius:12px;height:200px;max-width:700px;
  position:relative;overflow:hidden;cursor:default;border:1px solid rgba(0,0,0,.15);
}
.encart::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 80%,rgba(56,189,248,.06) 0%,transparent 50%),
             radial-gradient(circle at 80% 20%,rgba(168,85,247,.05) 0%,transparent 50%);
  pointer-events:none;
}

.left{
  width:40%;min-width:0;position:relative;z-index:2;
  display:flex;flex-direction:column;gap:8px;
  justify-content:center;
  padding:18px 16px 18px 20px;
}
.logo{max-height:48px;max-width:160px;object-fit:contain;display:block;flex-shrink:0}
.title{font-size:.95rem;font-weight:700;color:#f1f5f9;line-height:1.3}
.subtitle{font-size:.72rem;color:#94a3b8;line-height:1.4}
.cta{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:2px;padding:7px 14px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  color:#fff;font-size:.7rem;font-weight:600;
  border-radius:8px;text-decoration:none;
  transition:transform .2s,box-shadow .2s;
  align-self:flex-start;flex-shrink:0;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,.4)}
.cta svg{width:13px;height:13px}

.right{
  width:60%;position:relative;z-index:1;flex-shrink:0;
  margin-left:auto;
  border-radius:0 12px 12px 0;overflow:hidden;
  border-left:1px solid rgba(255,255,255,.1);
}
.carousel{width:100%;height:100%;position:relative}
.carousel img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .8s ease;
}
.carousel img.active{opacity:1}

.dots{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;z-index:3;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.35);transition:background .3s,transform .3s;
  cursor:pointer;
}
.dot.active{background:#fff;transform:scale(1.3)}

.no-screens{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:#475569;font-size:11px;text-align:center;
}

@media(max-width:580px){
  .encart{display:block;height:auto;text-align:center;overflow:hidden}
  .left{width:100%;padding:20px 20px 14px;align-items:center}
  .logo{max-height:40px}
  .title{font-size:.9rem}
  .subtitle{font-size:.68rem}
  .cta{align-self:center;font-size:.68rem;padding:6px 12px}
  .right{width:100%;height:280px;padding-bottom:0;border-radius:0 0 12px 12px;border-left:none;border-top:1px solid rgba(255,255,255,.1);position:relative}
  .carousel{position:absolute;inset:0;width:100%;height:100%}
}
</style>
</head>
<body>
<div class="encart" id="encart">
  <div class="left">
    <img class="logo" id="logo" src="" alt="" style="display:none">
    <div class="title" id="title">Suivez l'expédition en direct</div>
    <div class="subtitle" id="subtitle">Carnet de route, étapes, interviews…</div>
    <a class="cta" id="cta" href="#" target="_top">
      Accéder au live
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
  <div class="right" id="screens-zone">
    <div class="carousel" id="carousel"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCiVnKKLqST7G-8s7ULMCmGKUnWwgjyL0Y",
  authDomain:"tourmag-live.firebaseapp.com",
  projectId:"tourmag-live"
});
const db=firebase.firestore();
const params=new URLSearchParams(location.search);
const eventId=params.get('event');
if(!eventId){document.body.innerHTML='<p style="color:#ef4444;padding:20px">Paramètre ?event= manquant</p>';}
const baseUrl='https://tourmag13.github.io/tourmag-live/v3/index.html?event='+eventId;

let currentSlide=0,slideCount=0,autoTimer=null;

async function init(){
  const snap=await db.collection('events').doc(eventId).get();
  if(!snap.exists) return;
  const ev=snap.data();
  const enc=ev.expEncart||{};

  if(enc.bg) document.getElementById('encart').style.background=enc.bg;
  if(enc.titleColor) document.getElementById('title').style.color=enc.titleColor;
  if(enc.subtitleColor) document.getElementById('subtitle').style.color=enc.subtitleColor;
  if(enc.ctaBg){const c=document.getElementById('cta');c.style.background=enc.ctaBg;c.style.boxShadow='0 2px 12px '+enc.ctaBg+'4d';}
  if(enc.ctaColor) document.getElementById('cta').style.color=enc.ctaColor;

  const logoUrl=enc.logo||ev.logo_url||'';
  const logoEl=document.getElementById('logo');
  if(logoUrl){logoEl.src=logoUrl;logoEl.style.display='block';}

  if(enc.title) document.getElementById('title').textContent=enc.title;
  else if(ev.title) document.getElementById('title').textContent=ev.title;
  if(enc.subtitle) document.getElementById('subtitle').textContent=enc.subtitle;

  const ctaEl=document.getElementById('cta');
  ctaEl.href=enc.ctaUrl||baseUrl;
  if(enc.ctaLabel) ctaEl.firstChild.textContent=enc.ctaLabel+' ';

  const screens=(enc.screenshots||[]).filter(Boolean);
  const carousel=document.getElementById('carousel');
  const dotsEl=document.getElementById('dots');

  if(screens.length===0){
    document.getElementById('screens-zone').innerHTML='<div class="no-screens">Captures à configurer</div>';
    sendResize();return;
  }

  slideCount=screens.length;
  screens.forEach((url,i)=>{
    const img=document.createElement('img');
    img.src=url;img.alt='Capture '+(i+1);
    img.onload=()=>sendResize();
    if(i===0) img.classList.add('active');
    carousel.appendChild(img);

    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>goTo(i);
    dotsEl.appendChild(dot);
  });

  if(slideCount>1) autoTimer=setInterval(()=>goTo((currentSlide+1)%slideCount),3500);
  sendResize();
  setTimeout(sendResize,300);
}

function goTo(idx){
  const imgs=document.querySelectorAll('#carousel img');
  const dots=document.querySelectorAll('.dot');
  imgs[currentSlide].classList.remove('active');
  dots[currentSlide].classList.remove('active');
  currentSlide=idx;
  imgs[currentSlide].classList.add('active');
  dots[currentSlide].classList.add('active');
  if(autoTimer) clearInterval(autoTimer);
  autoTimer=setInterval(()=>goTo((currentSlide+1)%slideCount),3500);
}

let _lastH=0;
function sendResize(){
  requestAnimationFrame(()=>{
    const el=document.getElementById('encart');
    if(!el) return;
    const h=el.offsetHeight+2;
    if(h===_lastH) return;
    _lastH=h;
    const fid=params.get('frameId')||(()=>{try{return window.frameElement?window.frameElement.id:'';}catch(e){return '';}})();
    parent.postMessage({type:'tmg-encart-resize',height:h,id:fid},'*');
  });
}

/* Re-send on viewport resize (orientation change, responsive) */
window.addEventListener('resize',sendResize);

/* ResizeObserver for any layout shift */
if(window.ResizeObserver){
  new ResizeObserver(sendResize).observe(document.getElementById('encart'));
}

init();
</script>
</body>
</html>
