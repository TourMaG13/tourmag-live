    style="width:100%;border:none;min-height:280px" id="tourmag-live-v2-w"></iframe>
  <script>
  window.addEventListener('message',function(e){
    if(!e.data) return;
    if(e.data.type==='tourmag-live-resize'||e.data.type==='setHeight'){
      document.getElementById('tourmag-live-v2-w').style.height=e.data.height+'px';
    }
    if(e.data.type==='tourmag-live-fullwidth'){
      var f=document.getElementById('tourmag-live-v2-w');
      if(f){f.style.width='100vw';f.style.maxWidth='none';f.style.position='relative';f.style.left='50%';f.style.transform='translateX(-50%)';}
    }
  });
  </script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourMaG Live — Couverture événementielle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--pri:#0F2B3C;--acc:#E8842C;--acc2:#D4731D;--blue:#0C6CA1;--green:#059669;--orange:#EA580C;--red:#DC2626;--amber:#D97706;--violet:#7C3AED;--cyan:#0891B2;--bg:#FFFFFF;--card:#FFF;--text:#111827;--text2:#4B5563;--text3:#9CA3AF;--border:#E5E7EB;--rl:16px;--shadow:0 2px 16px rgba(0,0,0,.06);--hero-bg1:#0B2636;--hero-bg2:#0F3D52;--live:#DC2626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
img{display:block}a{text-decoration:none}

/* LOADER */
.ld{text-align:center;padding:80px}
.ld .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.ld .tx{font-size:14px;color:var(--text3)}

/* FADE IN */
.fi{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}.fi.vis{opacity:1;transform:translateY(0)}

/* UPDATE BAR */
.upd-bar{display:flex;justify-content:flex-end;padding:6px 28px 0;font-family:'IBM Plex Mono';font-size:9px;color:var(--text3)}
@media(max-width:768px){.upd-bar{padding:6px 10px 0}}

@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@keyframes livepulse-slow{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
@keyframes fpls{0%,100%{opacity:1}50%{opacity:.6}}

/* ==================== STICKY NAV ==================== */
.sticky-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);transform:translateY(-100%);transition:transform .35s ease}
.sticky-nav.visible{transform:translateY(0)}
.sticky-nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:0 28px;height:50px}
.sticky-nav-brand{font-family:'Josefin Sans';font-size:13px;font-weight:700;color:var(--pri);margin-right:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.sticky-nav-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:livepulse 1.5s infinite;flex-shrink:0}
.sticky-nav a{font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);padding:16px 10px;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.sticky-nav a:hover{color:var(--text)}.sticky-nav a.active{color:var(--acc);border-bottom-color:var(--acc)}
@media(max-width:768px){.sticky-nav-inner{padding:0 10px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}.sticky-nav a{font-size:8px;padding:14px 6px}.sticky-nav-brand{font-size:11px;max-width:160px}}

/* ==================== HERO SPLIT ==================== */
.hero-split{display:grid;grid-template-columns:1fr 1fr;min-height:460px;overflow:hidden;background:linear-gradient(135deg,var(--hero-bg1) 0%,var(--hero-bg2) 50%,var(--hero-bg1) 100%)}
.hero-split[data-h]{min-height:0;height:var(--hero-h)}
.hero-split.no-image{grid-template-columns:1fr}
.hero-split-text{display:flex;flex-direction:column;justify-content:center;padding:44px 42px 36px;position:relative}
.hero-split-text::before{content:'';position:absolute;top:-40px;left:-40px;width:300px;height:300px;background:radial-gradient(circle,rgba(232,132,44,.1) 0%,transparent 70%);pointer-events:none}
.hero-badge-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bdg-live{display:inline-flex;align-items:center;gap:6px;font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--live);padding:5px 14px;border-radius:6px}
.bdg-live::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:livepulse 1.5s infinite}
.bdg-event{font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);padding:5px 14px;border-radius:6px}
.hero-logo{max-height:56px;max-width:120px;object-fit:contain;border-radius:8px;margin-bottom:12px}
.hero-title{font-family:'Josefin Sans';font-size:38px;font-weight:700;color:#fff;line-height:1.1;margin-bottom:10px}
.hero-subtitle-text{font-family:'Playfair Display';font-style:italic;font-size:15px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:18px;padding-left:14px;border-left:3px solid var(--acc)}
.hero-meta-row{display:flex;gap:16px;flex-wrap:wrap}
.hero-meta-item{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.5)}
.hero-meta-item svg{width:14px;height:14px;stroke:rgba(255,255,255,.4)}
.hero-tag{font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.1);transition:all .15s;display:inline-block}
.hero-tag:hover{opacity:.8}
.hero-split-image{position:relative;overflow:hidden}
.hero-split-image img{width:100%;height:100%;object-fit:cover}
.hero-split-image::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,var(--hero-bg1) 0%,transparent 30%)}
@media(max-width:860px){.hero-split{grid-template-columns:1fr;min-height:auto}.hero-split-text{padding:28px 16px 22px}.hero-title{font-size:26px}.hero-subtitle-text{font-size:13px}.hero-split-image{height:220px}}

/* HERO TIMELINE */
.hero-tl{background:linear-gradient(135deg,var(--hero-bg1),var(--hero-bg2));padding:16px 28px 20px}
.hero-tl-inner{max-width:1200px;margin:0 auto;position:relative}
.hero-tl-track{display:grid;grid-template-columns:repeat(var(--tl-cols,5),1fr);gap:0;position:relative}
.hero-tl-track::before{content:'';position:absolute;top:14px;left:0;right:0;height:2px;background:rgba(255,255,255,.1)}
.hero-tl-item{display:flex;flex-direction:column;align-items:center;padding:0 4px;cursor:pointer;transition:opacity .15s}
.hero-tl-item:hover{opacity:.8}
.hero-tl-dot{width:10px;height:10px;border-radius:50%;background:var(--acc);border:2.5px solid var(--hero-bg1);box-shadow:0 0 0 1.5px var(--acc);z-index:1;margin-bottom:8px}
.hero-tl-date{font-family:'IBM Plex Mono';font-size:9px;color:var(--acc);font-weight:600;margin-bottom:3px}
.hero-tl-ev{font-size:10px;color:rgba(255,255,255,.5);text-align:center;line-height:1.4}
.hero-tl-ia{font-family:'IBM Plex Mono';font-size:8px;color:rgba(255,255,255,.2);text-align:right;margin-top:8px;letter-spacing:.5px}
@media(max-width:768px){.hero-tl{padding:14px 12px 18px}.hero-tl-track{grid-template-columns:1fr;gap:8px}.hero-tl-track::before{display:none}.hero-tl-item{flex-direction:row;gap:10px;align-items:flex-start}.hero-tl-dot{margin-bottom:0;margin-top:4px;flex-shrink:0}.hero-tl-ev{text-align:left}}

/* ==================== KPI BAR ==================== */
.kpi-bar{max-width:1200px;margin:-22px auto 0;padding:0 28px;position:relative;z-index:2}
.kpi-bar-inner{display:grid;grid-template-columns:repeat(var(--kpi-cols,4),1fr);gap:0;background:var(--card);border-radius:14px;padding:16px 8px;margin-top:10px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
.kpi{text-align:center;padding:4px 10px;border-right:1px solid var(--border)}.kpi:last-child{border-right:none}
.kpi-num{font-family:'Josefin Sans';font-size:24px;font-weight:700;color:var(--pri);line-height:1}
.kpi-label{font-size:9px;color:var(--text3);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
@media(max-width:768px){.kpi-bar{padding:0 12px;margin-top:-16px}.kpi-bar-inner{grid-template-columns:repeat(2,1fr);padding:12px 4px}.kpi:nth-child(2n){border-right:none}.kpi{border-bottom:1px solid var(--border);padding:8px 6px}.kpi:nth-last-child(-n+2){border-bottom:none}.kpi-num{font-size:20px}}

/* ==================== CONTAINER ==================== */
.dash{max-width:1200px;margin:0 auto;padding:0 28px}
@media(max-width:768px){.dash{padding:0 12px}}

/* ==================== SECTION TITLES ==================== */
.sec-title{text-align:center;padding:48px 0 28px}
.sec-title-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;margin-bottom:8px}
.sec-title h2{font-family:'Josefin Sans';font-size:24px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.sec-title-line{width:60px;height:3px;background:var(--pri);margin:8px auto;border-radius:2px}
.sec-title p{font-family:'Playfair Display';font-style:italic;font-size:13px;color:var(--text3)}
@media(max-width:768px){.sec-title{padding:36px 0 20px}.sec-title h2{font-size:18px;letter-spacing:1px}}

/* Old section label fallback */
.sl{font-family:'Josefin Sans';font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin:36px 0 14px;display:flex;align-items:center;gap:8px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}

/* ==================== ESSENTIAL CARDS ==================== */
.ess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:28px 0 0}
.ess-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;border-left:3px solid transparent;box-shadow:var(--shadow);transition:transform .15s}
.ess-card:hover{transform:translateY(-2px)}
.ess-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ess-num{font-family:'Josefin Sans';font-size:18px;font-weight:700;line-height:1}
.ess-tag{font-family:'Josefin Sans';font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.ess-txt{font-size:11px;line-height:1.6;color:var(--text2)}
.ess-txt strong{font-weight:600;color:var(--text)}
.ess-ia{font-family:'IBM Plex Mono';font-size:8px;color:var(--text3);text-align:right;margin-top:8px;letter-spacing:.5px}
@media(max-width:768px){.ess-grid{grid-template-columns:1fr}}

/* ==================== FLASH ==================== */
.flash{display:flex;align-items:center;gap:12px;padding:13px 20px;background:linear-gradient(90deg,#7F1D1D,#991B1B);border-radius:12px;margin-bottom:14px;overflow:hidden;cursor:pointer}
.flash-badge{display:flex;align-items:center;gap:5px;font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 12px;border-radius:6px;flex-shrink:0;white-space:nowrap;animation:fpls 2s infinite}
.flash-badge svg{width:12px;height:12px;stroke:#fff}
.flash-text{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);flex:1;line-height:1.4}
@media(max-width:768px){.flash{flex-wrap:wrap;gap:8px;padding:10px 12px}.flash-text{font-size:12px;order:3;flex-basis:100%}}

/* ==================== LAYOUT ==================== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr;gap:20px}}
.main-col{min-width:0;max-width:100%}.side-col{min-width:0}
@media(max-width:960px){.side-col{order:10}}
.side-col>*+*{margin-top:14px}
.itw-section{margin-top:36px}
.sec-title{padding:44px 0 28px}

/* ==================== LIVE FEED ==================== */
.live-feed{position:relative;padding-left:4px}
.live-entry{position:relative;display:flex;gap:14px;padding:0 0 24px}
.live-entry::before{content:'';position:absolute;left:23px;top:42px;bottom:0;width:2px;background:var(--border)}
.live-entry:last-child::before{display:none}
.live-time-col{flex-shrink:0;width:44px;display:flex;flex-direction:column;align-items:center;padding-top:1px}
.live-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--acc);z-index:1}
.live-avatar-first{box-shadow:0 0 0 2px var(--live);animation:livepulse-slow 2.5s infinite}
.live-dot{width:12px;height:12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--acc);z-index:1;margin-top:4px}
.live-entry:first-child .live-dot{background:var(--live);box-shadow:0 0 0 2px var(--live);animation:livepulse-slow 2.5s infinite}
.live-content{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
.live-content:hover{transform:translateY(-1px)}
.live-entry:first-child .live-content{border-color:rgba(220,38,38,.2);box-shadow:0 2px 12px rgba(220,38,38,.06)}
.live-content-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.live-tag{font-family:'Josefin Sans';font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:#F1F5F9;color:#475569}
.live-timestamp{font-family:'IBM Plex Mono';font-size:9px;color:var(--text3)}
.live-journalist{font-size:9px;color:var(--acc);font-weight:600}
.live-text{font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-line}
.live-text strong{font-weight:600}
.live-img{margin-top:10px;border-radius:10px;overflow:hidden}
.live-img img{width:100%;display:block;object-fit:cover}
.expand-wrap{display:none}.expand-wrap.open{display:block}
.voir-plus-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;font-size:11px;font-weight:600;color:var(--acc2);cursor:pointer;transition:color .15s;border:none;background:none;width:100%;font-family:'Poppins'}
.voir-plus-btn:hover{color:var(--acc)}
.voir-plus-btn svg{width:14px;height:14px;transition:transform .2s}
.voir-plus-btn.open-state svg{transform:rotate(180deg)}
/* Legacy toggle */
.live-expand{display:none}.live-expand.open{display:block}
.voir-plus-live{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;font-size:11px;font-weight:600;color:var(--acc2);cursor:pointer;transition:color .15s;margin-top:-8px}
.voir-plus-live:hover{color:var(--acc)}
.voir-plus-live svg{width:14px;height:14px;transition:transform .2s}
.voir-plus-live.open-state svg{transform:rotate(180deg)}
@media(max-width:768px){.live-entry{gap:10px}.live-time-col{width:30px}.live-avatar{width:30px;height:30px}}

/* ==================== ARTICLES BENTO ==================== */
.art-bento{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.art-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;cursor:pointer}
.art-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.1)}
.art-card.featured{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr}
.art-card-img{width:100%;height:180px;object-fit:cover}
.art-card.featured .art-card-img{height:100%;min-height:240px}
.art-card-body{padding:16px;display:flex;flex-direction:column}
.art-card-tag{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.art-card-title{font-family:'Josefin Sans';font-size:var(--art-ts,14px);font-weight:700;color:var(--text);line-height:1.35;margin-bottom:6px}
.art-card.featured .art-card-title{font-size:var(--art-ts-feat,18px)}
.art-card-excerpt{font-size:11px;line-height:1.6;color:var(--text2);margin-bottom:10px;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art-card-byline{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3);border-top:1px solid var(--border);padding-top:10px}
.art-card-byline-avatar{width:22px;height:22px;border-radius:50%;background:rgba(232,132,44,.1);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--acc);flex-shrink:0}
.art-card-cta{font-family:'Josefin Sans';font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--acc);padding:5px 14px;border:1.5px solid var(--acc);border-radius:6px;display:inline-flex;width:fit-content;margin-top:8px;transition:all .15s}
.art-card-cta:hover{background:var(--acc);color:#fff}
/* Old article list fallback */
.ni{padding:10px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s;display:flex;gap:12px;align-items:center}
.ni:first-of-type{border-top:none}.ni:hover{background:#F8FAFC}
.ni-img{width:100px;height:75px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#F1F5F9}
.ni-body{flex:1;min-width:0}.ni .nt{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.ni .nm{font-size:10px;color:var(--text3);margin-top:2px}
.voir-plus{display:block;padding:8px 14px;font-size:10px;font-weight:600;color:var(--acc2);text-align:center;cursor:pointer;border-top:1px solid var(--border);transition:background .1s}
.voir-plus:hover{background:#FFF7ED}
.cd-expand{display:none}.cd-expand.open{display:block}
@media(max-width:768px){.art-bento{grid-template-columns:1fr}.art-card.featured{grid-template-columns:1fr}.art-card.featured .art-card-img{min-height:180px;height:180px}}
/* Compact articles in sidebar */
.side-col .art-bento{grid-template-columns:1fr;gap:10px}
.side-col .art-card.featured{grid-template-columns:1fr}
.side-col .art-card-img{height:100px}
.side-col .art-card.featured .art-card-img{min-height:100px;height:100px}
.side-col .art-card-body{padding:10px 12px}
.side-col .art-card-title{font-size:var(--art-ts,12px)}
.side-col .art-card.featured .art-card-title{font-size:var(--art-ts,13px)}
.side-col .art-card-excerpt{font-size:10px;-webkit-line-clamp:2}
.side-col .art-card-cta{display:none}

/* ==================== INTERVIEWS (full-width bandeau) ==================== */
.itw-section{background:linear-gradient(135deg,var(--hero-bg1),var(--hero-bg2));padding:40px 0}
.itw-inner{max-width:1200px;margin:0 auto;padding:0 28px}
.itw-section-hd{text-align:center;margin-bottom:28px}
.itw-section-hd h2{font-family:'Josefin Sans';font-size:24px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:2px}
.itw-section-hd .itw-line{width:60px;height:3px;background:var(--acc);margin:8px auto;border-radius:2px}
.itw-section-hd p{font-family:'Playfair Display';font-style:italic;font-size:13px;color:rgba(255,255,255,.4)}
.itw-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;padding:26px 28px;display:flex;align-items:center;gap:24px;margin-bottom:14px;transition:background .15s}
.itw-card:hover{background:rgba(255,255,255,.09)}.itw-card:last-child{margin-bottom:0}
.itw-body{flex:1}
.itw-badge{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--acc);padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:8px}
.itw-name{font-family:'Josefin Sans';font-size:17px;font-weight:700;color:#fff;margin-bottom:4px}
.itw-quote{font-family:'Playfair Display';font-style:italic;font-size:14px;line-height:1.6;color:rgba(255,255,255,.7);margin-bottom:8px}
.itw-bio{font-size:10px;line-height:1.5;color:rgba(255,255,255,.4);margin-bottom:10px}
.itw-cta{font-family:'Josefin Sans';font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;padding:5px 14px;border:1.5px solid rgba(255,255,255,.3);border-radius:6px;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.itw-cta:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}
.itw-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid rgba(232,132,44,.35);box-shadow:0 4px 20px rgba(0,0,0,.25)}
@media(max-width:768px){.itw-inner{padding:0 12px}.itw-card{flex-direction:column-reverse;gap:14px;text-align:center;padding:20px 16px}.itw-avatar{width:80px;height:80px}.itw-name{font-size:15px}}

/* ==================== CITATIONS ==================== */
.rubrique-block{margin-bottom:24px}
.rubrique-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.rubrique-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.rubrique-name{font-family:'Josefin Sans';font-size:15px;font-weight:700;color:var(--text)}
.rubrique-count{font-size:9px;font-weight:700;color:#fff;padding:2px 8px;border-radius:20px;margin-left:auto}

.cit-hero{background:var(--pri);border-radius:18px;padding:36px;display:flex;align-items:center;gap:28px;position:relative;overflow:hidden;margin:0 0 14px}
.cit-hero::before{content:'\201C';position:absolute;top:-10px;left:20px;font-family:'Playfair Display',Georgia,serif;font-size:160px;color:rgba(232,132,44,.06);line-height:1;pointer-events:none}
.cit-hero-avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid rgba(232,132,44,.35);box-shadow:0 4px 20px rgba(0,0,0,.25);flex-shrink:0}
.cit-hero-avatar-placeholder{width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cit-hero-body{flex:1;position:relative;z-index:1}
.cit-hero-badge{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--acc);padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:8px}
.cit-hero-text{font-family:'Playfair Display';font-style:italic;font-size:16px;line-height:1.7;color:rgba(255,255,255,.85);margin-bottom:12px}
.cit-hero-name{font-family:'Josefin Sans';font-size:14px;font-weight:700;color:#fff}
.cit-hero-role{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
@media(max-width:768px){.cit-hero{flex-direction:column;padding:22px 16px;gap:16px;text-align:center;border-radius:14px}.cit-hero-avatar,.cit-hero-avatar-placeholder{width:100px;height:100px}.cit-hero-text{font-size:14px}}

.citation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:768px){.citation-grid{grid-template-columns:1fr}}
.citation-card{background:var(--pri);border-radius:14px;padding:20px 18px;position:relative;overflow:hidden;border-left:3px solid var(--acc)}
.citation-card::before{content:'\201C';position:absolute;top:6px;left:12px;font-family:'Playfair Display',Georgia,serif;font-size:80px;color:rgba(232,132,44,.08);line-height:1;pointer-events:none}
.citation-card::after{content:'\201D';position:absolute;bottom:-16px;right:16px;font-family:'Playfair Display',Georgia,serif;font-size:80px;color:rgba(232,132,44,.05);line-height:1;pointer-events:none}
.citation-text{font-size:12px;line-height:1.7;color:rgba(255,255,255,.8);font-style:italic;position:relative;z-index:1;margin-bottom:12px;padding-left:10px}
.citation-text strong{color:#FDBA74;font-weight:600;font-style:normal}
.citation-author{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.citation-avatar{width:var(--cit-av,80px);height:var(--cit-av,80px);border-radius:50%;object-fit:cover;border:2px solid rgba(232,132,44,.3);box-shadow:0 2px 10px rgba(0,0,0,.2);flex-shrink:0}
.citation-avatar-placeholder{width:var(--cit-av,80px);height:var(--cit-av,80px);border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Josefin Sans';font-size:20px;font-weight:700;color:rgba(255,255,255,.3)}
.citation-card-large{display:flex;flex-direction:column}
.citation-photo-large{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:12px}
.citation-info{flex:1}
.citation-name{font-family:'Josefin Sans';font-size:var(--cit-ns,12px);font-weight:700;color:#fff}
.citation-role{font-size:var(--cit-rs,10px);color:rgba(255,255,255,.4);margin-top:1px}
.citation-sep{border:none;border-top:1px solid rgba(255,255,255,.08);margin:14px 0}

/* ==================== CITATIONS PREMIUM ==================== */
.citation-card-pm{background:#fff;padding:22px 18px 18px;position:relative;overflow:hidden;border:var(--cit-bw,2.5px) solid var(--cit-accent,#E8842C)}
.citation-card-pm-a{border-radius:16px 0 16px 0}
.citation-card-pm-b{border-radius:0 16px 0 16px}
.citation-card-pm .cit-pm-quote{position:absolute;top:10px;right:14px;pointer-events:none;z-index:0}
.citation-card-pm .cit-pm-inner{position:relative;z-index:1}
.citation-card-pm .cit-pm-badge{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cit-accent,#E8842C);background:color-mix(in srgb, var(--cit-accent,#E8842C) 8%, transparent);padding:3px 10px;border-radius:4px;display:inline-block;margin-bottom:8px}
.citation-card-pm .cit-pm-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.citation-card-pm .cit-pm-avatar{width:var(--cit-av,80px);height:var(--cit-av,80px);border-radius:50%;object-fit:cover;border:3px solid var(--cit-accent,#E8842C);box-shadow:0 0 0 3px color-mix(in srgb, var(--cit-accent,#E8842C) 18%, transparent);flex-shrink:0}
.citation-card-pm .cit-pm-avatar-ph{width:var(--cit-av,80px);height:var(--cit-av,80px);border-radius:50%;background:#EDF2F7;border:3px solid var(--cit-accent,#E8842C);box-shadow:0 0 0 3px color-mix(in srgb, var(--cit-accent,#E8842C) 18%, transparent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Josefin Sans';font-size:20px;font-weight:700;color:#4A5568}
.citation-card-pm .cit-pm-name{font-family:'Josefin Sans';font-size:var(--cit-ns,12px);font-weight:700;color:#1A202C}
.citation-card-pm .cit-pm-role{font-size:var(--cit-rs,10px);color:#A0AEC0;margin-top:1px}
.citation-card-pm .cit-pm-text{font-family:'Playfair Display';font-style:italic;font-size:var(--cit-ts,13px);line-height:1.7;color:#4A5568;position:relative;z-index:1}
.citation-card-pm .cit-pm-text strong{color:var(--cit-accent,#E8842C);font-weight:600;font-style:normal}
.citation-card-pm .cit-pm-sep{border:none;border-top:1px solid #E2E8F0;margin:14px 0}
.citation-card-pm.citation-card-large{display:flex;flex-direction:column}
.citation-card-pm .cit-pm-photo-large{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:12px}
@media(max-width:768px){.citation-card-pm{padding:18px 14px}}

/* ==================== SIDEBAR CARDS ==================== */
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow);border-top:3px solid var(--pri);margin-bottom:14px}
.cd .hd{display:flex;align-items:center;gap:8px;padding:12px 14px}
.cd .ci{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#FEF3C7;color:#92400E}
.cd .ci svg{width:16px;height:16px}
.cd .ct{font-family:'Josefin Sans';font-size:14px;font-weight:700}
.cd .cc{font-size:9px;font-weight:700;color:#fff;padding:2px 8px;border-radius:20px;margin-left:auto;background:var(--pri)}

/* ==================== PROGRAMME ==================== */
.prog-card{background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 50%,#FDE68A 100%);border:1.5px solid #F59E0B40;border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 12px rgba(245,158,11,.08);margin-bottom:14px}
.prog-card .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #F59E0B25}
.prog-card .ci{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#F59E0B20;color:#92400E}
.prog-card .ci svg{width:16px;height:16px}
.prog-card .ct{font-family:'Josefin Sans';font-size:14px;font-weight:700;color:#78350F}
.prog-list{padding:8px 12px}
.prog-item{display:flex;gap:8px;padding:7px 10px;margin-bottom:4px;border:1px solid #F59E0B20;border-radius:8px;background:rgba(255,255,255,.5);align-items:center;transition:background .15s}
.prog-item:hover{background:rgba(255,255,255,.8)}.prog-item:last-child{margin-bottom:0}
.prog-item.prog-active{background:rgba(220,38,38,.04);border-color:rgba(220,38,38,.15)}
.prog-time{font-family:'IBM Plex Mono';font-size:10px;font-weight:600;color:#B45309;flex-shrink:0;width:38px;padding-top:1px}
.prog-body{flex:1}
.prog-label{font-size:11px;font-weight:600;color:#1C1917;line-height:1.35}
.prog-desc{font-size:9px;color:#57534E;margin-top:1px;line-height:1.4}
.prog-status{display:inline-block;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.prog-status.past{background:#E7E5E4;color:#78716C}
.prog-status.active{background:#DC2626;color:#fff;animation:livepulse 1.5s infinite}
.prog-status.upcoming{background:#FEF3C7;color:#92400E;border:1px solid #F59E0B50}

/* ==================== VIDÉOS ==================== */
.vid-block{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.vid-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.vid-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(220,38,38,.08)}
.vid-title{font-family:'Josefin Sans';font-size:15px;font-weight:700;color:var(--text)}
.vid-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 18px}
.vid-grid-shorts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 18px}
.vid-gcol{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--vw,320px),1fr));gap:12px;padding:14px 18px}
@media(max-width:768px){.vid-grid{grid-template-columns:1fr}.vid-grid-shorts{grid-template-columns:repeat(2,1fr)}.vid-gcol{grid-template-columns:repeat(auto-fill,minmax(min(var(--vw,280px),100%),1fr))}}
@media(max-width:480px){.vid-grid-shorts{grid-template-columns:1fr}.vid-gcol{grid-template-columns:1fr}}
.vid-frame{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.vid-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.vid-frame-short{padding-top:177.78%}
.vid-caption{font-size:11px;color:var(--text2);margin-top:6px;line-height:1.4}
.vid-carousel{position:relative;padding:14px 18px}
.vid-carousel-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0}
.vid-carousel-track::-webkit-scrollbar{display:none}
.vid-carousel-item{scroll-snap-align:start;flex-shrink:0}
.vid-carousel-item.vid-classic{width:320px}.vid-carousel-item.vid-short{width:200px}
@media(max-width:560px){.vid-carousel-item.vid-classic{width:260px}.vid-carousel-item.vid-short{width:160px}}
.vid-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:2}
.vid-nav:hover{background:rgba(0,0,0,.75)}.vid-nav-l{left:6px}.vid-nav-r{right:6px}
.vid-popup-link{font-family:'IBM Plex Mono';font-size:9px;color:var(--text3);text-align:center;padding:4px 0;cursor:pointer;transition:color .15s;user-select:none}
.vid-popup-link:hover{color:var(--acc)}
.vid-ig-wrap{border-radius:10px;overflow:hidden;background:#000;min-height:200px;display:flex;align-items:center;justify-content:center}
.vid-ig-wrap .instagram-media{margin:0!important;min-width:0!important;max-width:100%!important;width:100%!important;border-radius:10px!important}
.vid-ig-wrap iframe{max-width:100%!important;border-radius:10px!important}
.vid-direct{width:100%;border-radius:10px;background:#000;display:block;max-height:500px}
.vid-direct-short{max-height:none;aspect-ratio:9/16;object-fit:contain}
.vid-ext-platform-tag{position:absolute;top:6px;left:6px;z-index:2;padding:3px 8px;border-radius:4px;font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fff;pointer-events:none}
.vid-ext-platform-tag.instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.vid-ext-platform-tag.facebook{background:#1877F2}.vid-ext-platform-tag.linkedin{background:#0A66C2}
.vid-ext-card{position:relative;border-radius:10px;overflow:hidden;background:#000;cursor:pointer;transition:transform .15s;display:block;text-decoration:none}
.vid-ext-card:hover{transform:translateY(-2px)}
.vid-ext-placeholder{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--hero-bg1),var(--hero-bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.vid-ext-placeholder-short{aspect-ratio:9/16}
.vid-ext-play{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.vid-ext-play svg{width:20px;height:20px;fill:#111;margin-left:3px}

/* ==================== GALERIE ==================== */
.gallery-grid{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:var(--gal-h,260px) calc(var(--gal-h,260px) * 0.7);gap:10px}
.gallery-grid img{width:100%;height:100%;object-fit:cover;border-radius:14px;transition:transform .2s}
.gallery-grid img:hover{transform:scale(1.015)}
.gallery-grid img:first-child{grid-row:1/3}
.gallery-extra{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gallery-extra img{width:100%;height:calc(var(--gal-h,260px) * 0.65);object-fit:cover;border-radius:14px;transition:transform .2s}
.gallery-extra img:hover{transform:scale(1.015)}
@media(max-width:768px){.gallery-grid{grid-template-columns:1fr;grid-template-rows:auto}.gallery-grid img:first-child{grid-row:auto;height:180px}.gallery-grid img{height:150px}.gallery-extra{grid-template-columns:1fr 1fr}}

/* ==================== JOURNALISTES ==================== */
.jr-block{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow);border-top:3px solid var(--pri);margin-top:30px;margin-bottom:14px}
.jr-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.jr-hd .ci{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#FEF3C7;color:#92400E}
.jr-hd .ci svg{width:16px;height:16px}
.jr-hd .ct{font-family:'Josefin Sans';font-size:14px;font-weight:700}
.jr-card{padding:14px;border-bottom:1px solid var(--border)}.jr-card:last-child{border-bottom:none}
.jr-top{display:flex;align-items:center;gap:12px;margin-bottom:5px}
.jr-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--border);background:#F1F5F9}
.jr-avatar-placeholder{width:46px;height:46px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid var(--border)}
.jr-name{font-family:'Josefin Sans';font-size:var(--jr-ns,13px);font-weight:700;color:var(--text);line-height:1.3}
.jr-role{font-size:var(--jr-rs,10px);color:var(--acc);font-weight:600;margin-top:1px}
.jr-bio{font-size:12.5px;line-height:1.55;color:var(--text2);margin-bottom:6px}
.jr-socials{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jr-social-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--text3);text-decoration:none;padding:3px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--border);transition:all .15s}
.jr-social-link:hover{border-color:var(--acc);color:var(--acc)}
.jr-profile-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--acc2);text-decoration:none;margin-top:4px;transition:color .15s}
.jr-profile-link:hover{color:var(--acc)}
@media(max-width:768px){.jr-avatar,.jr-avatar-placeholder{width:40px;height:40px}.jr-name{font-size:12px}}

/* ==================== SPONSORS ==================== */
.sponsors-block{text-align:center;padding:32px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;margin:40px auto;max-width:680px}
.sponsors-block h3{font-family:'Josefin Sans';font-size:16px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.sponsors-block p{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:18px}
.sponsors-logos{display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap}
.sponsors-logos img{height:30px;opacity:.4;filter:grayscale(100%);transition:all .2s}
.sponsors-logos img:hover{opacity:.8;filter:none}

/* ==================== SOCIAL SIDEBAR ==================== */
.social-float{position:fixed;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:50}
.social-float a{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .15s;color:var(--text2)}
.social-float a:hover{border-color:var(--acc);color:var(--acc);transform:scale(1.1)}
@media(max-width:960px){.social-float{display:none}}
body.is-embed .social-float{display:none}
body.is-embed{background:transparent}

/* ==================== FOOTER ==================== */
.ft{font-size:10px;color:var(--text3);text-align:center;padding:18px 0 28px;border-top:1px solid var(--border);margin-top:20px}
.ft a{color:var(--acc2);text-decoration:none}

/* SCROLLBAR */
html,body{overflow-x:hidden}::-webkit-scrollbar{width:0;display:none}*{scrollbar-width:none}
/* ==================== EXPEDITION SKIN ==================== */
body.mode-expedition{font-family:'Archivo',sans-serif;color:var(--exp-ink);background:var(--exp-paper);scroll-behavior:smooth}
body.mode-expedition{--exp-accent:#FF6C00;--exp-ink:#111111;--exp-paper:#FFFFFF;--exp-stone:#F5F4F2;--exp-line:#E4E2DE;--exp-grey:#6E6B66}
body.mode-expedition *{scrollbar-width:thin;scrollbar-color:var(--exp-line) transparent}

/* Cobrand header */
.exp-cobrand{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--exp-line);background:var(--exp-paper);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.92)}
.exp-cobrand-left{display:flex;align-items:center;gap:14px}
.exp-cobrand-left img{height:20px;width:auto}
.exp-cobrand-x{font-family:'Libre Caslon Display',serif;font-size:17px;color:var(--exp-accent)}
.exp-cobrand-tm{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em}
.exp-live-pill{display:flex;align-items:center;gap:8px;background:var(--exp-ink);color:#fff;font-size:11px;font-weight:600;letter-spacing:.14em;padding:8px 14px;border-radius:999px;text-transform:uppercase}
.exp-live-dot{width:8px;height:8px;border-radius:50%;background:var(--exp-accent);animation:exp-pulse 1.6s infinite}
@keyframes exp-pulse{0%,100%{box-shadow:0 0 0 0 var(--exp-accent)}50%{box-shadow:0 0 0 8px transparent}}

/* Hero */
.exp-hero{position:relative;overflow:hidden;background:var(--exp-ink)}
.exp-hero-img{width:100%;height:38vh;min-height:280px;max-height:400px;object-fit:cover;opacity:.92}
.exp-hero-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,17,.05) 30%,rgba(17,17,17,.82) 100%)}
.exp-hero-inner{position:absolute;left:0;right:0;bottom:0;padding:42px 48px;color:#fff;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px}
.exp-hero-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--exp-accent);margin-bottom:14px}
.exp-hero h1{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:clamp(44px,7vw,84px);line-height:.98;letter-spacing:-.01em}
.exp-hero-tagline{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:clamp(17px,2.2vw,23px);margin-top:16px;color:#EDEBE7}
.exp-hero-meta{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.08em;color:#D8D5D0;text-align:right;line-height:2}
.exp-hero-meta strong{color:#fff}
.exp-hero-credit{position:absolute;top:18px;right:22px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.85);background:rgba(17,17,17,.45);padding:6px 10px;border-radius:3px}

/* Counters */
.exp-counters{display:grid;grid-template-columns:repeat(var(--exp-counter-cols,4),1fr);border-bottom:1px solid var(--exp-line)}
.exp-counter{padding:30px 20px;text-align:center;border-right:1px solid var(--exp-line)}
.exp-counter:last-child{border-right:none}
.exp-counter-num{font-family:'Libre Caslon Display',serif;font-size:clamp(30px,4vw,46px);line-height:1}
.exp-counter-num em{font-style:normal;color:var(--exp-accent)}
.exp-counter-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--exp-grey);margin-top:10px}

/* Map section */
.exp-mapsec{max-width:1200px;margin:0 auto;padding:64px 32px 8px}
.exp-section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.exp-section-head h2{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:34px;white-space:nowrap}
.exp-section-head .rule{flex:1;height:1px;background:var(--exp-ink)}
.exp-section-sub{font-family:'Libre Caslon Text',serif;font-style:italic;color:var(--exp-grey);font-size:15.5px;margin-bottom:38px}
.exp-map-wrap{position:relative}
#exp-routemap{height:520px;border:1px solid var(--exp-ink);filter:grayscale(1) contrast(1.04)}
.exp-map-legend{position:absolute;bottom:18px;left:18px;z-index:500;background:rgba(255,255,255,.94);border:1px solid var(--exp-line);padding:14px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;line-height:2}
.exp-map-legend b{font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px}
.exp-lg-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.exp-lg-done{background:#111}
.exp-lg-now{background:var(--exp-accent);box-shadow:0 0 0 3px rgba(255,108,0,.25)}
.exp-lg-next{background:#fff;border:2px solid #111}
.exp-pulse-marker{width:16px;height:16px;border-radius:50%;background:var(--exp-accent);border:2px solid #fff;animation:exp-pulse 1.6s infinite}
.exp-map-note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--exp-grey);letter-spacing:.06em;margin-top:10px;text-align:right}
body.mode-expedition .leaflet-popup-content-wrapper{border-radius:4px;border:1px solid #111;box-shadow:none;font-family:'Archivo',sans-serif}
body.mode-expedition .leaflet-popup-content{margin:12px 16px;font-size:13px}
.exp-pop-name{font-family:'Libre Caslon Display',serif;font-size:17px;margin-bottom:3px}
.exp-pop-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6E6B66;letter-spacing:.06em}

/* Main layout */
.exp-main{display:grid;grid-template-columns:1fr 340px;gap:56px;max-width:1200px;margin:0 auto;padding:64px 32px}

/* Fil de route */
.exp-feed{position:relative;padding-left:34px}
.exp-feed::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--exp-line)}
.exp-entry{position:relative;margin-bottom:44px;opacity:0;transform:translateY(12px);animation:exp-fadeIn .5s ease forwards}
.exp-entry:nth-child(1){animation-delay:.1s}.exp-entry:nth-child(2){animation-delay:.2s}.exp-entry:nth-child(3){animation-delay:.3s}.exp-entry:nth-child(4){animation-delay:.4s}.exp-entry:nth-child(5){animation-delay:.5s}
@keyframes exp-fadeIn{to{opacity:1;transform:translateY(0)}}
.exp-entry::before{content:"";position:absolute;left:-31px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--exp-paper);border:2px solid var(--exp-ink);transition:all .3s}
.exp-entry.now::before{background:var(--exp-accent);border-color:var(--exp-accent);box-shadow:0 0 0 4px rgba(255,108,0,.2)}
.exp-entry-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--exp-grey);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.exp-entry-meta .tag{color:var(--exp-accent);font-weight:500}
.exp-entry h3{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:24px;margin-bottom:10px;line-height:1.15}
.exp-entry p{font-size:15px;line-height:1.65;color:#333;max-width:60ch}
.exp-entry p a{color:var(--exp-accent);text-decoration:none;font-weight:600;font-size:13px}
.exp-entry p a:hover{text-decoration:underline}
.exp-entry .verbatim{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:17.5px;line-height:1.55;color:var(--exp-ink);border-left:2px solid var(--exp-accent);padding-left:18px;margin:14px 0;max-width:56ch;display:block}
.exp-entry-photo{margin-top:16px;border:1px solid var(--exp-line);overflow:hidden}
.exp-entry-photo img{width:100%;height:280px;object-fit:cover;filter:saturate(1.04);transition:transform .4s}
.exp-entry-photo:hover img{transform:scale(1.02)}
.exp-entry-photo figcaption{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--exp-grey);padding:9px 12px;display:flex;justify-content:space-between;background:var(--exp-stone)}
.exp-entry-km{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--exp-grey);margin-top:8px}
.exp-voir-plus{display:block;width:100%;text-align:center;padding:16px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--exp-accent);cursor:pointer;border:none;background:none;transition:opacity .2s}
.exp-voir-plus:hover{opacity:.7}
.exp-expand{display:none}.exp-expand.open{display:block}

/* Sidebar */
.exp-side{display:flex;flex-direction:column;gap:30px;position:sticky;top:70px;align-self:start}
.exp-card{border:1px solid var(--exp-line);padding:26px}
.exp-card-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--exp-accent);margin-bottom:16px}
.exp-reporter{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.exp-reporter img{width:52px;height:52px;border-radius:6px;object-fit:cover}
.exp-reporter-name{font-family:'Libre Caslon Display',serif;font-size:21px}
.exp-reporter-role{font-size:12.5px;color:var(--exp-grey);margin-top:3px;line-height:1.4}
.exp-card p{font-size:13.5px;line-height:1.6;color:#333}
.exp-card .sig{font-family:'Libre Caslon Text',serif;font-style:italic;color:var(--exp-ink);margin-top:12px;font-size:14.5px}
.exp-card-socials{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.exp-card-socials a{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--exp-grey);text-decoration:none;padding:4px 10px;border:1px solid var(--exp-line);border-radius:4px;transition:all .15s}
.exp-card-socials a:hover{border-color:var(--exp-accent);color:var(--exp-accent)}

/* Route list */
.exp-route{list-style:none;padding:0;margin:0}
.exp-route li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--exp-line);font-size:13px;transition:color .2s}
.exp-route li:last-child{border-bottom:none}
.exp-route .stop{font-weight:600;display:flex;align-items:center;gap:8px}
.exp-route .stop::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--exp-ink);flex-shrink:0}
.exp-route li.done .stop::before{background:var(--exp-ink);border-color:var(--exp-ink)}
.exp-route li.now .stop::before{background:var(--exp-accent);border-color:var(--exp-accent);box-shadow:0 0 0 3px rgba(255,108,0,.2)}
.exp-route .dist{font-family:'IBM Plex Mono',monospace;color:var(--exp-grey);font-size:12px;white-space:nowrap}
.exp-route li.now .stop{color:var(--exp-accent)}
.exp-route li.done{color:#9a968f}
.exp-route li.is-route .stop::before{border-radius:2px;width:6px;height:6px}
.exp-route li.is-route .stop{font-size:12.5px}

/* CTA card */
.exp-card-cta{background:var(--exp-ink);color:#fff;border:none}
.exp-card-cta .exp-card-label{color:var(--exp-accent)}
.exp-card-cta p{color:#D8D5D0}
.exp-card-cta .exp-btn{display:inline-block;margin-top:16px;background:var(--exp-accent);color:#111;font-weight:700;font-size:13px;letter-spacing:.04em;padding:12px 22px;border-radius:3px;text-decoration:none;transition:opacity .2s}
.exp-card-cta .exp-btn:hover{opacity:.85}

/* Videos */
.exp-videos{max-width:1200px;margin:0 auto;padding:0 32px 48px}
.exp-vid-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:38px}
.exp-vid-item{position:relative}
.exp-vid-frame{position:relative;width:100%;padding-top:56.25%;border:1px solid var(--exp-line);overflow:hidden;background:#000}
.exp-vid-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.exp-vid-frame-short{padding-top:177.78%}
.exp-vid-item.is-short{max-width:280px}
.exp-vid-carousel{position:relative;margin-top:38px}
.exp-vid-carousel-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0}
.exp-vid-carousel-track::-webkit-scrollbar{display:none}
.exp-vid-carousel-item{scroll-snap-align:start;flex-shrink:0}
.exp-vid-carousel-item.is-classic{width:340px}
.exp-vid-carousel-item.is-short{width:220px}
.exp-vid-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--exp-paper);border:1px solid var(--exp-line);width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:2;transition:border-color .2s}
.exp-vid-nav:hover{border-color:var(--exp-ink)}
.exp-vid-nav-l{left:-16px}
.exp-vid-nav-r{right:-16px}
.exp-vid-caption{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--exp-grey);margin-top:8px;letter-spacing:.04em}

/* Verbatims section */
.exp-verbatims{max-width:1200px;margin:0 auto;padding:0 32px 48px}
.exp-verbatim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:38px}
.exp-verbatim-card{border-left:2px solid var(--exp-accent);padding:22px 24px;background:var(--exp-stone);position:relative}
.exp-verbatim-card::before{content:'\201C';position:absolute;top:10px;right:16px;font-family:'Libre Caslon Display',serif;font-size:60px;color:var(--exp-accent);opacity:.12;line-height:1;pointer-events:none}
.exp-verbatim-text{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:15px;line-height:1.65;color:var(--exp-ink);margin-bottom:14px}
.exp-verbatim-text strong{color:var(--exp-accent);font-weight:600;font-style:normal}
.exp-verbatim-author{display:flex;align-items:center;gap:10px}
.exp-verbatim-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--exp-accent)}
.exp-verbatim-avatar-ph{width:36px;height:36px;border-radius:50%;background:var(--exp-line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--exp-grey)}
.exp-verbatim-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px}
.exp-verbatim-role{font-size:11px;color:var(--exp-grey)}

/* Articles grid */
.exp-articles{max-width:1200px;margin:0 auto;padding:0 32px 80px}
.exp-art-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:38px}
.exp-art{border:1px solid var(--exp-line);transition:transform .2s,box-shadow .2s;cursor:pointer}
.exp-art:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.08)}
.exp-art-img{height:170px;background:var(--exp-stone);position:relative;overflow:hidden}
.exp-art-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.exp-art:hover .exp-art-img img{transform:scale(1.04)}
.exp-art-body{padding:18px 20px 22px}
.exp-art-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--exp-grey);text-transform:uppercase}
.exp-art h4{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:18.5px;line-height:1.25;margin-top:8px}

/* Gallery */
.exp-gallery{max-width:1200px;margin:0 auto;padding:0 32px 48px}
.exp-gallery-grid{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:280px calc(280px * 0.5 - 5px);gap:10px;margin-top:38px}
.exp-gallery-grid .exp-gal-item:first-child{grid-row:1/3}
.exp-gal-item{position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--exp-line);background:var(--exp-stone)}
.exp-gal-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.exp-gal-item:hover img{transform:scale(1.04)}
.exp-gal-credit{position:absolute;bottom:4px;right:6px;font-family:'IBM Plex Mono',monospace;font-size:7px;color:rgba(255,255,255,.6);letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.exp-gal-caption{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;background:linear-gradient(transparent,rgba(17,17,17,.7));font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(255,255,255,.85);letter-spacing:.04em;opacity:0;transition:opacity .3s}
.exp-gal-item:hover .exp-gal-caption{opacity:1}
.exp-gallery-extra{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.exp-gallery-extra .exp-gal-item{height:180px}
.exp-gallery-extra .exp-gal-item img{height:100%}
.exp-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(17,17,17,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.exp-lightbox.open{opacity:1;pointer-events:auto}
.exp-lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border:1px solid rgba(255,255,255,.1)}
.exp-lightbox-close{position:absolute;top:20px;right:28px;font-family:'Archivo',sans-serif;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:none;border:1px solid rgba(255,255,255,.25);padding:8px 18px;cursor:pointer;transition:border-color .2s}
.exp-lightbox-close:hover{border-color:#fff}
.exp-lightbox-cap{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.06em;text-align:center;max-width:600px}
.exp-lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:1px solid rgba(255,255,255,.2);color:#fff;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.exp-lightbox-nav:hover{border-color:#fff}
.exp-lightbox-prev{left:20px}
.exp-lightbox-next{right:20px}

/* Footer */
.exp-footer{border-top:1px solid var(--exp-ink);padding:34px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.exp-footer-brand{display:flex;align-items:center;gap:12px}
.exp-footer-brand img{height:16px}
.exp-footer small{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--exp-grey);letter-spacing:.05em}

/* Hide live-mode elements in expedition mode */
body.mode-expedition .sticky-nav{display:none}
body.mode-expedition .upd-bar{display:none}
body.mode-expedition .social-float{display:none}

/* Interviews */
.exp-interviews{max-width:1200px;margin:0 auto;padding:0 32px 48px}
.exp-itw-grid{display:flex;flex-direction:column;gap:16px;margin-top:38px}
.exp-itw-card{display:flex;align-items:center;gap:28px;padding:28px 32px;border:1px solid var(--exp-line);background:var(--exp-paper);transition:transform .2s,box-shadow .2s}
.exp-itw-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.06)}
.exp-itw-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--exp-accent);opacity:.95}
.exp-itw-avatar-ph{width:88px;height:88px;border-radius:50%;flex-shrink:0;background:var(--exp-stone);display:flex;align-items:center;justify-content:center;font-family:'Libre Caslon Display',serif;font-size:28px;color:var(--exp-grey)}
.exp-itw-body{flex:1;min-width:0}
.exp-itw-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--exp-paper);background:var(--exp-ink);padding:3px 10px;display:inline-block;margin-bottom:10px}
.exp-itw-name{font-family:'Libre Caslon Display',serif;font-weight:400;font-size:22px;line-height:1.15;margin-bottom:4px}
.exp-itw-role{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--exp-grey);margin-bottom:10px}
.exp-itw-quote{font-family:'Libre Caslon Text',serif;font-style:italic;font-size:15px;line-height:1.6;color:#333;margin-bottom:10px;max-width:55ch}
.exp-itw-quote::before{content:'« ';color:var(--exp-accent);font-weight:600}
.exp-itw-quote::after{content:' »';color:var(--exp-accent);font-weight:600}
.exp-itw-bio{font-size:12px;line-height:1.55;color:var(--exp-grey);margin-bottom:12px;max-width:55ch}
.exp-itw-cta{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--exp-ink);padding:6px 16px;border:1px solid var(--exp-ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:all .2s}
.exp-itw-cta:hover{background:var(--exp-ink);color:var(--exp-paper)}

/* ===== EXPEDITION RESPONSIVE ===== */
@media(max-width:940px){
  .exp-main{grid-template-columns:1fr;padding:44px 20px;gap:40px}
  .exp-side{position:static}
  .exp-art-grid{grid-template-columns:1fr}
  .exp-verbatim-grid{grid-template-columns:1fr}
  .exp-vid-grid{grid-template-columns:1fr}
  .exp-vid-carousel-item.is-classic{width:280px}
  .exp-vid-carousel-item.is-short{width:180px}
  .exp-gallery-grid{grid-template-columns:1fr;grid-template-rows:auto}
  .exp-gallery-grid .exp-gal-item:first-child{grid-row:auto}
  .exp-gallery-grid .exp-gal-item{height:200px}
  .exp-gallery-extra{grid-template-columns:1fr 1fr}
  .exp-gallery-extra .exp-gal-item{height:150px}
  .exp-articles,.exp-videos,.exp-verbatims,.exp-interviews,.exp-gallery{padding-left:20px;padding-right:20px}
}
@media(max-width:860px){
  .exp-cobrand{padding:12px 16px}
  .exp-hero-inner{padding:28px 22px;flex-direction:column;align-items:flex-start}
  .exp-hero-meta{text-align:left}
  .exp-hero h1{font-size:clamp(32px,8vw,52px)}
  .exp-hero-img{height:32vh;min-height:200px;max-height:300px}
  .exp-counters{grid-template-columns:repeat(2,1fr)}
  .exp-counter:nth-child(2){border-right:none}
  .exp-mapsec{padding:40px 20px 8px}
  #exp-routemap{height:380px}
  .exp-map-legend{font-size:10px;padding:10px 12px}
  .exp-section-head h2{font-size:26px}
  .exp-itw-card{flex-direction:column;text-align:center;gap:16px;padding:24px 20px}
  .exp-itw-avatar,.exp-itw-avatar-ph{width:72px;height:72px}
  .exp-itw-name{font-size:19px}
  .exp-itw-quote,.exp-itw-bio{max-width:none}
}
@media(max-width:480px){
  .exp-counters{grid-template-columns:1fr}
  .exp-counter{border-right:none;border-bottom:1px solid var(--exp-line);padding:20px 16px}
  .exp-counter:last-child{border-bottom:none}
  #exp-routemap{height:300px}
  .exp-entry-photo img{height:200px}
}
</style>
</head>

<script async src="//www.instagram.com/embed.js"></script>
<nav class="sticky-nav" id="sticky-nav"><div class="sticky-nav-inner" id="sticky-nav-inner"></div></nav>
<div class="upd-bar" id="upd-bar"></div>
<div id="app">
  <div class="ld"><div class="spinner"></div><div class="tx">Chargement du live...</div></div>

function fmtTime(v){try{const d=v?.toDate?v.toDate():(v?new Date(v):null);return d&&!isNaN(d)?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'--:--';}catch(e){return '--:--';}}
function fmtDT(v){try{const d=v?.toDate?v.toDate():(v?new Date(v):null);return d&&!isNaN(d)?d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';} catch(e){return '';}}
function fmtDateFr(str){
  if(!str)return '';
  if(/janv|févr|mars|avr|mai|juin|juil|août|sept|oct|nov|déc/i.test(str)) return str;
  const enToFr={Jan:'janv.',Feb:'févr.',Mar:'mars',Apr:'avr.',May:'mai',Jun:'juin',Jul:'juil.',Aug:'août',Sep:'sept.',Oct:'oct.',Nov:'nov.',Dec:'déc.',January:'janv.',February:'févr.',March:'mars',April:'avr.',June:'juin',July:'juil.',August:'août',September:'sept.',October:'oct.',November:'nov.',December:'déc.'};
  let result=str; Object.keys(enToFr).forEach(en=>{result=result.replace(new RegExp('\\b'+en+'\\b','gi'),enToFr[en]);}); return result;
}
const _mois={'janv':0,'févr':1,'mars':2,'avr':3,'mai':4,'juin':5,'juil':6,'août':7,'sept':8,'oct':9,'nov':10,'déc':11,'janvier':0,'février':1,'avril':3,'juillet':6,'septembre':8,'octobre':9,'novembre':10,'décembre':11};
function tsVal(v){
  try{
    if(v?.toDate) return v.toDate().getTime();
    if(typeof v==='number') return v;
    if(!v) return 0;
    const d=new Date(v); if(!isNaN(d)&&d.getFullYear()>2000) return d.getTime();
    const m=String(v).match(/(\d{1,2})\s+([a-zéûô]+)\.?\s*(\d{4})?/i);
    if(m){const mon=_mois[m[2].toLowerCase()];if(mon!==undefined) return new Date(m[3]?parseInt(m[3]):new Date().getFullYear(),mon,parseInt(m[1])).getTime();}
    return 0;
  }catch(e){return 0;}
}
function autoStatus(timeStr,dayStr){
  if(!timeStr)return 'upcoming';const now=new Date();let targetDate=null;
  if(dayStr){const monthMap={'janvier':0,'février':1,'fevrier':1,'mars':2,'avril':3,'mai':4,'juin':5,'juillet':6,'août':7,'aout':7,'septembre':8,'octobre':9,'novembre':10,'décembre':11,'decembre':11,'janv':0,'févr':1,'fevr':1,'avr':3,'juil':7,'sept':8,'oct':9,'nov':10,'déc':11,'dec':11};
    const m=dayStr.match(/(\d{1,2})(?:er|e|ème|eme|nd)?\s+([a-zéûôàèê]+)\.?\s*(\d{4})?/i);
    if(m){const d=parseInt(m[1]);const mon=monthMap[m[2].toLowerCase()];const y=m[3]?parseInt(m[3]):now.getFullYear();
      if(mon!==undefined){targetDate=new Date(y,mon,d);if(!m[3]&&(now-targetDate)>180*86400000)targetDate=new Date(y+1,mon,d);}}}
  if(targetDate){const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());const tds=new Date(targetDate.getFullYear(),targetDate.getMonth(),targetDate.getDate());
    if(tds>todayStart)return 'upcoming';if(tds<todayStart)return 'past';}
  if(dayStr&&!targetDate)return 'upcoming';
  const parts=timeStr.split(':');const h=parseInt(parts[0])||0,mi=parseInt(parts[1])||0;
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mi);const diff=(now-t)/60000;
  if(diff>60)return 'past';if(diff>=-5&&diff<=60)return 'active';return 'upcoming';
}

function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function darkenHex(hex,amount){const[r,g,b]=hexToRgb(hex);return rgbToHex(r*(1-amount),g*(1-amount),b*(1-amount));}
function lightenHex(hex,amount){const[r,g,b]=hexToRgb(hex);return rgbToHex(r+(255-r)*amount,g+(255-g)*amount,b+(255-b)*amount);}

  // ===== LIVE =====
  function mkLiveEntry(e, isFirst){
    const tc = e.tag_color || _tagColorMap[(e.tag||'').toUpperCase()] || '';

  function mkLive(){
    if(mod.live===false || !live || !live.length) return '';

  // ===== ARTICLES (bento grid) =====

  function mkArticles(){

  // ===== INTERVIEWS (full-width bandeau) =====
  function mkInterviews(){
    if(mod.interviews===false || !interviews || !interviews.length) return '';
    const itwTitle = event.interviewsTitle || 'Interviews';
    const itwSub = event.interviewsSubtitle || 'Rencontres et visions sur l\'évolution du métier';

    interviews.forEach(itw => {
      const avatarHtml = itw.photo_url ? `<img class="itw-avatar" src="${itw.photo_url}" alt="" onerror="this.remove()">` : '';
      o += `<div class="itw-card"><div class="itw-body">`;
      if(itw.tag) o += `<span class="itw-badge">${itw.tag}</span>`;
      o += `<div class="itw-name">${itw.name||''}</div>`;
      if(itw.quote) o += `<div class="itw-quote">« ${itw.quote} »</div>`;

  // ===== CITATIONS =====
  const CIT_VISIBLE = event.citVisibleCount || 6;
  var _citAccordionCounter = 0;
  // SVG quote icon for premium cards
  function citQuoteSVG(){
    const col = event.citationAccentColor || '#E8842C';
    const sizes = {small:{w:30,h:24,s:.68},medium:{w:44,h:36,s:1},large:{w:58,h:48,s:1.32}};
    const sz = sizes[_citQuoteSize] || sizes.medium;
    return `<svg class="cit-pm-quote" width="${sz.w}" height="${sz.h}" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 21.6C0 10.08 6.72 2.16 17.28 0l1.92 4.32C12.48 6.24 9.12 11.52 8.64 17.28H17.28V36H0V21.6Z" fill="${col}"/><path d="M25.92 21.6C25.92 10.08 32.64 2.16 43.2 0l1.92 4.32c-6.72 1.92-10.08 7.2-10.56 12.96h8.64V36H25.92V21.6Z" fill="${col}"/></svg>`;
  }
  function mkCitations(){
    if(mod.citations===false || !citations || !citations.length) return '';
    const pubCitations=citations.filter(_isPublished);
    if(!pubCitations.length) return '';
    let o = `<div id="section-citations">${event.citationsShowTitle!==false?`<div class="sec-title fi"><div class="sec-title-icon" style="background:rgba(124,58,237,.08);color:#7C3AED">${ICO.msgCircle}</div><h2>${event.citationsTitle||'Verbatims'}</h2><div class="sec-title-line"></div><p>${event.citationsSubtitle||'Ce qu\'ils ont dit'}</p></div>`:""}</div>`;

    // Featured citation (explicitly marked with featured:true)
    const featured = pubCitations.find(c => c.featured);
    if(featured){
      const rubMatch = (rubriques||[]).find(r=>r.id===featured.rubrique);

      if(_citStyle === 'premium'){
        // Premium featured citation
        const accentCol = event.citationAccentColor || '#E8842C';
        const bgCol = _citFeatBg;
        // Auto-detect text color from bg luminance
        const _lum = (function(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const l=v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);return 0.2126*l(r)+0.7152*l(g)+0.0722*l(b);})(bgCol);
        const _dark = _lum > 0.4;
        const txtCol = _dark ? '#1A202C' : 'rgba(255,255,255,.85)';
        const nameCol = _dark ? '#1A202C' : '#fff';
        const roleCol = _dark ? '#4A5568' : 'rgba(255,255,255,.45)';
        const ini = (featured.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        const avatarHtml = featured.avatar
          ? `<img class="cit-hero-avatar" src="${featured.avatar}" alt="" style="border-color:${accentCol};box-shadow:0 0 0 4px ${accentCol}33" onerror="this.style.display='none'">`
          : `<div class="cit-hero-avatar-placeholder" style="color:${roleCol}">${ini}</div>`;
        o += `<div class="cit-hero fi" style="background:${bgCol};border:var(--cit-bw,2.5px) solid ${accentCol};border-radius:18px 0 18px 0;position:relative;overflow:hidden">${citQuoteSVG().replace('class="cit-pm-quote"','style="position:absolute;top:16px;right:20px;pointer-events:none;z-index:0;opacity:.25"')}${avatarHtml}<div class="cit-hero-body" style="position:relative;z-index:1">`;
        if(rubMatch) o += `<span class="cit-hero-badge" style="background:${accentCol}">${rubMatch.name||''}</span>`;
        o += `<div class="cit-hero-text" style="font-size:var(--cit-ts,16px);color:${txtCol}">${featured.text}</div><div class="cit-hero-name" style="font-size:var(--cit-ns,14px);color:${nameCol}">${featured.name}</div><div class="cit-hero-role" style="font-size:var(--cit-rs,11px);color:${roleCol}">${featured.role||''}</div></div></div>`;
      } else {
        // Classic featured citation
        const ini = (featured.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        const avatarHtml = featured.avatar
          ? `<img class="cit-hero-avatar" src="${featured.avatar}" alt="" onerror="this.style.display='none'">`
          : `<div class="cit-hero-avatar-placeholder">${ini}</div>`;
        o += `<div class="cit-hero fi">${avatarHtml}<div class="cit-hero-body">`;
        if(rubMatch) o += `<span class="cit-hero-badge">${rubMatch.name||''}</span>`;
        o += `<div class="cit-hero-text">${featured.text}</div><div class="cit-hero-name">${featured.name}</div><div class="cit-hero-role">${featured.role||''}</div></div></div>`;
      }
    }

    // Rest of citations by rubrique
    function mkCitGroup(group, idx){
      let out = '';
      const c0 = group[0];
      const isLarge = c0.photoFormat === 'large';

      // ---- PREMIUM STYLE ----
      if(_citStyle === 'premium'){
        const variant = (idx||0) % 2 === 0 ? 'citation-card-pm-a' : 'citation-card-pm-b';
        if(isLarge && c0.avatar){
          out += `<div class="citation-card-pm ${variant} citation-card-large">${citQuoteSVG()}<div class="cit-pm-inner"><img class="cit-pm-photo-large" src="${c0.avatar}" alt="" onerror="this.remove()"><div style="margin-bottom:12px"><div class="cit-pm-name">${c0.name}</div><div class="cit-pm-role">${c0.role||''}</div></div>`;
        } else {
          out += `<div class="citation-card-pm ${variant}">${citQuoteSVG()}<div class="cit-pm-inner">`;
          const rubMatch = (rubriques||[]).find(r=>r.id===c0.rubrique);
          if(rubMatch) out += `<div class="cit-pm-badge">${rubMatch.name||''}</div>`;
          out += `<div class="cit-pm-top">`;
          if(c0.avatar) out += `<img class="cit-pm-avatar" src="${c0.avatar}" alt="" onerror="this.style.display='none'">`;
          else { const ini=(c0.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); out += `<div class="cit-pm-avatar-ph">${ini||ICO.user}</div>`; }
          out += `<div><div class="cit-pm-name">${c0.name}</div><div class="cit-pm-role">${c0.role||''}</div></div></div>`;
        }
        group.forEach((c,i) => { if(i>0) out += `<hr class="cit-pm-sep">`; out += `<div class="cit-pm-text">${c.text}</div>`; });
        out += `</div></div>`;
        return out;
      }

      // ---- CLASSIC STYLE (original) ----
      if(isLarge && c0.avatar){
        out += `<div class="citation-card citation-card-large"><img class="citation-photo-large" src="${c0.avatar}" alt="" onerror="this.remove()"><div class="citation-info" style="margin-bottom:12px"><div class="citation-name">${c0.name}</div><div class="citation-role">${c0.role||''}</div></div>`;
      } else {
        out += `<div class="citation-card"><div class="citation-author" style="margin-bottom:12px">`;
        if(c0.avatar) out += `<img class="citation-avatar" src="${c0.avatar}" alt="" onerror="this.style.display='none'">`;
        else { const ini=(c0.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); out += `<div class="citation-avatar-placeholder">${ini||ICO.user}</div>`; }
        out += `<div class="citation-info"><div class="citation-name">${c0.name}</div><div class="citation-role">${c0.role||''}</div></div></div>`;
      }
      group.forEach((c,i) => { if(i>0) out += `<hr class="citation-sep">`; out += `<div class="citation-text">${c.text}</div>`; });
      out += `</div>`;
      return out;
    }
    function groupByPerson(arr){
      const groups=[],seen=new Map();
      arr.forEach(c=>{const key=(c.name||'').toLowerCase().trim();if(seen.has(key)){groups[seen.get(key)].push(c);}else{seen.set(key,groups.length);groups.push([c]);}});
      return groups;
    }
    function renderCitBlock(rc,rubName,rubIcon,rubColor,rubBg){
      if(!rc.length) return '';
      const groups = groupByPerson(rc);
      const accId = 'cit-acc-'+(_citAccordionCounter++);
      let out = `<div class="rubrique-block fi"><div class="rubrique-header"><div class="rubrique-icon" style="background:${rubBg};color:${rubColor}">${rubIcon}</div><div class="rubrique-name">${rubName}</div><span class="rubrique-count" style="background:${rubColor}">${rc.length}</span></div><div class="citation-grid">`;
      const cards = groups.map((g,gi) => mkCitGroup(g, gi));
      const visCards = cards.slice(0,CIT_VISIBLE), extraCards = cards.slice(CIT_VISIBLE);
      visCards.forEach(c => { out += c; });
      if(extraCards.length){
        out += `</div><div class="cd-expand" id="${accId}"><div class="citation-grid">`;
        extraCards.forEach(c => { out += c; });
        out += `</div></div><div class="voir-plus" id="${accId}-btn" data-extra="${extraCards.length}" onclick="toggleCitAccordion('${accId}')">Voir les ${extraCards.length} autres citations ▾</div>`;
      } else { out += `</div>`; }
      out += `</div>`;
      return out;
    }
    // Filter out featured from grid
    const gridCitations = featured ? pubCitations.filter(c=>c!==featured) : pubCitations;
    if(rubriques && rubriques.length){
      rubriques.forEach(rub => {
        const rc = gridCitations.filter(c => c.rubrique === rub.id);
        if(!rc.length) return;
        o += renderCitBlock(rc, rub.name, rub.icon, rub.color, rub.bg);
      });
    }
    const rubIds = new Set((rubriques||[]).map(r=>r.id));
    const orphans = gridCitations.filter(c => !c.rubrique || !rubIds.has(c.rubrique));
    if(orphans.length) o += renderCitBlock(orphans,'Verbatims','💬','#475569','#F1F5F9');
    return o;
  }

  // ===== PROGRAMME =====
  function mkProgramme(){
    if(mod.programme===false || !programme || !programme.length) return '';
    const storedOrder=event.programmeDayOrder||[];
    const grouped={};const seenDays=new Set();const allDays=[];
    programme.forEach(p=>{const d=p.day||'';if(!grouped[d])grouped[d]=[];grouped[d].push(p);if(d&&!seenDays.has(d)){seenDays.add(d);allDays.push(d);}});
    const dayOrder=[...storedOrder.filter(d=>seenDays.has(d))];
    allDays.forEach(d=>{if(!dayOrder.includes(d))dayOrder.push(d);});
    if(grouped[''])dayOrder.push('');
    Object.values(grouped).forEach(items=>items.sort((a,b)=>(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||'')));
    const hasMultipleDays=dayOrder.filter(d=>d).length>0;
    let o = `<div class="prog-card fi"><div class="hd"><div class="ci">${ICO.clipboard}</div><span class="ct">${event.programmeTitle||'Programme'}</span></div><div class="prog-list">`;
    dayOrder.forEach(day=>{
      if(!grouped[day]||!grouped[day].length)return;
      if(hasMultipleDays && day) o += `<div style="font-family:'Josefin Sans';font-size:10px;font-weight:700;color:#B45309;margin:6px 0 4px;padding:3px 8px;background:rgba(245,158,11,.1);border-radius:5px;display:inline-block">📅 ${day}</div>`;
      grouped[day].forEach(p=>{
        const st=autoStatus(p.time,day);
        const sl=st==='past'?'Terminé':st==='active'?'● En cours':'À venir';
        const hasTime=p.time&&p.time.trim();
        o += `<div class="prog-item${st==='active'?' prog-active':''}">${hasTime?`<div class="prog-time">${p.time}</div>`:''}<div class="prog-body"><div class="prog-label">${p.label}</div>${p.desc?`<div class="prog-desc">${p.desc}</div>`:''}</div><span class="prog-status ${st}">${sl}</span></div>`;
      });
    });
    o += `</div></div>`;
    return o;
  }

  // ===== VIDEOS (kept from original) =====
  function mkVideos(){
    if(mod.videos===false || !videos || !videos.length) return '';
    const sections=event.videoSections||[{id:'default',title:'Vidéos',display:'grid',visibleCount:6}];
    var _vidAccCounter=0;
    let o=`<div id="section-videos">${event.videosShowTitle!==false?`<div class="sec-title fi"><div class="sec-title-icon" style="background:rgba(220,38,38,.08);color:#DC2626">${ICO.playCircle}</div><h2>${event.videosTitle||'Vidéos'}</h2><div class="sec-title-line"></div><p>${event.videosSubtitle||'Reportages et temps forts en images'}</p></div>`:""}</div>`;

    function mkVidEmbed(v){
      const platform=v.platform||'youtube';const isShort=v.type==='short';
