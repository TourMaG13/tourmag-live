      if(platform==='instagram'&&v.url){let igUrl=v.url.split('?')[0];if(!igUrl.endsWith('/'))igUrl+='/';return `<div class="vid-ig-wrap"><blockquote class="instagram-media" data-instgrm-permalink="${igUrl}" data-instgrm-version="14" style="margin:0;width:100%;max-width:100%"><a href="${igUrl}" target="_blank">Voir sur Instagram</a></blockquote></div>${popupLink(v.url,'Instagram')}`;}
      if(platform==='facebook'&&v.url){let fbE=v.embedUrl||`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(v.url)}&width=500&show_text=false&appId=`;return `<div class="vid-frame"><iframe src="${fbE}" frameborder="0" allow="autoplay;clipboard-write;encrypted-media;picture-in-picture;web-share" allowfullscreen scrolling="no" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;overflow:hidden"></iframe></div>${popupLink(v.url,'Facebook')}`;}
      if(platform==='linkedin'&&v.url){let liE=v.embedUrl||'';if(!liE){const mU=(v.url).match(/urn:li:(\w+:\d+)/);const mA=(v.url).match(/(activity|ugcPost)[:-](\d{10,})/i);if(mU)liE=`https://www.linkedin.com/embed/feed/update/urn:li:${mU[1]}`;else if(mA){const t=mA[1].toLowerCase()==='ugcpost'?'ugcPost':'activity';liE=`https://www.linkedin.com/embed/feed/update/urn:li:${t}:${mA[2]}`;}}if(liE)return `<div class="vid-frame" style="padding-top:80%"><iframe src="${liE}" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe></div>${popupLink(v.url,'LinkedIn')}`;return `<div class="vid-ext-card" onclick="window.open('${v.url}','_vidpopup','width=920,height=640')" style="cursor:pointer"><div class="vid-ext-placeholder"><div class="vid-ext-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21"/></svg></div><div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:600">Ouvrir sur LinkedIn</div></div></div>`;}
      const linkUrl=v.url||'#';return `<div class="vid-ext-card" onclick="window.open('${linkUrl}','_vidpopup','width=920,height=640')" style="cursor:pointer"><div class="vid-ext-placeholder ${isShort?'vid-ext-placeholder-short':''}"><div class="vid-ext-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21"/></svg></div><div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:600">Voir la vidéo</div></div></div>`;
    }

    sections.forEach(sec=>{
      const secVids=videos.filter(v=>v.section===sec.id);
      const orphans=sec.id==='default'?videos.filter(v=>!v.section||!sections.find(s=>s.id===v.section)):[];
      const allVids=[...secVids,...orphans.filter(v=>!secVids.find(sv=>sv.id===v.id))].sort((a,b)=>(a.order||0)-(b.order||0));
      if(!allVids.length)return;
      const isCarousel=sec.display==='carousel';const visCount=sec.visibleCount||6;const accId='vid-acc-'+(_vidAccCounter++);
      o+=`<div class="vid-block fi"><div class="vid-hd"><span class="vid-icon">${ICO.play}</span><span class="vid-title">${sec.title||'Vidéos'}</span></div>`;
      if(isCarousel){
        o+=`<div class="vid-carousel" id="vid-car-${accId}"><div class="vid-carousel-track">`;
        allVids.forEach(v=>{const isShort=v.type==='short';o+=`<div class="vid-carousel-item ${isShort?'vid-short':'vid-classic'}">${mkVidEmbed(v)}${v.caption?`<div class="vid-caption">${v.caption}</div>`:''}</div>`;});

  // ===== JOURNALISTES =====
  const _jrIcoX='<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

  function mkJournalists(){

  // ===== GALERIE =====

  // ===== LAYOUT ASSEMBLY — 4 zones: main, side, full, max =====
  // main  = colonne principale (dans layout 2 colonnes)
  // side  = sidebar droite
  // full  = pleine largeur dans le conteneur .dash (1200px)
  // max   = pleine largeur viewport (sort du .dash)
  const blockRenderers = {hero:mkHero,kpis:mkKpis,essential:mkEssential,flash:mkFlash,live:mkLive,citations:mkCitations,videos:mkVideos,programme:mkProgramme,articles:mkArticles,journalists:mkJournalists,interviews:mkInterviews,gallery:mkGallery,sponsors:mkSponsors};
  const defaultZones = {hero:'max',kpis:'max',essential:'main',flash:'main',live:'main',citations:'full',articles:'full',interviews:'max',videos:'full',gallery:'full',programme:'side',journalists:'side',sponsors:'full'};
  const allBlockKeys = Object.keys(blockRenderers);
  const defaultOrder = ['hero','kpis','essential','flash','live','citations','articles','interviews','videos','gallery','programme','journalists','sponsors'];

  const fullBlockOrder = event.blockOrder || defaultOrder;
  const orderedKeys = [...fullBlockOrder];
  const migIdx=orderedKeys.indexOf('timeline');if(migIdx>=0)orderedKeys.splice(migIdx,1);
  function insertAfter(key, afterKey){
    if(orderedKeys.includes(key)) return;
    const idx=orderedKeys.indexOf(afterKey);
    orderedKeys.splice(idx>=0?idx+1:0, 0, key);
  }
  insertAfter('kpis','hero');
  insertAfter('essential','kpis');
  insertAfter('flash','essential');
  insertAfter('interviews','articles');
  insertAfter('gallery','videos');
  insertAfter('sponsors','gallery');
  allBlockKeys.forEach(k=>{if(!orderedKeys.includes(k))orderedKeys.push(k);});
  const validKeys=orderedKeys.filter(k=>allBlockKeys.includes(k));

  // Migrate old zone values: old 'full' → 'max' for hero/interviews/kpis
  const blockZones = {};
  const evZones = event.blockZones || {};
  Object.keys(evZones).forEach(k => {
    let z = evZones[k];
    if(z === 'full' && defaultZones[k] === 'max') z = 'max';
    blockZones[k] = z;
  });
  function getZone(k){ return blockZones[k] || defaultZones[k] || 'main'; }
  function rb(k){ const fn=blockRenderers[k]; return fn ? fn() : ''; }

  const allSideKeys = validKeys.filter(k => getZone(k) === 'side');
  const sidebarAnchor = event.sidebarAnchor || 'live';
  let _sideRendered = false, _inDash = false, _mainBuf = [];

  function _shouldRenderSide(){
    // Render sidebar when the anchor block is in the current mainBuf
    if(_sideRendered || !allSideKeys.length) return false;
    return _mainBuf.includes(sidebarAnchor);
  }
  function _flushMain(){
    if(!_mainBuf.length) return;
    if(!_inDash){ h+='<div class="dash">'; _inDash=true; }
    if(_shouldRenderSide()){
      h+='<div class="layout"><div class="main-col">';
      _mainBuf.forEach(k=>{ h+=rb(k); });
      h+='</div><div class="side-col">';
      allSideKeys.forEach(k=>{ h+=rb(k); });
      h+='</div></div>';
      _sideRendered=true;
    } else {
      _mainBuf.forEach(k=>{ h+=rb(k); });
    }
    _mainBuf=[];
  }
  function _closeDash(){
    _flushMain();
    if(_inDash){ h+='</div>'; _inDash=false; }
  }

  validKeys.forEach(key=>{
    const zone=getZone(key);
    if(zone==='side') return;
    if(zone==='max'){
      _closeDash();
      h+=rb(key);
    } else if(zone==='full'){
      _flushMain();
      if(!_inDash){ h+='<div class="dash">'; _inDash=true; }
      h+=rb(key);
    } else {
      _mainBuf.push(key);
    }
  });
  _closeDash();
  if(!_sideRendered && allSideKeys.length){
    h+='<div class="dash"><div class="layout"><div class="main-col"></div><div class="side-col">';
    allSideKeys.forEach(k=>{ h+=rb(k); });
    h+='</div></div></div>';
  }

  h += `<div class="dash"><div class="ft">Couverture en direct <a href="https://www.tourmag.com" target="_blank">TourMaG.com</a> · Powered by TourMaG Live</div></div>`;

  document.getElementById('app').innerHTML = h;
  document.getElementById('upd-bar').innerHTML = `Dernière mise à jour : ${fmtDT(new Date().toISOString())}`;

  // Sticky nav
  const navModules = [];
  if(mod.live!==false && live && live.length) navModules.push({id:'section-live',label:'Live'});
  if(mod.articles!==false && articles && articles.length) navModules.push({id:'section-articles',label:event.articlesTitle||'Nos articles'});
  if(mod.interviews!==false && interviews && interviews.length) navModules.push({id:'section-interviews',label:'Interviews'});
  if(mod.citations!==false && citations && citations.length) navModules.push({id:'section-citations',label:'Verbatims'});
  if(mod.videos!==false && videos && videos.length) navModules.push({id:'section-videos',label:'Vidéos'});
  if(mod.gallery!==false && event.gallery && event.gallery.length) navModules.push({id:'section-gallery',label:'Photos'});

  let navHtml = `<div class="sticky-nav-brand"><span class="dot"></span> ${event.title||'TourMaG Live'}</div>`;
  navModules.forEach(m => { navHtml += `<a href="#${m.id}">${m.label}</a>`; });
  document.getElementById('sticky-nav-inner').innerHTML = navHtml;

  // Sticky nav show/hide
  const heroEl = document.querySelector('.hero-split');
  if(heroEl){
    if(window._stickyObs) window._stickyObs.disconnect();
    window._stickyObs = new IntersectionObserver(([e])=>{
      document.getElementById('sticky-nav').classList.toggle('visible',!e.isIntersecting);
    },{threshold:0.05});
    window._stickyObs.observe(heroEl);
  }

  // Active section tracking
  document.querySelectorAll('.sec-title').forEach(st => {
    const parent = st.closest('[id^="section-"]') || st.parentElement;
    // Find the closest id
    let section = st;
    while(section && !section.id) section = section.parentElement;
  });

  // Smooth scroll for nav links
  document.querySelectorAll('.sticky-nav a').forEach(a=>{
    a.onclick = function(e){
      e.preventDefault();
      const tgt=document.querySelector(this.getAttribute('href'));
      if(tgt) tgt.scrollIntoView({behavior:'smooth',block:'start'});
    };
  });

  // Fade-in observer
  const obs = new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}});
  },{threshold:.06});
  document.querySelectorAll('.fi').forEach(el=>obs.observe(el));

  // Process Instagram embeds
  if(window._socialParseTimer) clearTimeout(window._socialParseTimer);
  window._socialParseTimer = setTimeout(()=>{
    try{if(window.instgrm&&window.instgrm.Embeds) window.instgrm.Embeds.process();}catch(e){}
  },400);
}

var _expMapInstance = null;

function renderExpedition(data){
  const {event,live,articles,journalists,etapes,citations,videos,interviews} = data;
  window._lastExpEvent = event;
  const exp = event.expedition || {};
  const brand = exp.branding || {};
  const accent = brand.accentColor || '#FF6C00';
  const mod = event.modules || {};

  // Apply expedition mode to body
  document.body.classList.add('mode-expedition');
  document.body.classList.remove('mode-live');
  document.documentElement.style.setProperty('--exp-accent', accent);

  const jrPhotoMap = {};
  (journalists||[]).forEach(j => { if(j.name) jrPhotoMap[j.name.toLowerCase().trim()]=j.photoUrl||''; });

  // Filter published entries
  const pubLive = (live||[]).filter(_isPublished);
  const pubCitations = (citations||[]).filter(_isPublished);
  const sortedEtapes = (etapes||[]).sort((a,b)=>(a.order||0)-(b.order||0));

  // Compute counters dynamically
  const counters = [];
  const totalKm = exp.totalKm;
  if(totalKm) counters.push({value: typeof totalKm==='number'?totalKm.toLocaleString('fr-FR'):totalKm, label:'Kilomètres'});

  if(exp.dateStart && exp.dateEnd){
    const s = new Date(exp.dateStart), e = new Date(exp.dateEnd);
    const days = Math.round(Math.abs(e - s) / 86400000);
    if(days) counters.push({value:days, label:'Jours de route'});
  }
  if(sortedEtapes.length) counters.push({value:sortedEtapes.length, label:'Étapes'});

  if(exp.dateStart){
    const startDate = new Date(exp.dateStart);
    const today = new Date(); today.setHours(0,0,0,0); startDate.setHours(0,0,0,0);
    const diffDays = Math.round((startDate - today) / 86400000);
    let cl='', lbl='';
    if(diffDays > 0){ cl=`J-${diffDays}`; lbl='Avant le départ'; }
    else if(diffDays === 0){ cl='Jour J'; lbl="C'est parti"; }
    else { cl=`J+${Math.abs(diffDays)}`; lbl='En route'; }
    counters.push({value:`<em>${cl}</em>`, label:lbl});
  }
  // Custom counters from event
  if(event.kpis && event.kpis.length) event.kpis.sort((a,b)=>(a.order||0)-(b.order||0)).forEach(k=>counters.push({value:k.value,label:k.label}));

  document.documentElement.style.setProperty('--exp-counter-cols', Math.min(counters.length, 4));

  let h = '';

  // ===== COBRAND HEADER =====
  h += `<header class="exp-cobrand">
    <div class="exp-cobrand-left">
      ${brand.partnerLogo ? `<img src="${brand.partnerLogo}" alt="${brand.partnerName||''}" onerror="this.remove()">` : ''}
      ${brand.partnerName ? `<span class="exp-cobrand-x">×</span><span class="exp-cobrand-tm">TOURMAG</span>` : `<span class="exp-cobrand-tm">TOURMAG</span>`}
    </div>
    ${event.status==='live' ? `<div class="exp-live-pill"><span class="exp-live-dot"></span>${exp.liveLabel||'En direct'}</div>` : ''}
  </header>`;

  // ===== HERO =====
  h += `<section class="exp-hero">`;
  if(event.hero_image) h += `<img class="exp-hero-img" src="${event.hero_image}" alt="" onerror="this.style.display='none'">`;
  h += `<div class="exp-hero-veil"></div>`;
  if(exp.photoCredit) h += `<div class="exp-hero-credit">Photo : © ${exp.photoCredit}</div>`;
  h += `<div class="exp-hero-inner"><div>`;
  if(exp.eyebrow) h += `<div class="exp-hero-eyebrow">${exp.eyebrow}</div>`;
  h += `<h1>${exp.editorialTitle || event.title || ''}</h1>`;
  if(exp.tagline) h += `<p class="exp-hero-tagline">${exp.tagline}</p>`;
  h += `</div><div class="exp-hero-meta">`;
  if(event.dates) h += `<strong>${event.dates}</strong><br>`;
  if(event.location) h += `${event.location}<br>`;
  if(event.subtitle) h += `${event.subtitle}`;
  h += `</div></div></section>`;

  // ===== COUNTERS =====
  if(counters.length){
    h += `<section class="exp-counters">`;
    counters.forEach(c => {
      h += `<div class="exp-counter"><div class="exp-counter-num">${c.value}</div><div class="exp-counter-label">${c.label}</div></div>`;
    });
    h += `</section>`;
  }

  // ===== MAP =====
  if(sortedEtapes.length && mod.etapes!==false){
    h += `<section class="exp-mapsec">
      <div class="exp-section-head"><h2>${exp.mapTitle||'La route, en direct'}</h2><div class="rule"></div></div>
      <p class="exp-section-sub">${exp.mapSubtitle||'Suivez l\'expédition étape par étape. Le point orange, c\'est ici et maintenant.'}</p>
      <div class="exp-map-wrap">
        <div id="exp-routemap"></div>
        <div class="exp-map-legend">
          <b>Légende</b>
          <span class="exp-lg-dot exp-lg-done"></span>Étapes franchies<br>
          <span class="exp-lg-dot exp-lg-now"></span>Position actuelle<br>
          <span class="exp-lg-dot exp-lg-next"></span>Étapes à venir
        </div>
      </div>
    </section>`;
  }

  // ===== MAIN LAYOUT (fil de route + sidebar) =====
  h += `<div class="exp-main"><div>`;

  // Section title
  h += `<div class="exp-section-head"><h2>${event.liveTitle||'Fil de route'}</h2><div class="rule"></div></div>`;
  h += `<p class="exp-section-sub">${event.liveSubtitle||'Jour après jour, depuis le terrain'}</p>`;

  // Fil de route entries
  if(pubLive.length){
    const EXP_LIVE_VIS = event.expLiveVisibleCount || 5;
    const visEntries = pubLive.slice(0, EXP_LIVE_VIS);
    const extraEntries = pubLive.slice(EXP_LIVE_VIS);

    h += `<div class="exp-feed">`;
    visEntries.forEach(entry => { h += mkExpEntry(entry, sortedEtapes, jrPhotoMap); });
    if(extraEntries.length){
      h += `<div class="exp-expand" id="exp-feed-expand">`;
      extraEntries.forEach(entry => { h += mkExpEntry(entry, sortedEtapes, jrPhotoMap); });
      h += `</div>`;
      h += `<button class="exp-voir-plus" id="exp-feed-btn" onclick="toggleExpExpand('exp-feed-expand','exp-feed-btn',${extraEntries.length})">▾ Voir les ${extraEntries.length} entrées précédentes</button>`;
    }
    h += `</div>`;
  } else {
    h += `<p style="color:var(--exp-grey);font-family:'Libre Caslon Text',serif;font-style:italic;padding:40px 0">L'expédition n'a pas encore commencé. Revenez bientôt…</p>`;
  }

  h += `</div>`;

  // ===== SIDEBAR =====
  h += `<div class="exp-side">`;

  // Reporter cards (support multiple journalists)
  const reporters = journalists||[];
  if(reporters.length){
    reporters.forEach(reporter => {
      h += `<div class="exp-card">
        <div class="exp-card-label">${reporters.length>1?'Reporter':'Votre reporter'}</div>
        <div class="exp-reporter">
          ${reporter.photoUrl ? `<img src="${reporter.photoUrl}" alt="" onerror="this.remove()">` : ''}
          <div>
            <div class="exp-reporter-name">${reporter.name||''}</div>
            ${reporter.role ? `<div class="exp-reporter-role">${reporter.role}</div>` : ''}
          </div>
        </div>
        ${reporter.bio ? `<p>${reporter.bio}</p>` : ''}`;
      // Social links
      const socials = [];
      if(reporter.twitter){const tw=reporter.twitter.startsWith('http')?reporter.twitter:'https://x.com/'+reporter.twitter.replace('@','');socials.push(`<a href="${tw}" target="_blank" rel="noopener">𝕏</a>`);}
      if(reporter.linkedin) socials.push(`<a href="${reporter.linkedin}" target="_blank" rel="noopener">LinkedIn</a>`);
      if(reporter.instagram){const ig=reporter.instagram.startsWith('http')?reporter.instagram:'https://instagram.com/'+reporter.instagram.replace('@','');socials.push(`<a href="${ig}" target="_blank" rel="noopener">Instagram</a>`);}
      if(socials.length) h += `<div class="exp-card-socials">${socials.join('')}</div>`;
      if(reporter.profileUrl) h += `<div style="margin-top:10px"><a href="${reporter.profileUrl}" target="_blank" style="font-size:12px;color:var(--exp-accent);font-weight:600;text-decoration:none">Voir ses articles sur TourMaG →</a></div>`;
      h += `</div>`;
    });
  }

  // Route/étapes list
  if(sortedEtapes.length){
    h += `<div class="exp-card">
      <div class="exp-card-label">Itinéraire</div>
      <ul class="exp-route">`;
    sortedEtapes.forEach(et => {
      const isRoute = et.type === 'route' && et.nameEnd;
      const label = isRoute ? `${et.name} → ${et.nameEnd}` : et.name;
      h += `<li class="${et.status||'next'}${isRoute?' is-route':''}"><span class="stop">${label}</span><span class="dist">${et.km||''}</span></li>`;
    });
    h += `</ul></div>`;
  }

  // CTA card (configurable)
  if(exp.cta){
    h += `<div class="exp-card exp-card-cta">
      <div class="exp-card-label">${exp.cta.label||'Ne rien manquer'}</div>
      <p>${exp.cta.text||''}</p>
      ${exp.cta.btnText && exp.cta.btnUrl ? `<a class="exp-btn" href="${exp.cta.btnUrl}" target="_blank">${exp.cta.btnText}</a>` : ''}
    </div>`;
  }

  h += `</div></div>`; // close sidebar + main layout

  // ===== VERBATIMS =====
  if(mod.citations!==false && pubCitations.length){
    h += `<section class="exp-verbatims">
      <div class="exp-section-head"><h2>${event.citationsTitle||'Verbatims'}</h2><div class="rule"></div></div>
      <p class="exp-section-sub">${event.citationsSubtitle||'Les voix du terrain'}</p>
      <div class="exp-verbatim-grid">`;
    pubCitations.forEach(c => {
      const ini = (c.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      h += `<div class="exp-verbatim-card">
        <div class="exp-verbatim-text">${c.text||''}</div>
        <div class="exp-verbatim-author">
          ${c.avatar ? `<img class="exp-verbatim-avatar" src="${c.avatar}" alt="" onerror="this.style.display='none'">` : `<div class="exp-verbatim-avatar-ph">${ini}</div>`}
          <div>
            <div class="exp-verbatim-name">${c.name||''}</div>
            ${c.role ? `<div class="exp-verbatim-role">${c.role}</div>` : ''}
          </div>
        </div>
      </div>`;
    });
    h += `</div></section>`;
  }

  // ===== INTERVIEWS =====
  const pubInterviews = (interviews||[]).sort((a,b)=>(a.order||0)-(b.order||0));
  if(mod.interviews!==false && pubInterviews.length){
    h += `<section class="exp-interviews">`;
    if(event.interviewsShowTitle!==false){
      h += `<div class="exp-section-head"><h2>${event.interviewsTitle||'Interviews'}</h2><div class="rule"></div></div>`;
      h += `<p class="exp-section-sub">${event.interviewsSubtitle||'Rencontres et regards croisés'}</p>`;
    }
    h += `<div class="exp-itw-grid">`;
    pubInterviews.forEach(itw => {
      const ini = (itw.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      h += `<div class="exp-itw-card">`;
      if(itw.photo_url){
        h += `<img class="exp-itw-avatar" src="${itw.photo_url}" alt="" onerror="this.style.display='none'">`;
      } else {
        h += `<div class="exp-itw-avatar-ph">${ini}</div>`;
      }
      h += `<div class="exp-itw-body">`;
      if(itw.tag) h += `<span class="exp-itw-tag">${itw.tag}</span>`;
      h += `<div class="exp-itw-name">${itw.name||''}</div>`;
      if(itw.role) h += `<div class="exp-itw-role">${itw.role}</div>`;
      if(itw.quote) h += `<div class="exp-itw-quote">${itw.quote}</div>`;
      if(itw.bio) h += `<div class="exp-itw-bio">${itw.bio}</div>`;
      if(itw.link) h += `<a class="exp-itw-cta" href="${itw.link}" target="_blank" rel="noopener">Lire l'interview ▸</a>`;
      h += `</div></div>`;
    });
    h += `</div></section>`;
  }

  // ===== VIDEOS =====
  if(mod.videos!==false && videos && videos.length){
    const vSections = event.videoSections || [{id:'default',title:event.videosTitle||'Vidéos',display:'grid',visibleCount:6}];
    h += `<section class="exp-videos">
      <div class="exp-section-head"><h2>${event.videosTitle||'Vidéos'}</h2><div class="rule"></div></div>
      <p class="exp-section-sub">${event.videosSubtitle||'En images, depuis le terrain'}</p>`;

    function expVidEmbed(v){
      const isShort = v.type==='short';
      const frameClass = `exp-vid-frame${isShort?' exp-vid-frame-short':''}`;
      let out = '';
      if(v.ytId){
        const embedUrl = v.embedUrl || `https://www.youtube.com/embed/${v.ytId}${isShort?'?loop=1':''}`;
        out += `<div class="${frameClass}"><iframe src="${embedUrl}" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
      } else if(v.url){
        out += `<div class="${frameClass}" style="cursor:pointer" onclick="window.open('${v.url}','_blank')"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--exp-ink)"><div style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#111"><polygon points="5 3 19 12 5 21"/></svg></div></div></div>`;
      }
      if(v.caption) out += `<div class="exp-vid-caption">${v.caption}</div>`;
      return out;
    }

    var _expVidCarCounter = 0;
    vSections.forEach(sec => {
      const secVids = videos.filter(v => v.section === sec.id);
      const orphans = sec.id==='default' ? videos.filter(v => !v.section || !vSections.find(s=>s.id===v.section)) : [];
      const allVids = [...secVids, ...orphans.filter(v => !secVids.find(sv=>sv.id===v.id))].sort((a,b)=>(a.order||0)-(b.order||0));
      if(!allVids.length) return;

      const isCarousel = sec.display === 'carousel';

      if(isCarousel){
        const carId = 'exp-vid-car-'+(_expVidCarCounter++);
        h += `<div class="exp-vid-carousel" id="${carId}"><div class="exp-vid-carousel-track">`;
        allVids.forEach(v => {
          const isShort = v.type==='short';
          h += `<div class="exp-vid-carousel-item ${isShort?'is-short':'is-classic'}">${expVidEmbed(v)}</div>`;
        });
        h += `</div><button class="exp-vid-nav exp-vid-nav-l" onclick="scrollExpVidCar('${carId}',-1)">‹</button><button class="exp-vid-nav exp-vid-nav-r" onclick="scrollExpVidCar('${carId}',1)">›</button></div>`;
      } else {
        // Grid mode
        h += `<div class="exp-vid-grid">`;
        allVids.forEach(v => {
          const isShort = v.type==='short';
          h += `<div class="exp-vid-item${isShort?' is-short':''}">${expVidEmbed(v)}</div>`;
        });
        h += `</div>`;
      }
    });

    h += `</section>`;
  }

  // ===== GALERIE PHOTOS =====
  const galPhotos = event.gallery || [];
  if(mod.gallery!==false && galPhotos.length){
    h += `<section class="exp-gallery">`;
    if(event.galleryShowTitle!==false){
      h += `<div class="exp-section-head"><h2>${event.galleryTitle||'Galerie'}</h2><div class="rule"></div></div>`;
      h += `<p class="exp-section-sub">${event.gallerySubtitle||'En images'}</p>`;
    }
    function expGalItem(p, idx){
      const url = typeof p==='string' ? p : p.url||'';
      const cap = typeof p==='object' ? p.caption||'' : '';
      const cr = typeof p==='object' ? p.copyright||'' : '';
      let out = `<div class="exp-gal-item" onclick="openExpLightbox(${idx})">`;
      out += `<img src="${url}" alt="${cap}" onerror="this.parentElement.remove()">`;
      if(cap) out += `<div class="exp-gal-caption">${cap}</div>`;
      if(cr) out += `<span class="exp-gal-credit">© ${cr}</span>`;
      out += `</div>`;
      return out;
    }
    if(galPhotos.length >= 3){
      h += `<div class="exp-gallery-grid">`;
      galPhotos.slice(0,3).forEach((p,i) => { h += expGalItem(p,i); });
      h += `</div>`;
      if(galPhotos.length > 3){
        h += `<div class="exp-gallery-extra">`;
        galPhotos.slice(3,9).forEach((p,i) => { h += expGalItem(p,i+3); });
        h += `</div>`;
      }
    } else {
      h += `<div class="exp-gallery-extra">`;
      galPhotos.forEach((p,i) => { h += expGalItem(p,i); });
      h += `</div>`;
    }
    // Lightbox container
    h += `<div class="exp-lightbox" id="exp-lightbox" onclick="if(event.target===this)closeExpLightbox()">
      <button class="exp-lightbox-close" onclick="closeExpLightbox()">Fermer</button>
      <button class="exp-lightbox-nav exp-lightbox-prev" onclick="navExpLightbox(-1)">‹</button>
      <img id="exp-lightbox-img" src="" alt="">
      <button class="exp-lightbox-nav exp-lightbox-next" onclick="navExpLightbox(1)">›</button>
      <div class="exp-lightbox-cap" id="exp-lightbox-cap"></div>
    </div>`;
    h += `</section>`;
  }

  // ===== ARTICLES =====
  if(mod.articles!==false && articles && articles.length){
    h += `<section class="exp-articles">
      <div class="exp-section-head"><h2>${event.articlesTitle||'Articles'}</h2><div class="rule"></div></div>
      <p class="exp-section-sub">${event.articlesSubtitle||'Les articles liés à cette expédition'}</p>
      <div class="exp-art-grid">`;
    articles.forEach(a => {
      const link = a.link ? ` onclick="window.open('${a.link}','_blank')"` : '';
      h += `<div class="exp-art"${link}>
        ${a.image ? `<div class="exp-art-img"><img src="${a.image}" alt="" onerror="this.parentElement.remove()"></div>` : ''}
        <div class="exp-art-body">
          <div class="exp-art-date">${fmtDateFr(a.date)||a.tag||''}</div>
          <h4>${a.title||''}</h4>
        </div>
      </div>`;
    });
    h += `</div></section>`;
  }

  // ===== FOOTER =====
  h += `<footer class="exp-footer">
    <div class="exp-footer-brand">
      ${brand.partnerLogo ? `<img src="${brand.partnerLogo}" alt="" onerror="this.remove()">` : ''}
      <span class="exp-cobrand-x">×</span>
      <span class="exp-cobrand-tm" style="font-size:13px">TOURMAG</span>
    </div>
    <small>${exp.footerCredits||'Powered by TourMaG Live'}</small>
  </footer>`;

  // ===== INJECT HTML =====
  document.getElementById('app').innerHTML = h;

  // ===== INIT LEAFLET MAP =====
  if(sortedEtapes.length && mod.etapes!==false && document.getElementById('exp-routemap')){
    if(_expMapInstance){ _expMapInstance.remove(); _expMapInstance=null; }

    const map = L.map('exp-routemap', {scrollWheelZoom:false});
    _expMapInstance = map;
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution:'© OpenStreetMap © CARTO', maxZoom:12
    }).addTo(map);

    // Build ordered waypoint chain (handles both stop & route étapes)
    const chain = [];
    sortedEtapes.forEach(s => {
      if(!s.lat || !s.lng) return;
      chain.push({coord:[s.lat,s.lng], status:s.status, etape:s, isEnd:false});
      if(s.type==='route' && s.latEnd && s.lngEnd){
        chain.push({coord:[s.latEnd,s.lngEnd], status:s.status, etape:s, isEnd:true});
      }
    });

    // Polylines — done (solid accent) & future (dashed black)
    // "now" points appear in both so the lines connect at the current position
    const doneCoords=[], futureCoords=[];
    chain.forEach(w => {
      if(w.status==='done' || w.status==='now') doneCoords.push(w.coord);
      if(w.status==='now' || w.status==='next') futureCoords.push(w.coord);
    });
    if(futureCoords.length>1) L.polyline(futureCoords, {color:'#111', weight:2, dashArray:'6 8', opacity:.55}).addTo(map);
    if(doneCoords.length>1) L.polyline(doneCoords, {color:accent, weight:3.5, opacity:.95}).addTo(map);

    // Markers
    const allCoords = [];
    sortedEtapes.forEach(s => {
      if(!s.lat || !s.lng) return;
      const isRoute = s.type==='route' && s.latEnd && s.lngEnd;

      // — Departure / single point marker
      allCoords.push([s.lat,s.lng]);
      let mDep;
      if(s.status==='now' && !isRoute){
        // Stop "now" → pulse
        mDep = L.marker([s.lat,s.lng], {icon: L.divIcon({className:'', html:`<div class="exp-pulse-marker" style="background:${accent}"></div>`, iconSize:[16,16], iconAnchor:[8,8]})});
      } else if(s.status==='now' && isRoute){
        // Route "now" → small filled dot at departure (already left)
        mDep = L.circleMarker([s.lat,s.lng], {radius:5, color:accent, weight:2, fillColor:accent, fillOpacity:.5});
      } else if(s.status==='done'){
        mDep = L.circleMarker([s.lat,s.lng], {radius:isRoute?4:6, color:'#111', weight:2, fillColor:'#111', fillOpacity:1});
      } else {
        mDep = L.circleMarker([s.lat,s.lng], {radius:isRoute?4:6, color:'#111', weight:2, fillColor:'#fff', fillOpacity:1});
      }
      const depPopup = isRoute
        ? `<div class="exp-pop-name">${s.name}</div><div class="exp-pop-meta">Départ · ${s.dateLabel||''}</div>`
        : `<div class="exp-pop-name">${s.name}</div><div class="exp-pop-meta">${s.dateLabel||''} · ${s.km||''}</div>`;
      mDep.addTo(map).bindPopup(depPopup);

      // — Arrival marker (route only)
      if(isRoute){
        allCoords.push([s.latEnd,s.lngEnd]);
        let mArr;
        if(s.status==='now'){
          // Currently en route → pulse at arrival (destination)
          mArr = L.marker([s.latEnd,s.lngEnd], {icon: L.divIcon({className:'', html:`<div class="exp-pulse-marker" style="background:${accent}"></div>`, iconSize:[16,16], iconAnchor:[8,8]})});
        } else if(s.status==='done'){
          mArr = L.circleMarker([s.latEnd,s.lngEnd], {radius:6, color:'#111', weight:2, fillColor:'#111', fillOpacity:1});
        } else {
          mArr = L.circleMarker([s.latEnd,s.lngEnd], {radius:6, color:'#111', weight:2, fillColor:'#fff', fillOpacity:1});
        }
        mArr.addTo(map).bindPopup(`<div class="exp-pop-name">${s.nameEnd||''}</div><div class="exp-pop-meta">Arrivée · ${s.km||''}</div>`);
      }
    });

    if(allCoords.length) map.fitBounds(L.latLngBounds(allCoords).pad(0.12));
  }

  // Fade-in observer
  const obs = new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}});
  },{threshold:.06});
  document.querySelectorAll('.fi').forEach(el=>obs.observe(el));

  // Instagram embeds
  if(window._socialParseTimer) clearTimeout(window._socialParseTimer);
  window._socialParseTimer = setTimeout(()=>{
    try{if(window.instgrm&&window.instgrm.Embeds) window.instgrm.Embeds.process();}catch(e){}
  },400);
}

// Expedition toggle (simpler than live, no chevron SVG)
window.toggleExpExpand = function(expandId, btnId, count){
  const el=document.getElementById(expandId), btn=document.getElementById(btnId);
  if(!el||!btn) return;
  const open=el.classList.toggle('open');
  btn.textContent = open ? '▴ Réduire' : `▾ Voir les ${count} entrées précédentes`;
  if(typeof sendHeight==='function') setTimeout(sendHeight,50);
};

// ===== EXPEDITION LIGHTBOX =====
let _expLbPhotos=[], _expLbIdx=0;

window.scrollExpVidCar = function(carId, dir){
  const el = document.getElementById(carId);
  if(!el) return;
  const track = el.querySelector('.exp-vid-carousel-track');
  if(!track) return;
  const scrollAmt = track.clientWidth * 0.7;
  track.scrollBy({left: dir * scrollAmt, behavior:'smooth'});
};
window.openExpLightbox = function(idx){
  const ev = window._lastExpEvent;
  if(!ev || !ev.gallery) return;
  _expLbPhotos = ev.gallery;
  _expLbIdx = idx;
  _expLbShow();
};
function _expLbShow(){
  const lb = document.getElementById('exp-lightbox');
  if(!lb) return;
  const p = _expLbPhotos[_expLbIdx];
  const url = typeof p==='string' ? p : p.url||'';
  const cap = typeof p==='object' ? p.caption||'' : '';
  const cr = typeof p==='object' ? p.copyright||'' : '';
  document.getElementById('exp-lightbox-img').src = url;
  const capEl = document.getElementById('exp-lightbox-cap');
  capEl.textContent = cap + (cr ? '  © '+cr : '');
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
window.closeExpLightbox = function(){
  const lb = document.getElementById('exp-lightbox');
  if(lb) lb.classList.remove('open');
  document.body.style.overflow = '';
};
window.navExpLightbox = function(dir){
  _expLbIdx = (_expLbIdx + dir + _expLbPhotos.length) % _expLbPhotos.length;
  _expLbShow();
};
document.addEventListener('keydown', function(e){
  const lb = document.getElementById('exp-lightbox');
  if(!lb || !lb.classList.contains('open')) return;
  if(e.key==='Escape') closeExpLightbox();
  if(e.key==='ArrowLeft') navExpLightbox(-1);
  if(e.key==='ArrowRight') navExpLightbox(1);
});

// Expedition entry builder
function mkExpEntry(entry, etapes, jrPhotoMap){
  const jrKey = (entry.journalist||'').toLowerCase().trim();
  const jrPhoto = jrPhotoMap[jrKey] || '';
  const etape = entry.etape ? (etapes||[]).find(e=>e.id===entry.etape) : null;
  const isNow = etape && etape.status === 'now';

  let o = `<div class="exp-entry${isNow?' now':''}">`;
  o += `<div class="exp-entry-meta">`;
  o += `<span>${fmtTime(entry.time)}</span>`;
  if(entry.tag) o += `<span class="tag">${entry.tag}</span>`;
  if(entry.journalist) o += `<span>${entry.journalist}</span>`;
  if(etape) o += `<span>📍 ${etape.name}</span>`;
  o += `</div>`;

  if(entry.title) o += `<h3>${entry.title}</h3>`;

  if(entry.text){
    let txt = entry.text;
    // Wrap «...» in verbatim spans
    txt = txt.replace(/«\s*([^»]+)\s*»/g, '<span class="verbatim">« $1 »</span>');
    // Support links
    if(entry.url) txt += ` <a href="${entry.url}" target="_blank">→ Lire la suite</a>`;
    o += `<p>${txt}</p>`;
  }

  if(entry.image){
    o += `<figure class="exp-entry-photo">
      <img src="${entry.image}" alt="" style="height:${entry.image_height||280}px;object-position:${entry.image_position||'center center'}" onerror="this.parentElement.remove()">
      <figcaption>
        <span>${entry.image_caption||''}</span>
        <span>${entry.image_credit ? '© '+entry.image_credit : ''}</span>
      </figcaption>
    </figure>`;
  }

  if(etape && etape.km) o += `<div class="exp-entry-km">${etape.km}</div>`;

  o += `</div>`;
  return o;
}

// ============================================================
// INIT
// ============================================================
async function init(){
  const eventId = new URLSearchParams(window.location.search).get('event');
  if(!eventId){ document.getElementById('app').innerHTML='<div class="ld"><div class="tx">Aucun événement spécifié</div></div>'; return; }
  const ec=db.collection('events').doc(eventId);
  const [evS,esS,liS,ruS,ciS,arS,prS,tlS,viS,iwS,etS] = await Promise.all([
    ec.get(),
    ec.collection('essential').get(),
    ec.collection('live').get(),
    ec.collection('rubriques').get(),
    ec.collection('citations').get(),
    ec.collection('articles').get(),
    ec.collection('programme').get(),
    ec.collection('timeline').get(),
    ec.collection('videos').get(),
    ec.collection('interviews').get(),
    ec.collection('etapes').get()
  ]);
  var jrS=null;
  try{ jrS=await db.collection('journalists').get(); }catch(e){ console.warn('[TourMaG Live] Cannot read journalists:',e.message); }
  if(!evS.exists){ document.getElementById('app').innerHTML='<div class="ld"><div class="tx">Événement introuvable</div></div>'; return; }
  const ev=evS.data();
  function toArr(s){ const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()})); return a; }
  var _allGlobalJournalists=jrS?toArr(jrS):[];
  function resolveJournalists(evData,globalArr){
    const ej=evData.eventJournalists||[];
    return ej.sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>globalArr.find(g=>g.id===x.globalId)).filter(Boolean);
  }
  const ess=toArr(esS).sort((a,b)=>(a.order||0)-(b.order||0));
  const li=toArr(liS).sort((a,b)=>tsVal(b.time)-tsVal(a.time));
  const ru=toArr(ruS).sort((a,b)=>(a.order||0)-(b.order||0));
  const ci=toArr(ciS).sort((a,b)=>tsVal(b.created_at)-tsVal(a.created_at));
  const ar=toArr(arS).sort((a,b)=>tsVal(b.created_at||b.date)-tsVal(a.created_at||a.date));
  const pr=toArr(prS).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||''));
  const tl=toArr(tlS).sort((a,b)=>(a.order||0)-(b.order||0));
  const vi=toArr(viS).sort((a,b)=>(a.order||0)-(b.order||0));
  const iw=toArr(iwS).sort((a,b)=>(a.order||0)-(b.order||0));
  const et=toArr(etS).sort((a,b)=>(a.order||0)-(b.order||0));
  const jr=resolveJournalists(ev,_allGlobalJournalists);
  render({event:ev,essential:ess,live:li,rubriques:ru,citations:ci,articles:ar,programme:pr,timeline:tl,videos:vi,journalists:jr,interviews:iw,etapes:et});

  var rtState={event:ev,essential:ess,live:li,rubriques:ru,citations:ci,articles:ar,programme:pr,timeline:tl,videos:vi,journalists:jr,interviews:iw,etapes:et};
  function rtRender(){ rtState.journalists=resolveJournalists(rtState.event,_allGlobalJournalists); render(rtState); }

  ec.collection('live').onSnapshot(snap=>{rtState.live=toArr(snap).sort((a,b)=>tsVal(b.time)-tsVal(a.time));rtRender();});
  ec.collection('rubriques').onSnapshot(snap=>{rtState.rubriques=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('articles').onSnapshot(snap=>{rtState.articles=toArr(snap).sort((a,b)=>tsVal(b.created_at||b.date)-tsVal(a.created_at||a.date));rtRender();});
  ec.collection('citations').onSnapshot(snap=>{rtState.citations=toArr(snap).sort((a,b)=>tsVal(b.created_at)-tsVal(a.created_at));rtRender();});
  ec.collection('essential').onSnapshot(snap=>{rtState.essential=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('programme').onSnapshot(snap=>{rtState.programme=toArr(snap).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||''));rtRender();});
  ec.collection('timeline').onSnapshot(snap=>{rtState.timeline=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('videos').onSnapshot(snap=>{rtState.videos=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('interviews').onSnapshot(snap=>{rtState.interviews=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('etapes').onSnapshot(snap=>{rtState.etapes=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.onSnapshot(snap=>{if(snap.exists){rtState.event=snap.data();rtRender();}});
  try{
    db.collection('journalists').onSnapshot(snap=>{_allGlobalJournalists=toArr(snap);rtRender();},err=>console.warn('[TourMaG Live] journalists error:',err.message));
  }catch(e){console.warn('[TourMaG Live] Cannot subscribe to journalists:',e.message);}

  // Scheduling check every 30s
  var _lastScheduleCheck=Date.now();
  setInterval(()=>{
    const now=Date.now();
    const hasNew=(rtState.live||[]).concat(rtState.citations||[]).some(e=>{
      if(!e.scheduledAt)return false;
      const sd=e.scheduledAt?.toDate?e.scheduledAt.toDate():(e.scheduledAt?.seconds?new Date(e.scheduledAt.seconds*1000):new Date(e.scheduledAt));
      return !isNaN(sd)&&sd.getTime()<=now&&sd.getTime()>_lastScheduleCheck;
    });
    _lastScheduleCheck=now;
    if(hasNew) rtRender();
  },30000);
}
init().catch(e=>{console.error(e);document.getElementById('app').innerHTML='<div class="ld" style="color:#DC2626">Erreur — voir console</div>'});

// IFRAME RESIZE + FULL-WIDTH
function sendHeight(){
  const h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,document.documentElement.offsetHeight);
  window.parent.postMessage({type:'tourmag-live-resize',height:h},'*');
  window.parent.postMessage({type:'setHeight',height:h},'*');
}
function requestFullWidth(){
  window.parent.postMessage({type:'tourmag-live-fullwidth'},'*');
}
window.addEventListener('load',()=>{
  document.documentElement.style.overflow='visible';document.body.style.overflow='visible';
  sendHeight();
  requestFullWidth();
  [100,300,600,1000,2000,4000].forEach(d=>setTimeout(()=>{sendHeight();requestFullWidth();},d));
  new MutationObserver(()=>{sendHeight();setTimeout(sendHeight,100);}).observe(document.body,{childList:true,subtree:true,attributes:true});
  new ResizeObserver(sendHeight).observe(document.body);
  setInterval(sendHeight,1500);
});
</script>
