<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TourMaG Live — Encart Expédition (Grand)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

.encart{
  display:flex;align-items:center;gap:32px;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#1a1a3e 100%);
  border-radius:14px;padding:32px 36px;min-height:280px;
  position:relative;overflow:hidden;cursor:default;
}
.encart::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 15% 85%,rgba(56,189,248,.07) 0%,transparent 45%),
             radial-gradient(ellipse at 85% 15%,rgba(168,85,247,.06) 0%,transparent 45%),
             radial-gradient(ellipse at 50% 50%,rgba(99,102,241,.03) 0%,transparent 60%);
  pointer-events:none;
}
.encart::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg at 50% 50%,transparent 0deg,rgba(255,255,255,.012) 60deg,transparent 120deg);
  animation:shimmer 12s linear infinite;pointer-events:none;
}
@keyframes shimmer{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.left{flex:1;min-width:0;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.logo{max-height:48px;max-width:200px;object-fit:contain;display:block}
.title{font-size:1.4rem;font-weight:700;color:#f1f5f9;line-height:1.3;letter-spacing:-.01em}
.subtitle{font-size:.88rem;color:#94a3b8;line-height:1.6;max-width:380px}
.cta{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:6px;padding:11px 22px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  color:#fff;font-size:.82rem;font-weight:600;
  border-radius:10px;text-decoration:none;
  transition:transform .2s,box-shadow .2s;
  align-self:flex-start;
  box-shadow:0 2px 12px rgba(99,102,241,.3);
}
.cta:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(99,102,241,.45)}
.cta svg{width:16px;height:16px}

/* Carousel zone — larger */
.right{
  width:320px;min-width:320px;height:220px;
  position:relative;z-index:1;
  perspective:800px;
  border-radius:12px;overflow:hidden;
  box-shadow:0 10px 36px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.08);
}
.carousel{
  width:100%;height:100%;position:relative;
  will-change:transform;
  transition:transform .12s ease-out;
}
.carousel img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .8s ease;
}
.carousel img.active{opacity:1}

/* Dots */
.dots{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:3;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.35);transition:background .3s,transform .3s;
  cursor:pointer;
}
.dot.active{background:#fff;transform:scale(1.3)}

.no-screens{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:#475569;font-size:12px;text-align:center;
  border:1px dashed #334155;border-radius:10px;
}

@media(max-width:600px){
  .encart{flex-direction:column;text-align:center;padding:24px 20px;gap:20px}
  .left{align-items:center}
  .subtitle{max-width:none}
  .cta{align-self:center}
  .right{width:100%;min-width:0;height:180px}
}
</style>
</head>
<body>
<div class="encart" id="encart">
  <div class="left">
    <img class="logo" id="logo" src="" alt="" style="display:none">
    <div class="title" id="title">Suivez l'expédition en direct</div>
    <div class="subtitle" id="subtitle">Carnet de route, étapes, interviews, galerie photo…</div>
    <a class="cta" id="cta" href="#" target="_top">
      Accéder au live
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
  <div class="right" id="screens-zone">
    <div class="carousel" id="carousel"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCiVnKKLqST7G-8s7ULMCmGKUnWwgjyL0Y",
  authDomain:"tourmag-live.firebaseapp.com",
  projectId:"tourmag-live"
});
const db=firebase.firestore();
const params=new URLSearchParams(location.search);
const eventId=params.get('event');
if(!eventId){document.body.innerHTML='<p style="color:#ef4444;padding:20px">Paramètre ?event= manquant</p>';}
const baseUrl='https://tourmag13.github.io/tourmag-live/v3/index.html?event='+eventId;

let currentSlide=0,slideCount=0,autoTimer=null;

async function init(){
  const snap=await db.collection('events').doc(eventId).get();
  if(!snap.exists) return;
  const ev=snap.data();
  const enc=ev.expEncart||{};

  const logoUrl=enc.logo||ev.logo_url||'';
  const logoEl=document.getElementById('logo');
  if(logoUrl){logoEl.src=logoUrl;logoEl.style.display='block';}

  if(enc.title) document.getElementById('title').textContent=enc.title;
  else if(ev.title) document.getElementById('title').textContent=ev.title;
  if(enc.subtitle) document.getElementById('subtitle').textContent=enc.subtitle;

  const ctaEl=document.getElementById('cta');
  ctaEl.href=enc.ctaUrl||baseUrl;
  if(enc.ctaLabel) ctaEl.firstChild.textContent=enc.ctaLabel+' ';

  const screens=(enc.screenshots||[]).filter(Boolean);
  const carousel=document.getElementById('carousel');
  const dotsEl=document.getElementById('dots');

  if(screens.length===0){
    document.getElementById('screens-zone').innerHTML='<div class="no-screens">Captures à configurer</div>';
    return;
  }

  slideCount=screens.length;
  screens.forEach((url,i)=>{
    const img=document.createElement('img');
    img.src=url;img.alt='Capture '+(i+1);
    if(i===0) img.classList.add('active');
    carousel.appendChild(img);

    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>goTo(i);
    dotsEl.appendChild(dot);
  });

  if(slideCount>1) autoTimer=setInterval(()=>goTo((currentSlide+1)%slideCount),3500);
  initParallax();
  sendResize();
}

function goTo(idx){
  const imgs=document.querySelectorAll('#carousel img');
  const dots=document.querySelectorAll('.dot');
  imgs[currentSlide].classList.remove('active');
  dots[currentSlide].classList.remove('active');
  currentSlide=idx;
  imgs[currentSlide].classList.add('active');
  dots[currentSlide].classList.add('active');
  if(autoTimer) clearInterval(autoTimer);
  autoTimer=setInterval(()=>goTo((currentSlide+1)%slideCount),3500);
}

function initParallax(){
  const encart=document.getElementById('encart');
  const carousel=document.getElementById('carousel');
  encart.addEventListener('mousemove',e=>{
    const rect=encart.getBoundingClientRect();
    const cx=(e.clientX-rect.left)/rect.width-0.5;
    const cy=(e.clientY-rect.top)/rect.height-0.5;
    carousel.style.transform='translate('+(-cx*14)+'px,'+(-cy*10)+'px) scale(1.06)';
  });
  encart.addEventListener('mouseleave',()=>{
    carousel.style.transform='translate(0,0) scale(1)';
  });
}

function sendResize(){
  requestAnimationFrame(()=>{
    const h=document.getElementById('encart').offsetHeight;
    parent.postMessage({type:'tmg-encart-resize',height:h,id:(()=>{try{return window.frameElement?window.frameElement.id:'';}catch(e){return '';}})()},'*');
  });
}

init();
</script>
</body>
</html>
