<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourMaG Live — Back-office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pri:#1B1B2F;--acc:#E8842C;--acc2:#D4731D;--blue:#0C6CA1;--green:#059669;--red:#DC2626;--amber:#D97706;--violet:#7C3AED;--bg:#F8FAFC;--card:#FFF;--text:#111827;--text2:#4B5563;--text3:#9CA3AF;--border:#E5E7EB;--rl:12px;--shadow:0 2px 12px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* AUTH */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--pri)}
.auth-box{background:var(--card);border-radius:16px;padding:40px 36px;width:360px;max-width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-box h1{font-family:'Josefin Sans';font-size:22px;font-weight:700;margin-bottom:4px;text-align:center}
.auth-box h1 span{color:var(--acc)}
.auth-box .sub{font-size:11px;color:var(--text3);text-align:center;margin-bottom:24px}
.auth-box .form-row{margin-bottom:14px}
.auth-box .auth-err{font-size:11px;color:var(--red);text-align:center;margin-bottom:12px;min-height:16px}

/* NAV */
.topbar{background:var(--pri);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.topbar-hamburger{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;flex-shrink:0}
.topbar-hamburger:hover{background:rgba(255,255,255,.1)}
.topbar-logo{font-family:'Josefin Sans';font-size:16px;font-weight:700;color:#fff;white-space:nowrap}
.topbar-logo span{color:var(--acc)}
.topbar-event-select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;font-size:11px;color:#fff;font-family:'Poppins';cursor:pointer;max-width:220px;min-width:0}
.topbar-event-select option{background:var(--pri);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-user{font-size:10px;color:rgba(255,255,255,.5)}
.topbar-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 1.5s infinite;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar-btn{padding:6px 16px;font-size:11px;font-weight:600;border:none;border-radius:6px;cursor:pointer;font-family:'Poppins';transition:all .15s}
.topbar-btn.ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}.topbar-btn.ghost:hover{background:rgba(255,255,255,.15)}

.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 48px)}
.mobile-sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:149}
.mobile-sidebar-overlay.show{display:block}

.sidebar{background:var(--card);border-right:1px solid var(--border);padding:20px 0}
.sidebar-section{font-family:'Josefin Sans';font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text3);padding:16px 20px 8px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .1s;border-left:3px solid transparent}
.sidebar-item:hover{background:#F1F5F9;color:var(--text)}
.sidebar-item.active{background:#FFF7ED;color:var(--acc);border-left-color:var(--acc);font-weight:600}
.sidebar-item .icon{width:20px;text-align:center;font-size:14px}
.sidebar-item .badge{margin-left:auto;font-size:9px;font-weight:700;color:#fff;background:var(--acc);padding:1px 7px;border-radius:10px}

.admin-main{padding:24px 32px;max-width:960px;overflow-y:auto}

/* ==================== RESPONSIVE MOBILE ==================== */
@media(max-width:768px){
  .topbar{padding:10px 12px;gap:8px}
  .topbar-hamburger{display:block}
  .topbar-logo{font-size:13px}
  .topbar-event-select{max-width:120px;font-size:10px;padding:4px 6px}
  .topbar-right{gap:6px}
  .topbar-user{display:none}
  .topbar-btn{padding:5px 10px;font-size:10px}
  .admin-layout{grid-template-columns:1fr}
  .sidebar{display:none;position:fixed;top:0;left:0;bottom:0;width:260px;z-index:150;box-shadow:4px 0 24px rgba(0,0,0,.15);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sidebar.mobile-open{display:block;animation:slideIn .2s ease-out}
  @keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  .admin-main{padding:16px 10px}
  .page-title{font-size:18px!important}
  .page-desc{font-size:11px!important}
  .admin-card{padding:14px 12px!important;margin-bottom:14px!important;border-radius:12px!important}
  .admin-card h3{font-size:13px!important}
  .form-row-inline{grid-template-columns:1fr!important}
  .form-input,.form-input:focus,textarea.form-input,select.form-input{font-size:16px!important;padding:10px 12px!important}
  .form-label{font-size:11px!important}
  .btn{padding:10px 16px!important;font-size:12px!important}
  .btn-sm{padding:8px 12px!important;font-size:11px!important}
  .btn-xs{padding:6px 10px!important;font-size:10px!important;min-height:32px}
  .list-item{flex-wrap:wrap;gap:8px;padding:10px!important}
  .list-item-actions{width:100%;justify-content:flex-end;gap:6px;margin-top:4px}
  .list-item-time{font-size:11px;width:auto}
  .list-item-text{font-size:12px}
  .toggle-row{flex-wrap:wrap;padding:10px 0;gap:8px}
  .toggle-label{font-size:12px}
  .event-card{padding:14px}
  .block-layout-body{grid-template-columns:1fr!important}
  .block-layout-main{border-right:none!important;border-bottom:1px solid var(--border)}
  .modal-box{width:95vw!important;max-width:none!important;max-height:90vh!important;margin:20px auto!important;border-radius:14px!important;padding:18px!important}
  .modal-footer{flex-wrap:wrap;gap:8px}
  .modal-footer .btn{flex:1;min-width:100px;text-align:center;justify-content:center}
  .ess-item{flex-wrap:wrap;gap:6px}
  .saving-indicator{top:48px;right:10px;font-size:9px}
  .media-grid{grid-template-columns:repeat(3,1fr)!important}
}

.page-title{font-family:'Josefin Sans';font-size:22px;font-weight:700;margin-bottom:6px}
.page-desc{font-size:12px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.admin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.admin-card h3{font-family:'Josefin Sans';font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-row{margin-bottom:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'Poppins';color:var(--text);transition:border .15s;background:var(--bg)}
.form-input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(232,132,44,.1)}
textarea.form-input{resize:vertical;min-height:80px;line-height:1.6}
select.form-input{cursor:pointer}
.form-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.btn{padding:8px 20px;font-size:12px;font-weight:600;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins';transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--acc);color:#fff}.btn-primary:hover:not(:disabled){background:var(--acc2)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover:not(:disabled){background:#B91C1C}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-ghost:hover{background:#F1F5F9}
.btn-sm{padding:5px 12px;font-size:10px}
.btn-xs{padding:3px 8px;font-size:9px;border-radius:4px}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px}
.toggle{position:relative;width:40px;height:22px;cursor:pointer}
.toggle input{display:none}
.toggle-track{position:absolute;inset:0;background:#D1D5DB;border-radius:11px;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--green)}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle input:checked~.toggle-knob{transform:translateX(18px)}

.list-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.list-item:last-child{border-bottom:none}
.list-item-time{font-family:'IBM Plex Mono';font-size:11px;color:var(--acc);font-weight:500;flex-shrink:0;width:45px;padding-top:2px}
.list-item-content{flex:1;min-width:0}
.list-item-text{font-size:12px;color:var(--text);line-height:1.5}
.list-item-meta{font-size:10px;color:var(--text3);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list-item-tag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;background:#F1F5F9;color:#475569;text-transform:uppercase;letter-spacing:.5px}
.list-item-actions{flex-shrink:0;display:flex;gap:4px}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:2px solid transparent}
.chip .chip-del{font-size:12px;opacity:.5;cursor:pointer}.chip .chip-del:hover{opacity:1}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:16px}
.media-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border .15s}
.media-thumb:hover{border-color:var(--acc)}
.media-thumb.selected{border-color:var(--acc);box-shadow:0 0 0 2px rgba(232,132,44,.3)}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-thumb .media-del{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.media-thumb:hover .media-del{opacity:1}
.media-add{aspect-ratio:1;border-radius:8px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;gap:2px;font-size:10px;color:var(--text3)}
.media-add:hover{border-color:var(--acc);color:var(--acc)}

.cit-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.cit-item-text{font-size:12px;font-style:italic;color:var(--text);line-height:1.6;margin-bottom:8px}
.cit-item-author{font-size:11px;font-weight:600;color:var(--acc)}
.cit-item-role{font-size:10px;color:var(--text3)}

.ess-item{display:flex;gap:10px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;align-items:flex-start}
.ess-item-num{font-family:'Josefin Sans';font-size:18px;font-weight:700;color:var(--acc);flex-shrink:0;width:28px}
.ess-item-body{flex:1;min-width:0}
.ess-item-tag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;background:#F1F5F9;color:#475569;text-transform:uppercase;letter-spacing:.5px;display:inline-block;margin-bottom:4px}
.ess-item-text{font-size:12px;color:var(--text);line-height:1.5}
.ess-item-source{font-size:9px;color:var(--text3);margin-top:3px}

.event-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:20px}
.event-card{background:var(--card);border:2px solid var(--border);border-radius:var(--rl);padding:24px;cursor:pointer;transition:all .15s}
.event-card:hover{border-color:var(--acc);box-shadow:0 4px 16px rgba(232,132,44,.1)}
.event-card.active{border-color:var(--acc);background:#FFF7ED}
.event-card-title{font-family:'Josefin Sans';font-size:17px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.event-card-meta{font-size:12px;color:var(--text2)}
.status-badge{font-size:8px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;margin-left:6px}
.status-badge.live{background:#FEE2E2;color:#DC2626}
.status-badge.ended{background:#F1F5F9;color:#475569}
.status-badge.upcoming{background:#FEF3C7;color:#92400E}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:var(--rl);padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box h3{font-family:'Josefin Sans';font-size:16px;font-weight:700;margin-bottom:16px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--pri);color:#fff;padding:12px 24px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:all .3s;z-index:1000;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}

.empty{text-align:center;padding:32px;color:var(--text3)}
.empty .icon{font-size:32px;margin-bottom:8px;opacity:.5}
.empty .text{font-size:12px}

.saving-indicator{position:fixed;top:60px;right:24px;font-size:10px;color:var(--acc);font-weight:600;opacity:0;transition:opacity .2s;z-index:101}
.saving-indicator.show{opacity:1}

/* BLOCK LAYOUT PREVIEW — DRAG & DROP */
.block-layout-preview{border:2px solid var(--border);border-radius:12px;overflow:hidden;background:#F8FAFC}
.block-layout-title{background:linear-gradient(135deg,#1B1B2F,#2D1B4E);padding:12px 16px}
.block-layout-full-zone{padding:10px;border-bottom:1px solid var(--border);background:rgba(99,102,241,.03)}
.block-layout-title-inner{display:flex;align-items:center;gap:8px;font-family:'Josefin Sans';font-size:12px;font-weight:700;color:rgba(255,255,255,.6)}
.bdg-demo{font-size:7px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;background:var(--red);padding:3px 8px;border-radius:4px;margin-left:auto}
.block-layout-zone-label{font-family:'Josefin Sans';font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:4px}
.block-layout-body{display:grid;grid-template-columns:1fr 200px;gap:0;min-height:180px}
.block-layout-col{padding:10px}
.block-layout-main{border-right:1px solid var(--border)}
.block-drop-zone{min-height:80px;display:flex;flex-direction:column;gap:4px;border:2px dashed transparent;border-radius:8px;padding:4px;transition:all .2s}
.block-drop-zone.block-drag-over{border-color:var(--acc);background:rgba(232,132,44,.04)}
.block-drag-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:grab;user-select:none;transition:all .15s;font-size:11px}
.block-drag-item:hover{border-color:var(--acc);box-shadow:0 2px 8px rgba(232,132,44,.1)}
.block-drag-item:active,.block-drag-item.dragging{cursor:grabbing;opacity:.5;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.block-drag-item.disabled{opacity:.4}
.block-drag-handle{font-size:14px;color:var(--text3);cursor:grab;line-height:1;letter-spacing:-1px}
.block-drag-icon{font-size:13px}
.block-drag-label{flex:1;font-weight:500;color:var(--text)}
.block-drag-off{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);background:var(--bg);padding:2px 6px;border-radius:3px}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <h1>TourMaG <span>Live</span></h1>
    <div class="sub">Back-office — Connexion</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="form-row"><label class="form-label">E-mail</label><input class="form-input" id="auth-email" type="email" placeholder="votre@email.com"></div>
    <div class="form-row"><label class="form-label">Mot de passe</label><input class="form-input" id="auth-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="doLogin()" id="auth-btn">Se connecter</button>
  </div>
</div>

<!-- APP (hidden until auth) -->
<div id="app-shell" style="display:none">
  <div class="topbar">
    <button class="topbar-hamburger" id="hamburger" onclick="toggleMobileMenu()">☰</button>
    <div class="topbar-logo">TourMaG <span>Live</span></div>
    <select class="topbar-event-select" id="topbar-event-select" onchange="switchEvent(this.value)"></select>
    <div class="topbar-right">
      <span class="topbar-user"><span class="topbar-dot"></span><span id="topbar-user-email"></span></span>
      <button class="topbar-btn ghost" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>
  <div class="saving-indicator" id="saving">Enregistrement...</div>
  <div class="mobile-sidebar-overlay" id="mobile-overlay" onclick="closeMobileMenu()"></div>
  <div class="admin-layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-item active" data-tab="events"><span class="icon">📋</span>Mes événements</div>
      <div class="sidebar-section">Contenu</div>
      <div class="sidebar-item" data-tab="programme"><span class="icon">🗓</span>Programme</div>
      <div class="sidebar-item" data-tab="flash"><span class="icon">⚡</span>Flash info</div>
      <div class="sidebar-item" data-tab="essentiel"><span class="icon">🧠</span>L'essentiel</div>
      <div class="sidebar-item" data-tab="live"><span class="icon">📡</span>Fil live<span class="badge" id="badge-live">0</span></div>
      <div class="sidebar-item" data-tab="citations"><span class="icon">💬</span>Citations<span class="badge" id="badge-cit">0</span></div>
      <div class="sidebar-item" data-tab="articles"><span class="icon">📰</span>Articles liés</div>
      <div class="sidebar-item" data-tab="videos"><span class="icon">🎬</span>Vidéos</div>
      <div class="sidebar-section">Outils</div>
      <div class="sidebar-item" data-tab="media"><span class="icon">📷</span>Médiathèque</div>
      <div class="sidebar-item" data-tab="rubriques"><span class="icon">📁</span>Rubriques</div>
      <div class="sidebar-item" data-tab="tags"><span class="icon">🏷</span>Tags live</div>
      <div class="sidebar-section">Système</div>
      <div class="sidebar-item" data-tab="modules"><span class="icon">⚙️</span>Modules</div>
      <div class="sidebar-item" data-tab="widget"><span class="icon">📦</span>Widget homepage</div>
      <div class="sidebar-item" data-tab="access"><span class="icon">👥</span>Accès</div>
    </div>
    <div class="admin-main" id="admin-main"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modal-box"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
// ============================================================
// FIREBASE CONFIG — REMPLACER PAR VOS CLÉS
// ============================================================
firebase.initializeApp({
  apiKey:"AIzaSyDtKWuGcF2MFI3Er9mRuL1qtzhbqsQP3PY",
  authDomain:"tourmag-live.firebaseapp.com",
  projectId:"tourmag-live"
});
const db=firebase.firestore();
const auth=firebase.auth();

// ============================================================
// STATE — alimenté par onSnapshot (Firestore = source de vérité)
// ============================================================
var currentEventId='';
var currentTab='events';
var eventsData=[];    // [{id, ...data}]
var liveData=[];
var citationsData=[];
var rubriquesData=[];
var essentialData=[];
var articlesData=[];
var programmeData=[];
var timelineData=[];
var mediaData=[];
var videosData=[];
var tagsData=[];      // Stocké dans event doc → tags[]

// Listeners unsubscribe handles
var unsubs=[];

// ============================================================
// AUTH
// ============================================================
function doLogin(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const btn=document.getElementById('auth-btn');
  const err=document.getElementById('auth-err');
  if(!email||!pass){err.textContent='Remplissez les deux champs';return;}
  btn.disabled=true; btn.textContent='Connexion...'; err.textContent='';
  auth.signInWithEmailAndPassword(email,pass)
    .then(cred=>db.collection('admins').doc(cred.user.uid).get())
    .then(snap=>{
      if(!snap.exists) throw new Error('not-admin');
      // Auth OK + admin OK
    })
    .catch(e=>{
      btn.disabled=false; btn.textContent='Se connecter';
      if(e.message==='not-admin') err.textContent='Accès refusé — compte non autorisé';
      else if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') err.textContent='Email ou mot de passe incorrect';
      else err.textContent='Erreur : '+e.message;
    });
}

function doLogout(){
  auth.signOut();
}

// Listen for auth state
auth.onAuthStateChanged(user=>{
  if(user){
    // Verify admin
    db.collection('admins').doc(user.uid).get().then(snap=>{
      if(snap.exists){
        document.getElementById('auth-screen').style.display='none';
        document.getElementById('app-shell').style.display='block';
        document.getElementById('topbar-user-email').textContent=user.email;
        initApp();
      } else {
        auth.signOut();
        document.getElementById('auth-err').textContent='Compte non autorisé';
      }
    });
  } else {
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app-shell').style.display='none';
    // Cleanup listeners
    unsubs.forEach(u=>u()); unsubs=[];
  }
});

// ==================== ROLES & TAB VISIBILITY ====================
function isSuperAdmin(){
  const ev=eventsData.find(e=>e.id===currentEventId);
  const superAdmins=ev?.superAdmins||[];
  // If no super admins defined, everyone is super admin (retrocompat)
  if(!superAdmins.length) return true;
  const email=(auth.currentUser?.email||'').toLowerCase();
  return superAdmins.some(e=>(e||'').toLowerCase()===email);
}

function applyTabVisibility(){
  const ev=eventsData.find(e=>e.id===currentEventId);
  const hiddenTabs=ev?.hiddenTabs||[];
  const superAdmin=isSuperAdmin();

  document.querySelectorAll('.sidebar-item').forEach(item=>{
    const tab=item.dataset.tab;
    if(!tab) return;

    // "access" tab only visible to super admins
    if(tab==='access'){
      item.style.display=superAdmin?'':'none';
      return;
    }

    // For other tabs: hidden if in hiddenTabs AND user is not super admin
    if(!superAdmin && hiddenTabs.includes(tab)){
      item.style.display='none';
    } else {
      item.style.display='';
    }
  });

  // Also hide sidebar sections if all their items are hidden
  document.querySelectorAll('.sidebar-section').forEach(sec=>{
    let next=sec.nextElementSibling;
    let anyVisible=false;
    while(next && !next.classList.contains('sidebar-section')){
      if(next.classList.contains('sidebar-item') && next.style.display!=='none') anyVisible=true;
      next=next.nextElementSibling;
    }
    sec.style.display=anyVisible?'':'none';
  });

  // If current tab is hidden, switch to first visible tab
  if(!superAdmin && hiddenTabs.includes(currentTab)){
    const firstVisible=document.querySelector('.sidebar-item[style=""],.sidebar-item:not([style])');
    if(firstVisible && firstVisible.dataset.tab){
      currentTab=firstVisible.dataset.tab;
      document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
      firstVisible.classList.add('active');
      renderTab();
    }
  }
}

function getUploadUrl(){
  const ev=eventsData.find(e=>e.id===currentEventId)||{};
  return ev.uploadUrl||'';
}
function mkUploadBtn(targetInputId){
  return `<button type="button" class="btn btn-ghost btn-sm" onclick="uploadImageTo('${targetInputId}')" title="Upload depuis l'appareil" style="flex-shrink:0">📷 Upload</button>`;
}
function mkMediaPickerBtn(targetInputId){
  return `<button type="button" class="btn btn-ghost btn-sm" onclick="openMediaPicker('${targetInputId}')" title="Choisir dans la médiathèque" style="flex-shrink:0">📂 Médiathèque</button>`;
}
async function uploadImageTo(targetInputId){
  const url=getUploadUrl();
  if(!url){toast('Configurez l\'URL d\'upload dans l\'onglet Intégration','error');return;}
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.onchange=async function(){
    const file=input.files[0];
    if(!file)return;
    if(file.size>10*1024*1024){toast('Image trop volumineuse (max 10 Mo)','error');return;}
    const target=document.getElementById(targetInputId);
    if(target){target.value='⏳ Upload en cours...';target.disabled=true;}
    try{
      const fd=new FormData();
      fd.append('image',file);
      const resp=await fetch(url,{method:'POST',body:fd});
      const data=await resp.json();
      if(data.error){toast('Erreur: '+data.error,'error');if(target){target.value='';target.disabled=false;}return;}
      if(target){target.value=data.url;target.disabled=false;}
      toast('Image uploadée');
    }catch(e){
      console.error('Upload error:',e);
      toast('Erreur d\'upload: '+e.message,'error');
      if(target){target.value='';target.disabled=false;}
    }
  };
  input.click();
}
function openMediaPicker(targetInputId){
  // Store the target input ID globally so it survives modal replacement
  window._mediaPickerTarget=targetInputId;
  // If we're already in a modal (e.g. citation edit), save its content to restore later
  const modalBox=document.getElementById('modal-box');
  const isNested=document.getElementById('modal').classList.contains('show');
  if(isNested) window._savedModalHtml=modalBox.innerHTML;
  else window._savedModalHtml=null;

  let h=`<h3>📂 Médiathèque</h3>`;
  if(!mediaData.length){
    h+=`<div class="empty"><div class="text">Aucune image. Ajoutez-en dans l'onglet Médiathèque.</div></div>`;
  } else {
    h+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:400px;overflow-y:auto;padding:4px">`;
    mediaData.forEach((m,i)=>{
      h+=`<div style="cursor:pointer;border-radius:8px;overflow:hidden;border:2px solid transparent;transition:border .15s;aspect-ratio:1" onclick="pickMediaItem(${i})" onmouseover="this.style.borderColor='var(--acc)'" onmouseout="this.style.borderColor='transparent'">
        <img src="${m.url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.remove()">
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<div class="modal-footer"><button class="btn btn-ghost" onclick="closeMediaPicker()">Fermer</button></div>`;
  openModal(h);
}
function pickMediaItem(idx){
  const m=mediaData[idx];
  if(!m)return;
  const url=m.url||'';
  const targetId=window._mediaPickerTarget;

  // Restore previous modal if it was nested, or close
  if(window._savedModalHtml){
    document.getElementById('modal-box').innerHTML=window._savedModalHtml;
    window._savedModalHtml=null;
    // Set the value after restoring the modal
    setTimeout(()=>{
      const target=document.getElementById(targetId);
      if(target) target.value=url;
      toast('Image sélectionnée');
    },50);
  } else {
    closeModal();
    const target=document.getElementById(targetId);
    if(target) target.value=url;
    toast('Image sélectionnée');
  }
}
function closeMediaPicker(){
  if(window._savedModalHtml){
    document.getElementById('modal-box').innerHTML=window._savedModalHtml;
    window._savedModalHtml=null;
  } else {
    closeModal();
  }
}
function saving(show){document.getElementById('saving').classList.toggle('show',show);if(show)setTimeout(()=>document.getElementById('saving').classList.remove('show'),2000);}

function evRef(){ return db.collection('events').doc(currentEventId); }

function autoStatus(timeStr,dayStr){
  const now=new Date();
  if(dayStr){
    const monthMap={'janvier':0,'février':1,'fevrier':1,'mars':2,'avril':3,'mai':4,'juin':5,
      'juillet':6,'août':7,'aout':7,'septembre':8,'octobre':9,'novembre':10,'décembre':11,'decembre':11,
      'janv':0,'févr':1,'fevr':1,'mars':2,'avr':3,'juil':7,'sept':8,'oct':9,'nov':10,'déc':11,'dec':11};
    const m=dayStr.match(/(\d{1,2})(?:er|e|ème|eme|nd)?\s+([a-zéûôàèê]+)\.?\s*(\d{4})?/i);
    if(m){
      const d=parseInt(m[1]);const mon=monthMap[m[2].toLowerCase()];const y=m[3]?parseInt(m[3]):now.getFullYear();
      if(mon!==undefined){
        let target=new Date(y,mon,d);
        if(!m[3]&&(now-target)>180*86400000) target=new Date(y+1,mon,d);
        const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
        if(target>today)return 'upcoming';
        if(target<today)return 'past';
        // same day — fall through to time check
      }
    } else {
      // dayStr exists but unparseable (e.g. "Jour 1") — assume upcoming
      return 'upcoming';
    }
  }
  const h=parseInt(timeStr.split(':')[0]),m2=parseInt(timeStr.split(':')[1]||0);
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m2);
  const diff=(now-t)/60000;
  if(diff>60)return 'past'; if(diff>=-5&&diff<=60)return 'active'; return 'upcoming';
}

function switchEvent(id){
  if(id===currentEventId)return;
  currentEventId=id;
  // Re-subscribe to sub-collections
  subscribeSubCollections();
  renderTab();
  updateTopbarSelect();
}

  const sel=document.getElementById('topbar-event-select');
  sel.innerHTML=eventsData.map(e=>`<option value="${e.id}"${e.id===currentEventId?' selected':''}>${e.internalName||e.title||'Sans titre'}</option>`).join('');
}

var subCollectionsEventId=''; // track which event's subcollections we're listening to
var renderPending=null; // debounce handle

function scheduleRender(){
  if(renderPending) clearTimeout(renderPending);
  renderPending=setTimeout(()=>{ renderPending=null; renderTab(); },50);
}

// ============================================================
// FIRESTORE LISTENERS
// ============================================================
function initApp(){
  // Listen to events collection
  const u1=db.collection('events').onSnapshot(snap=>{
    const allEvents=[];
    snap.forEach(d=>allEvents.push({id:d.id,...d.data()}));
    // Filter events based on user access
    const userEmail=(auth.currentUser?.email||'').toLowerCase();
    eventsData=allEvents.filter(ev=>{
      const allowed=ev.allowedUsers||[];
      // No restriction: everyone sees the event
      if(!allowed.length) return true;
      // User is in allowedUsers list
      if(allowed.some(e=>(e||'').toLowerCase()===userEmail)) return true;
      // User is a superAdmin of this event
      const superAdmins=ev.superAdmins||[];
      if(superAdmins.some(e=>(e||'').toLowerCase()===userEmail)) return true;
      // If no superAdmins defined, treat everyone as super admin (retrocompat)
      if(!superAdmins.length) return true;
      return false;
    });
    if(!currentEventId && eventsData.length) currentEventId=eventsData[0].id;
    // If current event is no longer visible, switch to first available
    if(currentEventId && !eventsData.find(e=>e.id===currentEventId)){
      currentEventId=eventsData.length?eventsData[0].id:'';
    }
    updateTopbarSelect();
    const ev=eventsData.find(e=>e.id===currentEventId);
    tagsData=ev&&ev.tags?ev.tags:['GÉNÉRAL','TECH','DESTINATIONS','ÉCONOMIE','POLITIQUE','AÉRIEN','HÔTELLERIE','CROISIÈRE'];
    applyTabVisibility();
    // Subscribe to sub-collections if not yet done for this event
    if(currentEventId && subCollectionsEventId!==currentEventId){
      subscribeSubCollections();
    }
    scheduleRender();
  });
  unsubs.push(u1);
}

function subscribeSubCollections(){
  // Unsubscribe previous sub-collection listeners (indices 1+)
  while(unsubs.length>1) unsubs.pop()();

  if(!currentEventId){ subCollectionsEventId=''; return; }
  subCollectionsEventId=currentEventId;
  console.log('[TourMaG Live] Subscribing to subcollections for event:', currentEventId);

  const subs=[
    {col:'live',target:'liveData'},
    {col:'citations',target:'citationsData'},
    {col:'rubriques',target:'rubriquesData'},
    {col:'essential',target:'essentialData'},
    {col:'articles',target:'articlesData'},
    {col:'programme',target:'programmeData'},
    {col:'timeline',target:'timelineData'},
    {col:'media',target:'mediaData'},
    {col:'videos',target:'videosData'}
  ];

  subs.forEach(s=>{
    const u=subCol(s.col).onSnapshot(snap=>{
      const arr=[];
      snap.forEach(d=>arr.push({id:d.id,...d.data()}));
      console.log('[TourMaG Live] onSnapshot',s.col,'→',arr.length,'docs');
      // Tri côté JS (robuste même si serverTimestamp pas encore résolu)
      if(s.col==='live') arr.sort((a,b)=>{ const ta=a.time?.toDate?a.time.toDate():new Date(a.time||0); const tb=b.time?.toDate?b.time.toDate():new Date(b.time||0); return tb-ta; });
      if(s.col==='citations') arr.sort((a,b)=>{ const ta=a.created_at?.toDate?a.created_at.toDate():new Date(a.created_at||0); const tb=b.created_at?.toDate?b.created_at.toDate():new Date(b.created_at||0); return tb-ta; });
      if(s.col==='rubriques'||s.col==='essential'||s.col==='timeline') arr.sort((a,b)=>(a.order||0)-(b.order||0));
      if(s.col==='programme') arr.sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||''));
      if(s.col==='articles') arr.sort((a,b)=>{ const ta=a.created_at?.toDate?a.created_at.toDate().getTime():(a.created_at?new Date(a.created_at).getTime():0); const tb=b.created_at?.toDate?b.created_at.toDate().getTime():(b.created_at?new Date(b.created_at).getTime():0); return tb-ta; });
      if(s.col==='videos') arr.sort((a,b)=>(a.order||0)-(b.order||0));
      window[s.target]=arr;
      updateBadges();
      scheduleRender();
    },err=>{
      console.error('onSnapshot error on',s.col,err);
    });
    unsubs.push(u);
  });
}

function updateBadges(){
  const bl=document.getElementById('badge-live');
  const bc=document.getElementById('badge-cit');
  if(bl) bl.textContent=liveData.length;
  if(bc) bc.textContent=citationsData.length;
}

    case 'events':renderEvents(main);break;
    case 'modules':renderModules(main);break;
    case 'live':renderLive(main);break;
    case 'citations':renderCitations(main);break;
    case 'rubriques':renderRubriques(main);break;
    case 'tags':renderTags(main);break;
    case 'media':renderMedia(main);break;
    case 'programme':renderProgramme(main);break;
    case 'articles':renderArticles(main);break;
    case 'videos':renderVideos(main);break;
    case 'flash':renderFlash(main);break;
    case 'essentiel':renderEssentiel(main);break;
    case 'widget':renderWidget(main);break;
    case 'access':renderAccess(main);break;
  }
}

function renderEvents(el){

  <div style="margin-bottom:16px"><button class="btn btn-primary" onclick="newEvent()">＋ Nouvel événement</button></div>

  eventsData.forEach(ev=>{

    const baseUrl=window.location.origin+window.location.pathname.replace('admin.html','');
    const widgetUrl=baseUrl+'widget.html?event='+ev.id;
    h+=`<div class="event-card${ev.id===currentEventId?' active':''}" onclick="switchEvent('${ev.id}')">
      <div class="event-card-title">${ev.internalName||ev.title||'Sans titre'}${st}</div>
      <div class="event-card-meta">${ev.location||'—'} · ${ev.dates||'—'}</div>
      <div style="margin-top:10px;font-family:'IBM Plex Mono';font-size:9px;color:var(--text3);word-break:break-all">ID : ${ev.id}</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();navigator.clipboard.writeText('${widgetUrl}');toast('URL widget copiée')">📦 URL widget</button>
        <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();navigator.clipboard.writeText('${ev.id}');toast('ID copié')">🔑 Copier ID</button>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();modifyEvent('${ev.id}')">✏️ Modifier</button>

      </div></div>`;
  });
  if(!eventsData.length) h+=`<div class="empty"><div class="text">Aucun événement</div></div>`;
  h+=`</div>`;
  el.innerHTML=h;
}

async function newEvent(){
  saving(true);
  const ref=await db.collection('events').add({
    internalName:'Nouvel événement',title:'',subtitle:'',location:'',dates:'',status:'upcoming',
    color:'#2D1B4E',logo_url:'',flash_text:'',
    tags:['GÉNÉRAL','TECH','DESTINATIONS','ÉCONOMIE','POLITIQUE','AÉRIEN','HÔTELLERIE','CROISIÈRE'],
    modules:{flash:true,essential:true,live:true,citations:true,articles:true,programme:true,timeline:true,videos:true},
    blockOrder:['hero','flash','live','citations','videos','programme','articles'],
    blockZones:{hero:'main',flash:'main',live:'main',citations:'main',videos:'main',programme:'side',articles:'side'},
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  });
  currentEventId=ref.id;
  toast('Événement créé');
}

function confirmRemoveEvent(id,title){
  openModal(`<h3 style="color:var(--red)">⚠️ Supprimer l'événement</h3>
    <p style="font-size:13px;line-height:1.7;margin-bottom:12px">Vous êtes sur le point de supprimer l'événement <strong>« ${title} »</strong>.</p>
    <p style="font-size:12px;line-height:1.7;color:var(--red);background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:12px;margin-bottom:12px">
      <strong>Cette action est irréversible.</strong> Tout le contenu associé sera définitivement perdu : fil live, citations, rubriques, programme, articles, timeline, médiathèque et points essentiels.
    </p>
    <p style="font-size:11px;color:var(--text3);margin-bottom:4px">Pour confirmer, tapez le nom de l'événement :</p>
    <input class="form-input" id="m-confirm-name" placeholder="${title}" style="margin-bottom:4px">
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-danger" id="m-confirm-btn" onclick="executeRemoveEvent('${id}','${title.replace(/'/g,"\\'")}')" disabled>🗑 Supprimer définitivement</button>
    </div>`);
  // Attach listener after modal is rendered
  setTimeout(()=>{
    const inp=document.getElementById('m-confirm-name');
    const btn=document.getElementById('m-confirm-btn');
    if(inp&&btn) inp.addEventListener('input',()=>{btn.disabled=inp.value.trim()!==title;});
  },50);
}

async function executeRemoveEvent(id,title){
  const typed=document.getElementById('m-confirm-name').value.trim();
  if(typed!==title){toast('Le nom ne correspond pas','error');return;}
  closeModal();
  saving(true);
  // Supprimer les sous-collections connues
  const subs=['live','citations','rubriques','essential','articles','programme','timeline','media','videos'];
  for(const sub of subs){
    const snap=await db.collection('events').doc(id).collection(sub).get();
    const batch=db.batch();
    snap.forEach(d=>batch.delete(d.ref));
    if(!snap.empty) await batch.commit();
  }
  await db.collection('events').doc(id).delete();
  if(currentEventId===id) currentEventId=eventsData.filter(e=>e.id!==id)[0]?.id||'';
  toast('Événement supprimé');
}

  openModal(`<h3>Modifier l'événement</h3>

    <div class="form-row"><label class="form-label">Sous-titre</label><input class="form-input" id="m-ev-subtitle" value="${ev.subtitle||''}"></div>
    <div class="form-row-inline">
      <div class="form-row"><label class="form-label">Lieu</label><input class="form-input" id="m-ev-location" value="${ev.location||''}"></div>
      <div class="form-row"><label class="form-label">Dates</label><input class="form-input" id="m-ev-dates" value="${ev.dates||''}"></div>
    </div>
    <div class="form-row-inline">
      <div class="form-row"><label class="form-label">Statut</label><select class="form-input" id="m-ev-status">

  const allBlocks=[
    {key:'hero',icon:'🏠',label:'Hero (essentiel + timeline)'},

    {key:'articles',icon:'📰',label:'Articles liés'}
  ];
  const blockMap=Object.fromEntries(allBlocks.map(b=>[b.key,b]));
  const orderedKeys=[...blockOrder];
  const migIdx=orderedKeys.indexOf('essential');
  if(migIdx>=0){orderedKeys.splice(migIdx,1);const ti=orderedKeys.indexOf('timeline');if(ti>=0)orderedKeys.splice(ti,1);if(!orderedKeys.includes('hero'))orderedKeys.unshift('hero');}
  allBlocks.forEach(b=>{if(!orderedKeys.includes(b.key))orderedKeys.push(b.key);});
  const validKeys=orderedKeys.filter(k=>blockMap[k]);
  const fullItems=validKeys.filter(k=>(blockZones[k]||defaultZones[k])==='full');
  const mainItems=validKeys.filter(k=>{const z=blockZones[k]||defaultZones[k];return z!=='side'&&z!=='full';});
  const sideItems=validKeys.filter(k=>(blockZones[k]||defaultZones[k])==='side');

  function renderDI(items){let o='';items.forEach(key=>{const b=blockMap[key];if(!b)return;const dis=mod[b.key]===false;o+=`<div class="block-drag-item${dis?' disabled':''}" draggable="true" data-key="${key}"><span class="block-drag-handle">⠿</span><span class="block-drag-icon">${b.icon}</span><span class="block-drag-label">${b.label}</span>${dis?'<span class="block-drag-off">OFF</span>':''}</div>`;});return o;}

  let h=`<div class="page-title">Modules</div><div class="page-desc">Activez ou désactivez les modules, et réordonnez les blocs par glisser-déposer.</div>

  h+=`</div>

      <div class="block-layout-full-zone"><div class="block-layout-zone-label">⬛ Pleine largeur</div><div class="block-drop-zone" id="drop-full" data-zone="full">${renderDI(fullItems)}</div></div>
      <div class="block-layout-body">
        <div class="block-layout-col block-layout-main"><div class="block-layout-zone-label">Colonne principale</div><div class="block-drop-zone" id="drop-main" data-zone="main">${renderDI(mainItems)}</div></div>
        <div class="block-layout-col block-layout-side"><div class="block-layout-zone-label">Sidebar</div><div class="block-drop-zone" id="drop-side" data-zone="side">${renderDI(sideItems)}</div></div>
      </div>
    </div>
  </div>`;
  el.innerHTML=h;
  initBlockDragDrop();
}

function initBlockDragDrop(){
  let dragEl=null;
  const zones=document.querySelectorAll('.block-drop-zone');

  document.querySelectorAll('.block-drag-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{
      dragEl=item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',item.dataset.key);
    });
    item.addEventListener('dragend',()=>{
      if(dragEl)dragEl.classList.remove('dragging');
      dragEl=null;
      document.querySelectorAll('.block-drag-over').forEach(z=>z.classList.remove('block-drag-over'));
    });
  });

  zones.forEach(zone=>{
    zone.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      zone.classList.add('block-drag-over');
      if(!dragEl)return;
      const afterEl=getDragAfterElement(zone,e.clientY);
      if(afterEl){zone.insertBefore(dragEl,afterEl);}
      else{zone.appendChild(dragEl);}
    });
    zone.addEventListener('dragleave',e=>{
      if(!zone.contains(e.relatedTarget))zone.classList.remove('block-drag-over');
    });
    zone.addEventListener('drop',e=>{
      e.preventDefault();
      zone.classList.remove('block-drag-over');
      saveBlockOrder();
    });
  });
}

function getDragAfterElement(zone,y){
  const items=[...zone.querySelectorAll('.block-drag-item:not(.dragging)')];
  return items.reduce((closest,child)=>{
    const box=child.getBoundingClientRect();
    const offset=y-box.top-box.height/2;
    if(offset<0&&offset>closest.offset) return {offset,element:child};
    return closest;
  },{offset:Number.NEGATIVE_INFINITY}).element||null;
}

async function saveBlockOrder(){
  const fullItems=[...document.querySelectorAll('#drop-full .block-drag-item')].map(el=>el.dataset.key);
  const mainItems=[...document.querySelectorAll('#drop-main .block-drag-item')].map(el=>el.dataset.key);
  const sideItems=[...document.querySelectorAll('#drop-side .block-drag-item')].map(el=>el.dataset.key);
  const newOrder=[...fullItems,...mainItems,...sideItems];
  if(!newOrder.length)return;
  const newZones={};
  fullItems.forEach(k=>newZones[k]='full');
  mainItems.forEach(k=>newZones[k]='main');
  sideItems.forEach(k=>newZones[k]='side');
  saving(true);
  const ev=eventsData.find(e=>e.id===currentEventId);
  if(ev){ev.blockOrder=newOrder;ev.blockZones=newZones;}
  await evRef().update({blockOrder:newOrder,blockZones:newZones});
  toast('Ordre mis à jour');
}

function renderProgramme(el){
  const ev=eventsData.find(e=>e.id===currentEventId)||{};
  // Get day order from event doc, or build from data
  const dayOrderStored=ev.programmeDayOrder||[];
  const allDays=[];const daySet=new Set();
  programmeData.forEach(p=>{const d=p.day||'';if(d&&!daySet.has(d)){daySet.add(d);allDays.push(d);}});
  // Merge: stored order first, then any new days not yet in the order
  const dayOrder=[...dayOrderStored.filter(d=>daySet.has(d))];
  allDays.forEach(d=>{if(!dayOrder.includes(d))dayOrder.push(d);});
  const dayOpts=dayOrder.map(d=>`<option value="${d}">${d}</option>`).join('');

  let h=`<div class="page-title">Programme</div><div class="page-desc">Organisez le programme par jours. L'heure est optionnelle.</div>

      <div style="display:flex;gap:8px"><input class="form-input" id="prog-custom-title" value="${(ev.programmeTitle||'').replace(/"/g,'&quot;')}" placeholder="Programme" style="max-width:400px"><button class="btn btn-primary btn-sm" onclick="saveProgrammeTitle()">💾</button></div>
      <div style="font-size:9px;color:var(--text3);margin-top:3px">Si vide, le titre par défaut « Programme » sera affiché.</div>
    </div>
  </div>

  <div class="admin-card"><h3>📅 Jours — ordre d'affichage</h3>
    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:12px">`;
  dayOrder.forEach((day,i)=>{
    const count=programmeData.filter(p=>p.day===day).length;
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px">
      <span style="font-size:12px;font-weight:600;flex:1">📅 ${day}</span>
      <span style="font-size:9px;color:var(--text3)">${count} élément${count>1?'s':''}</span>
      <button class="btn btn-ghost btn-xs" onclick="moveDayOrder(${i},-1)" ${i===0?'disabled':''}>▲</button>
      <button class="btn btn-ghost btn-xs" onclick="moveDayOrder(${i},1)" ${i===dayOrder.length-1?'disabled':''}>▼</button>
      <button class="btn btn-ghost btn-xs" onclick="renameDay(${i})">✏️</button>
    </div>`;
  });
  if(!dayOrder.length) h+=`<div style="font-size:11px;color:var(--text3);padding:8px">Aucun jour créé. Ajoutez un élément avec un jour.</div>`;
  h+=`</div></div>

  <div class="admin-card"><h3>➕ Ajouter</h3>
    <div class="form-row-inline">
      <div class="form-row"><label class="form-label">Jour</label><div style="display:flex;gap:6px"><select class="form-input" id="prog-day-select" style="flex:1"><option value="">— Choisir —</option>${dayOpts}</select><input class="form-input" id="prog-day-new" placeholder="Ex: Mardi 1er juin" style="flex:1.5"></div><div style="font-size:9px;color:var(--text3);margin-top:3px">Sélectionnez un jour existant ou saisissez-en un nouveau</div></div>
      <div class="form-row"><label class="form-label">Heure (optionnel)</label><input class="form-input" id="prog-time" type="time"></div>
    </div>
    <div class="form-row-inline"><div class="form-row"><label class="form-label">Intitulé</label><input class="form-input" id="prog-label"></div></div>
    <div class="form-row"><label class="form-label">Description</label><input class="form-input" id="prog-desc"></div>
    <div style="margin-top:12px"><button class="btn btn-primary" onclick="addProgramme()">🗓 Ajouter</button></div></div>
  <div class="admin-card"><h3>📋 Programme</h3>`;
  if(!programmeData.length) h+=`<div class="empty"><div class="text">Vide</div></div>`;
  else{
    // Group by day, respecting dayOrder
    const grouped={};
    programmeData.forEach(p=>{
      const d=p.day||'(sans jour)';
      if(!grouped[d])grouped[d]=[];
      grouped[d].push(p);
    });
    // Sort each group by order
    Object.values(grouped).forEach(items=>items.sort((a,b)=>(a.order||0)-(b.order||0)));
    // Display order: stored day order, then orphans
    const displayOrder=[...dayOrder];
    if(grouped['(sans jour)']) displayOrder.push('(sans jour)');
    displayOrder.forEach(day=>{
      const items=grouped[day];
      if(!items||!items.length) return;
      h+=`<div style="margin-bottom:16px"><div style="font-family:'Josefin Sans';font-size:12px;font-weight:700;color:var(--acc);margin-bottom:8px;padding:6px 10px;background:rgba(232,132,44,.08);border-radius:6px;display:inline-block">📅 ${day}</div>`;
      items.forEach((p,i)=>{
        const st=autoStatus(p.time, p.day);
        const sl=st==='past'?'Terminé':st==='active'?'En cours':'À venir';
        const cls=st==='past'?'ended':st==='active'?'live':'upcoming';
        const timeDisplay=p.time?`<div class="list-item-time">${p.time}</div>`:'';
        h+=`<div class="list-item">${timeDisplay}<div class="list-item-content"><div class="list-item-text"><strong>${p.label}</strong></div>${p.desc?`<div class="list-item-meta">${p.desc}</div>`:''}<span class="status-badge ${cls}" style="margin-top:4px;display:inline-block">${sl}</span></div><div class="list-item-actions" style="display:flex;gap:3px;align-items:center">
          <button class="btn btn-ghost btn-xs" onclick="moveProgInDay('${p.id}',-1)" ${i===0?'disabled':''}>▲</button>
          <button class="btn btn-ghost btn-xs" onclick="moveProgInDay('${p.id}',1)" ${i===items.length-1?'disabled':''}>▼</button>
          <button class="btn btn-ghost btn-xs" onclick="editProgramme('${p.id}')">✏️</button>
          <button class="btn btn-danger btn-xs" onclick="deleteProgramme('${p.id}')">✕</button>
        </div></div>`;
      });
      h+=`</div>`;
    });
  }
  h+=`</div>`; el.innerHTML=h;
}

function getDayOrder(){
  const ev=eventsData.find(e=>e.id===currentEventId)||{};
  const stored=ev.programmeDayOrder||[];
  const allDays=[];const s=new Set();
  programmeData.forEach(p=>{const d=p.day||'';if(d&&!s.has(d)){s.add(d);allDays.push(d);}});
  const order=[...stored.filter(d=>s.has(d))];
  allDays.forEach(d=>{if(!order.includes(d))order.push(d);});
  return order;
}

async function moveDayOrder(idx,dir){
  const order=getDayOrder();
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=order.length)return;
  [order[idx],order[newIdx]]=[order[newIdx],order[idx]];
  saving(true);
  const ev=eventsData.find(e=>e.id===currentEventId);
  if(ev) ev.programmeDayOrder=order;
  await evRef().update({programmeDayOrder:order});
  renderTab();
  toast('Ordre des jours mis à jour');
}

function renameDay(idx){
  const order=getDayOrder();
  const oldDay=order[idx]||'';
  openModal(`<h3>Renommer le jour</h3>
    <div class="form-row"><label class="form-label">Nom actuel : <strong>${oldDay}</strong></label><input class="form-input" id="m-rename-day" value="${oldDay.replace(/"/g,'&quot;')}" placeholder="Nouveau nom"></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="executeRenameDay(${idx})">💾 Renommer</button></div>`);
}
async function executeRenameDay(idx){
  const order=getDayOrder();
  const oldDay=order[idx];
  const newDay=document.getElementById('m-rename-day').value.trim();
  if(!newDay){toast('Nom requis','error');return;}
  if(newDay===oldDay){closeModal();return;}
  saving(true);
  // Update all programme items with this day
  const items=programmeData.filter(p=>p.day===oldDay);
  for(const p of items){
    await subCol('programme').doc(p.id).update({day:newDay});
  }
  // Update day order
  order[idx]=newDay;
  await evRef().update({programmeDayOrder:order});
  const ev=eventsData.find(e=>e.id===currentEventId);
  if(ev) ev.programmeDayOrder=order;
  closeModal();toast(items.length+' éléments mis à jour');
}

function getProgDay(){
  const sel=document.getElementById('prog-day-select').value;
  const nw=document.getElementById('prog-day-new').value.trim();
  return nw||sel||'';
}
async function addProgramme(){
  const time=document.getElementById('prog-time').value,label=document.getElementById('prog-label').value.trim();
  const day=getProgDay();
  if(!label){toast('Intitulé requis','error');return;}
  saving(true);
  const dayItems=programmeData.filter(p=>(p.day||'')===(day||''));
  await subCol('programme').add({time:time||'',label,desc:document.getElementById('prog-desc').value,day,order:dayItems.length});
  // Add day to order if new
  if(day){
    const order=getDayOrder();
    if(!order.includes(day)){order.push(day);await evRef().update({programmeDayOrder:order});}
  }
  document.getElementById('prog-label').value='';document.getElementById('prog-desc').value='';document.getElementById('prog-day-new').value='';toast('Ajouté');
}

async function fetchAllRss(){
  if(!rssFeeds.length){toast('Aucun flux configuré','error');return;}
  rssFetching=true;
  const btn=document.getElementById('rss-fetch-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Import en cours...';}
  const preview=document.getElementById('rss-preview');
  if(preview) preview.innerHTML='<div style="font-size:11px;color:var(--text3)">Récupération des flux...</div>';

  const existingLinks=new Set(articlesData.map(a=>a.link));
  let imported=0, skipped=0;

  for(const feed of rssFeeds){
    try{
      const xml=await fetchRssXml(feed.url);
      if(!xml) continue;
      const parser=new DOMParser();
      const doc=parser.parseFromString(xml,'text/xml');
      const items=doc.querySelectorAll('item');

      for(const item of items){
        const title=item.querySelector('title')?.textContent?.trim()||'';
        const link=item.querySelector('link')?.textContent?.trim()||'';
        if(!title||!link||existingLinks.has(link)){skipped++;continue;}

        const author=item.querySelector('author')?.textContent?.trim()||
                     item.querySelector('dc\\:creator,creator')?.textContent?.trim()||
                     feed.label||'RSS';
        const pubDate=item.querySelector('pubDate')?.textContent?.trim();
        let dateStr='';
        let dateObj=null;
        if(pubDate){try{dateObj=new Date(pubDate);if(!isNaN(dateObj))dateStr=dateObj.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch(e){}}

        // Chercher image — plusieurs stratégies
        let image='';

        // Sérialiser le XML brut de l'item pour chercher les URLs directement
        const itemXml=new XMLSerializer().serializeToString(item);

        // 1. PRIORITÉ : URL contenant "imagette" (TourMaG)
        const imagetteMatch=itemXml.match(/https?:\/\/[^"'\s<>]*imagette[^"'\s<>]*/i);
        if(imagetteMatch) image=imagetteMatch[0];

        // 2. Balise photo:imgsrc (TourMaG custom tag)
        if(!image){
          const photoMatch=itemXml.match(/<photo:imgsrc[^>]*>([^<]+)<\/photo:imgsrc>/i);
          if(photoMatch) image=photoMatch[1].trim();
          if(!image){
            // Aussi chercher via namespace
            const photoEls=item.getElementsByTagNameNS('*','imgsrc');
            for(let pi=0;pi<photoEls.length;pi++){
              const pu=photoEls[pi].textContent?.trim();
              if(pu&&pu.startsWith('http')){image=pu;break;}
            }
          }
        }

        // 3. enclosure avec type image
        if(!image){const enclosure=item.querySelector('enclosure[type^="image"]');if(enclosure) image=enclosure.getAttribute('url')||'';}

        // 4. enclosure sans type
        if(!image){const encAny=item.querySelector('enclosure');if(encAny){const eu=encAny.getAttribute('url')||'';if(/\.(jpe?g|png|webp|gif)/i.test(eu))image=eu;}}

        // 5. Toute URL d'image dans le XML brut (jpg, png, webp)
        if(!image){
          const imgUrls=itemXml.match(/https?:\/\/[^"'\s<>]+\.(jpe?g|png|webp)/gi);
          if(imgUrls&&imgUrls.length) image=imgUrls[0];
        }

        // 6. Chercher <img> dans description
        if(!image){const desc=item.querySelector('description')?.textContent||'';const m=desc.match(/<img[^>]+src=["']([^"']+)/i);if(m) image=m[1];}

        // 7. Dernier recours : fetch og:image
        if(!image && link){try{ image = await fetchOgImage(link); }catch(e){}}

        // Sauvegarder avec created_at timestamp pour le tri chronologique
        const articleData={title,link,author,image,date:dateStr||new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}),source:'rss'};
        if(dateObj&&!isNaN(dateObj)) articleData.created_at=firebase.firestore.Timestamp.fromDate(dateObj);
        else articleData.created_at=firebase.firestore.FieldValue.serverTimestamp();

        await subCol('articles').add(articleData);
        existingLinks.add(link);
        imported++;
      }
    }catch(e){
      console.error('RSS fetch error for',feed.url,e);
    }
  }

  rssFetching=false;
  if(preview) preview.innerHTML=`<div style="font-size:11px;padding:10px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;color:#15803D">✓ ${imported} article${imported>1?'s':''} importé${imported>1?'s':''}, ${skipped} doublon${skipped>1?'s':''} ignoré${skipped>1?'s':''}.</div>`;
  if(btn){btn.disabled=false;btn.textContent='🔄 Importer les articles RSS';}
  if(imported) toast(imported+' article'+(imported>1?'s':'')+' importé'+(imported>1?'s':''));
}

async function fixEnglishDates(){
  const enToFr={Jan:'janv.',Feb:'févr.',Mar:'mars',Apr:'avr.',May:'mai',Jun:'juin',Jul:'juil.',Aug:'août',Sep:'sept.',Oct:'oct.',Nov:'nov.',Dec:'déc.',
    January:'janv.',February:'févr.',March:'mars',April:'avr.',June:'juin',July:'juil.',August:'août',September:'sept.',October:'oct.',November:'nov.',December:'déc.'};
  const toFix=articlesData.filter(a=>{
    if(!a.date)return false;
    return /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|January|February|March|April|June|July|August|September|October|November|December)\b/i.test(a.date);
  });
  if(!toFix.length){toast('Aucune date en anglais trouvée');return;}
  saving(true);
  let fixed=0;
  for(const a of toFix){
    let newDate=a.date;
    Object.keys(enToFr).forEach(en=>{
      newDate=newDate.replace(new RegExp('\\b'+en+'\\b','gi'),enToFr[en]);
    });
    if(newDate!==a.date){
      await subCol('articles').doc(a.id).update({date:newDate});
      fixed++;
    }
  }
  toast(fixed+' dates corrigées en français');
}

async function fixMissingImages(){
  const preview=document.getElementById('rss-preview');
  if(!preview)return;
  // Find articles without images
  const noImg=articlesData.filter(a=>!a.image);
  if(!noImg.length){toast('Tous les articles ont une image');return;}
  preview.innerHTML=`<div style="font-size:11px;color:var(--text3)">🖼 Recherche d'images pour ${noImg.length} articles sans image...</div>`;

  // Build a map of link→image from RSS feeds
  const linkToImage={};
  for(const feed of rssFeeds){
    try{
      const xml=await fetchRssXml(feed.url);
      if(!xml) continue;
      const parser=new DOMParser();
      const doc=parser.parseFromString(xml,'text/xml');
      const items=doc.querySelectorAll('item');
      for(const item of items){
        const link=item.querySelector('link')?.textContent?.trim()||'';
        if(!link) continue;
        const itemXml=new XMLSerializer().serializeToString(item);
        let img='';
        // imagette
        const m1=itemXml.match(/https?:\/\/[^"'\s<>]*imagette[^"'\s<>]*/i);
        if(m1) img=m1[0];
        // photo:imgsrc
        if(!img){const m2=itemXml.match(/<photo:imgsrc[^>]*>([^<]+)<\/photo:imgsrc>/i);if(m2) img=m2[1].trim();}
        // any image URL
        if(!img){const m3=itemXml.match(/https?:\/\/[^"'\s<>]+\.(jpe?g|png|webp)/gi);if(m3) img=m3[0];}
        if(img) linkToImage[link]=img;
      }
    }catch(e){console.warn('RSS parse error',e);}
  }

  let fixed=0;
  for(const a of noImg){
    let img=linkToImage[a.link]||'';
    // If not found in RSS, try og:image
    if(!img && a.link){
      try{img=await fetchOgImage(a.link);}catch(e){}
    }
    if(img){
      await subCol('articles').doc(a.id).update({image:img});
      fixed++;
    }
  }

  preview.innerHTML=`<div style="font-size:11px;padding:10px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;color:#15803D">✅ ${fixed}/${noImg.length} images corrigées</div>`;
  if(fixed) toast(fixed+' images récupérées');
}

async function debugRssImages(){
  const preview=document.getElementById('rss-preview');
  if(!preview)return;
  preview.innerHTML='<div style="font-size:11px;color:var(--text3)">Analyse des flux en cours...</div>';
  let html='<div style="font-size:11px;max-height:500px;overflow-y:auto;background:#1B1B2F;color:#E2E8F0;padding:14px;border-radius:10px;font-family:\'IBM Plex Mono\';line-height:1.8">';
  for(const feed of rssFeeds){
    html+=`<div style="color:#E8842C;font-weight:700;margin-bottom:6px">📡 ${feed.label||feed.url}</div>`;
    try{
      const xml=await fetchRssXml(feed.url);
      if(!xml){html+=`<div style="color:#F87171">❌ Impossible de charger le flux</div>`;continue;}
      const parser=new DOMParser();
      const doc=parser.parseFromString(xml,'text/xml');
      const items=doc.querySelectorAll('item');
      let count=0;
      for(const item of items){
        if(count>=15)break;count++;
        const title=item.querySelector('title')?.textContent?.trim()||'(sans titre)';
        const itemXml=new XMLSerializer().serializeToString(item);

        // Collect all image sources found
        const sources=[];
        // imagette
        const img1=itemXml.match(/https?:\/\/[^"'\s<>]*imagette[^"'\s<>]*/i);
        if(img1) sources.push({method:'imagette URL',url:img1[0]});
        // photo:imgsrc
        const img2=itemXml.match(/<photo:imgsrc[^>]*>([^<]+)<\/photo:imgsrc>/i);
        if(img2) sources.push({method:'photo:imgsrc',url:img2[1].trim()});
        // Also raw search
        const img2b=itemXml.match(/imgsrc[^>]*>([^<]+)</i);
        if(img2b&&!img2) sources.push({method:'imgsrc (raw)',url:img2b[1].trim()});
        // enclosure
        const enc=item.querySelector('enclosure');
        if(enc) sources.push({method:'enclosure',url:enc.getAttribute('url')||'(vide)',type:enc.getAttribute('type')||''});
        // media:content NS
        const mc=item.getElementsByTagNameNS('http://search.yahoo.com/mrss/','content');
        for(let i=0;i<mc.length;i++) sources.push({method:'media:content (NS)',url:mc[i].getAttribute('url')||''});
        // media:thumbnail NS
        const mt=item.getElementsByTagNameNS('http://search.yahoo.com/mrss/','thumbnail');
        for(let i=0;i<mt.length;i++) sources.push({method:'media:thumbnail (NS)',url:mt[i].getAttribute('url')||''});
        // img in description
        const desc=item.querySelector('description')?.textContent||'';
        const imgDesc=desc.match(/<img[^>]+src=["']([^"']+)/i);
        if(imgDesc) sources.push({method:'<img> in description',url:imgDesc[1]});
        // Any image URL in XML
        const allImgs=itemXml.match(/https?:\/\/[^"'\s<>]+\.(jpe?g|png|webp)/gi);
        if(allImgs) allImgs.slice(0,3).forEach(u=>sources.push({method:'URL image brute',url:u}));

        const color=sources.length?'#34D399':'#F87171';
        html+=`<div style="margin-bottom:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)">`;
        html+=`<div style="color:${color};font-weight:600">${sources.length?'✅':'❌'} ${title.slice(0,80)}</div>`;
        if(sources.length){
          sources.forEach(s=>{
            html+=`<div style="color:#94A3B8;font-size:10px;margin-left:12px">→ <span style="color:#60A5FA">${s.method}</span>: <span style="word-break:break-all">${(s.url||'').slice(0,120)}</span></div>`;
          });
        } else {
          // Show raw XML snippet to help debug
          const snippet=itemXml.replace(/</g,'&lt;').replace(/>/g,'&gt;').slice(0,500);
          html+=`<div style="color:#F87171;font-size:9px;margin-left:12px;opacity:.7">Aucune image trouvée. XML brut (500 premiers car.) :</div>`;
          html+=`<div style="color:#64748B;font-size:8px;margin-left:12px;word-break:break-all;max-height:80px;overflow:hidden">${snippet}</div>`;
        }
        html+=`</div>`;
      }
    }catch(e){
      html+=`<div style="color:#F87171">❌ Erreur: ${e.message}</div>`;
    }
  }
  html+=`</div>`;
  preview.innerHTML=html;
}

async function fetchRssXml(url){
  // Essai direct, puis CORS proxies
  const proxies=[
    url,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
    'https://corsproxy.io/?'+encodeURIComponent(url)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p,{signal:AbortSignal.timeout(8000)});
      if(r.ok){const t=await r.text();if(t.includes('<item')||t.includes('<entry'))return t;}
    }catch(e){console.warn('RSS proxy fail:',p,e.message);}
  }
  return null;
}

async function fetchOgImage(articleUrl){
  // Fetch la page via CORS proxy et extraire og:image
  const proxies=[
    'https://api.allorigins.win/raw?url='+encodeURIComponent(articleUrl),
    'https://corsproxy.io/?'+encodeURIComponent(articleUrl)
  ];
  for(const p of proxies){
    try{
      const r=await fetch(p,{signal:AbortSignal.timeout(6000)});
      if(!r.ok) continue;
      const html=await r.text();
      // og:image
      let m=html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)/i);
      if(m) return m[1];
      // Autre format : content avant property
      m=html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
      if(m) return m[1];
      // twitter:image comme fallback
      m=html.match(/<meta[^>]+(?:name|property)=["']twitter:image["'][^>]+content=["']([^"']+)/i);
      if(m) return m[1];
      m=html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:name|property)=["']twitter:image["']/i);
      if(m) return m[1];
    }catch(e){/* next proxy */}
  }
  return '';
}

async function generateTimelineIA(){
  const ev=eventsData.find(e=>e.id===currentEventId);

  const status=document.getElementById('tl-ia-status');
  const btn=document.getElementById('tl-ia-btn');

  // Collecter les données contextuelles
  const liveTexts=liveData.slice(0,30).map(e=>{
    let ts='';
    try{const t=e.time?.toDate?e.time.toDate():(e.time?new Date(e.time):null);if(t&&!isNaN(t))ts=t.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+t.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(x){}
    return `[${ts}] ${(e.text||'').replace(/<[^>]+>/g,'')}`;
  }).join('\n');

  const articleTitles=articlesData.slice(0,20).map(a=>`- ${a.title} (${a.date||''})`).join('\n');
  const essentialTexts=essentialData.map(p=>`[${p.tag}] ${(p.text||'').replace(/<[^>]+>/g,'')}`).join('\n');

  const prompt=`Tu es un éditeur spécialisé dans le tourisme français pour TourMaG.com. Tu dois créer une frise chronologique (timeline) pour l'événement "${ev.title}" (${ev.location}, ${ev.dates}).

--- FIL LIVE (dernières entrées) ---
${liveTexts||'(vide)'}

--- ARTICLES LIÉS ---
${articleTitles||'(vide)'}

--- POINTS ESSENTIELS ---
${essentialTexts||'(vide)'}

Génère entre 4 et 7 jalons chronologiques synthétiques pour la frise. Chaque jalon doit avoir une date courte (ex: "28 sept.", "30 sept. AM", "1 oct.") et un texte bref (max 20 mots) résumant un fait marquant.

Réponds UNIQUEMENT en JSON, sans backticks, sous cette forme :
[{"date":"28 sept.","text":"Pré-ouverture : installation des 1 200 exposants."},{"date":"29 sept.","text":"..."}]`;

  if(status) status.innerHTML='<div style="font-size:11px;color:var(--violet);display:flex;align-items:center;gap:6px"><span class="topbar-dot" style="background:var(--violet)"></span>Appel à l\'IA en cours…</div>';

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await resp.json();
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    let jalons;
    try{ jalons=JSON.parse(clean); }catch(e){
      if(status) status.innerHTML=`<div style="font-size:11px;color:var(--red)">❌ Erreur de parsing JSON. Réponse brute : <code style="font-size:9px">${clean.slice(0,200)}</code></div>`;
      if(btn)btn.disabled=false;
      return;
    }

    if(!Array.isArray(jalons)||!jalons.length){
      if(status) status.innerHTML='<div style="font-size:11px;color:var(--red)">❌ L\'IA n\'a retourné aucun jalon.</div>';
      if(btn)btn.disabled=false;
      return;
    }

    // Supprimer les jalons existants
    if(timelineData.length){
      const batch=db.batch();
      timelineData.forEach(t=>batch.delete(subCol('timeline').doc(t.id)));
      await batch.commit();
    }

    if(status) status.innerHTML='<div style="font-size:11px;color:var(--violet)">✍️ Écriture de '+jalons.length+' jalons…</div>';
    saving(true);
    for(let i=0;i<jalons.length;i++){
      const j=jalons[i];
      await subCol('timeline').add({
        date:j.date||'',
        text:j.text||'',
        link:j.link||'',
        source:'ia',
        order:i,
        generated_at:firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    if(status) status.innerHTML=`<div style="font-size:11px;padding:10px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;color:#15803D">✓ ${jalons.length} jalons générés par IA</div>`;
    toast(jalons.length+' jalons IA créés');
  }catch(e){
    console.error('Timeline IA error:',e);
    if(status) status.innerHTML=`<div style="font-size:11px;color:var(--red)">❌ Erreur : ${e.message}</div>`;
  }
  if(btn)btn.disabled=false;
}

function parseVideoUrl(url){
  let m;
  // YouTube shorts
  m=url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
  if(m) return {platform:'youtube',id:m[1],type:'short',ytId:m[1]};
  // YouTube watch/short URL
  m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(m) return {platform:'youtube',id:m[1],type:'video',ytId:m[1]};
  // YouTube embed
  m=url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
  if(m) return {platform:'youtube',id:m[1],type:'video',ytId:m[1]};
  // Instagram Reel
  m=url.match(/instagram\.com\/(?:reel|reels)\/([a-zA-Z0-9_-]+)/);
  if(m) return {platform:'instagram',id:m[1],type:'short',url:url};
  // Instagram post (video)
  m=url.match(/instagram\.com\/p\/([a-zA-Z0-9_-]+)/);
  if(m) return {platform:'instagram',id:m[1],type:'video',url:url};
  // LinkedIn video post
  m=url.match(/linkedin\.com\/.+/);
  if(m) return {platform:'linkedin',id:'li_'+Date.now(),type:'video',url:url};
  // Facebook video
  m=url.match(/facebook\.com\/.+\/videos\/|fb\.watch\/|facebook\.com\/watch|facebook\.com\/.+\/posts\//);
  if(m) return {platform:'facebook',id:'fb_'+Date.now(),type:'video',url:url};
  // Facebook reel
  m=url.match(/facebook\.com\/reel\//);
  if(m) return {platform:'facebook',id:'fb_'+Date.now(),type:'short',url:url};
  return null;
}
// Backward compat alias
function parseYoutubeUrl(url){ return parseVideoUrl(url); }

async function saveEditVideoSection(idx){

  sections[idx].display=document.getElementById('m-vsec-display').value;

  closeModal();toast('Section modifiée');

async function deleteVideoSection(idx){
  const sections=getVideoSections();
  if(!confirm('Supprimer la section "'+sections[idx].title+'" ? Les vidéos seront déplacées dans la première section.'))return;
  const delId=sections[idx].id;
  const firstId=sections[0].id!==delId?sections[0].id:(sections[1]?sections[1].id:'default');
  // Move videos to first section
  const orphans=videosData.filter(v=>v.section===delId);
  for(const v of orphans){await subCol('videos').doc(v.id).update({section:firstId});}
  sections.splice(idx,1);
  saving(true);
  await evRef().update({videoSections:sections});
  toast('Section supprimée');
}

async function addVideo(){
  const url=document.getElementById('vid-url').value.trim();
  const caption=document.getElementById('vid-caption').value.trim();
  const section=document.getElementById('vid-section').value;
  const thumbInput=document.getElementById('vid-thumb');
  const thumbnail=thumbInput?thumbInput.value.trim():'';
  const parsed=parseVideoUrl(url);
  if(!parsed){toast('URL non reconnue (YouTube, Instagram, Facebook ou LinkedIn)','error');return;}
  // Duplicate check: for YouTube use ytId, for others use url
  if(parsed.platform==='youtube'){
    if(videosData.find(v=>v.ytId===parsed.ytId)){toast('Vidéo déjà ajoutée','error');return;}
  } else {
    if(videosData.find(v=>v.url===url)){toast('Vidéo déjà ajoutée','error');return;}
  }
  const secVids=videosData.filter(v=>v.section===section);
  saving(true);
  const docData={
    platform:parsed.platform,
    type:parsed.type,
    url:url,
    caption:caption,
    section:section,
    order:secVids.length,
    created_at:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(parsed.platform==='youtube') docData.ytId=parsed.ytId;
  if(thumbnail) docData.thumbnail=thumbnail;
  await subCol('videos').add(docData);
  document.getElementById('vid-url').value='';document.getElementById('vid-caption').value='';
  if(thumbInput) thumbInput.value='';
  document.getElementById('vid-preview').innerHTML='';
  const thumbRow=document.getElementById('vid-thumb-row');
  if(thumbRow) thumbRow.style.display='none';
  toast('Vidéo ajoutée');
}

async function saveVideoEdit(id){

  const updateData={
    caption:document.getElementById('m-vid-caption').value.trim(),
    type:document.getElementById('m-vid-type').value,
    section:document.getElementById('m-vid-section').value
  };

async function deleteVideo(id){if(!confirm('Supprimer cette vidéo ?'))return;saving(true);await subCol('videos').doc(id).delete();toast('Supprimé');}
async function moveVideo(id,secId,dir){
  const secVids=videosData.filter(v=>v.section===secId||(secId==='default'&&!v.section)).sort((a,b)=>(a.order||0)-(b.order||0));
  const idx=secVids.findIndex(v=>v.id===id);
  if(idx<0)return;
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=secVids.length)return;
  saving(true);
  await Promise.all([
    subCol('videos').doc(secVids[idx].id).update({order:newIdx}),
    subCol('videos').doc(secVids[newIdx].id).update({order:idx})
  ]);
  toast('Ordre modifié');
}

async function addSuperAdmin(){
  const email=document.getElementById('access-new-email').value.trim().toLowerCase();
  if(!email||!email.includes('@')){toast('Email invalide','error');return;}
  const ev=eventsData.find(e=>e.id===currentEventId)||{};
  const superAdmins=[...(ev.superAdmins||[])];
  if(superAdmins.includes(email)){toast('Déjà super admin','error');return;}
  superAdmins.push(email);
  saving(true);
  await evRef().update({superAdmins});
  if(ev) ev.superAdmins=superAdmins;
  document.getElementById('access-new-email').value='';
  renderTab();
  toast('Super admin ajouté');
}

async function removeSuperAdmin(idx){
  const ev=eventsData.find(e=>e.id===currentEventId)||{};
  const superAdmins=[...(ev.superAdmins||[])];
  const removed=superAdmins.splice(idx,1);
  // Prevent removing yourself if you're the last one
  if(!superAdmins.length){
    if(!confirm('Vous allez supprimer le dernier super admin. Tous les utilisateurs auront un accès complet. Continuer ?'))return;
  }
  saving(true);
  await evRef().update({superAdmins});
  if(ev) ev.superAdmins=superAdmins;
  applyTabVisibility();
  renderTab();
  toast('Super admin retiré');
}

async function toggleTabVisibility(tabKey,visible){
  const ev=eventsData.find(e=>e.id===currentEventId)||{};
  let hiddenTabs=[...(ev.hiddenTabs||[])];
  if(visible){
    hiddenTabs=hiddenTabs.filter(t=>t!==tabKey);
  } else {
    if(!hiddenTabs.includes(tabKey)) hiddenTabs.push(tabKey);
  }
  saving(true);
  await evRef().update({hiddenTabs});
  if(ev) ev.hiddenTabs=hiddenTabs;
  applyTabVisibility();
  toast(visible?'Onglet visible':'Onglet masqué');
}

async function addAllowedUser(){
  const email=document.getElementById('access-new-allowed').value.trim().toLowerCase();
