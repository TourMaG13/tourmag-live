      <div class="form-row-inline">
        <div class="form-row"><label class="form-label">Bouton — Libellé</label><textarea class="form-input" id="w-footer-btn-label" rows="2" placeholder="Ex: Lire le dossier complet sur TourMaG" style="resize:vertical">${(ev.widgetFooterBtnLabel||'').replace(/</g,'&lt;')}</textarea></div>
        <div class="form-row"><label class="form-label">Bouton — URL</label><input class="form-input" id="w-footer-btn-url" value="${(ev.widgetFooterBtnUrl||'').replace(/"/g,'&quot;')}" placeholder="https://..."></div>
      </div>
      <div class="form-row-inline">
        <div class="form-row"><label class="form-label">Disposition</label>
          <select class="form-input" id="w-footer-layout">
            <option value="row"${(ev.widgetFooterLayout||'row')==='row'?' selected':''}>Côte à côte (texte à gauche, bouton à droite)</option>
            <option value="col"${ev.widgetFooterLayout==='col'?' selected':''}>Empilé (texte au-dessus, bouton en dessous)</option>
            <option value="center"${ev.widgetFooterLayout==='center'?' selected':''}>Centré (tout centré)</option>
            <option value="btn-only"${ev.widgetFooterLayout==='btn-only'?' selected':''}>Bouton seul (pleine largeur, centré)</option>
          </select>
        </div>
        <div class="form-row" style="max-width:200px"><label class="form-label">Couleur de fond</label>
          <div style="display:flex;align-items:center;gap:10px"><input type="color" id="w-footer-color" value="${ev.widgetFooterColor||'#1B1B2F'}" style="width:36px;height:30px;border:none;cursor:pointer;border-radius:6px"><span id="w-footer-color-val" style="font-family:'IBM Plex Mono';font-size:11px;color:var(--text2)">${ev.widgetFooterColor||'#1B1B2F'}</span></div></div>
      </div>
      <div style="font-size:9px;color:var(--text3);margin-top:6px">Si aucun texte ni bouton n'est renseigné, la zone ne s'affiche pas.</div>
    </div>
    <div style="margin-top:16px"><button class="btn btn-primary" onclick="saveWidgetConfig()">💾 Enregistrer la configuration</button></div>
  </div>

  <div class="admin-card"><h3>📺 Option 1 — Page complète (iframe)</h3>
    <p style="font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.6">Intègre la page live dans un iframe avec auto-resize. L'iframe prend toute la largeur de son conteneur.</p>
    <div style="position:relative"><textarea class="form-input" rows="8" id="embed-iframe" readonly style="font-family:'IBM Plex Mono';font-size:10px;background:#1B1B2F;color:#A78BFA;border-color:#2D1B4E;line-height:1.6">&lt;iframe src="${frontUrl}" style="width:100%;border:none;min-height:800px;display:block" id="${iframeId}"&gt;&lt;/iframe&gt;
&lt;script&gt;
window.addEventListener('message',function(e){
  if(e.data&amp;&amp;(e.data.type==='tourmag-live-resize'||e.data.type==='setHeight')){
    document.getElementById('${iframeId}').style.height=e.data.height+'px';
  }
});
&lt;/script&gt;</textarea>
    <button class="btn btn-primary btn-sm" style="position:absolute;top:8px;right:8px" onclick="copyEmbed('embed-iframe')">📋 Copier</button></div>
    <div style="font-size:9px;color:var(--text3);margin-top:6px;line-height:1.6">💡 Pour élargir le dashboard au-delà du conteneur CMS, ajoutez cette règle CSS dans votre page (remplacez XXXXX par le numéro du module CMS) :<br><code style="background:var(--bg);padding:2px 6px;border-radius:3px">.mod_XXXXX .cel1 { width:1200px!important; margin-left:-97px!important; }</code></div>
  </div>

  <div class="admin-card"><h3>📦 Option 2 — Widget encart compact (iframe)</h3>
    <p style="font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.6">Encart compact pour la homepage, identique au widget du dashboard crise. Auto-resize via postMessage.</p>
    <div style="position:relative"><textarea class="form-input" rows="6" id="embed-widget" readonly style="font-family:'IBM Plex Mono';font-size:10px;background:#1B1B2F;color:#A78BFA;border-color:#2D1B4E;line-height:1.6">&lt;iframe src="${widgetUrl}" style="width:100%;border:none;min-height:280px" id="${iframeId}-w"&gt;&lt;/iframe&gt;
&lt;script&gt;
window.addEventListener('message',function(e){
  if(e.data&amp;&amp;(e.data.type==='tourmag-live-resize'||e.data.type==='setHeight')){
    document.getElementById('${iframeId}-w').style.height=e.data.height+'px';
  }
});
&lt;/script&gt;</textarea>
    <button class="btn btn-primary btn-sm" style="position:absolute;top:8px;right:8px" onclick="copyEmbed('embed-widget')">📋 Copier</button></div>
  </div>

  <div class="admin-card"><h3>🔗 URLs directes</h3>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;font-weight:600;color:var(--text2);width:80px">Page live :</span>
        <code style="font-family:'IBM Plex Mono';font-size:10px;color:var(--blue);flex:1;word-break:break-all">${frontUrl}</code>
        <button class="btn btn-ghost btn-xs" onclick="navigator.clipboard.writeText('${frontUrl}');toast('URL copiée')">📋</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;font-weight:600;color:var(--text2);width:80px">Widget :</span>
        <code style="font-family:'IBM Plex Mono';font-size:10px;color:var(--blue);flex:1;word-break:break-all">${widgetUrl}</code>
        <button class="btn btn-ghost btn-xs" onclick="navigator.clipboard.writeText('${widgetUrl}');toast('URL copiée')">📋</button>
      </div>
    </div>
  </div>`;
  el.innerHTML=h;
  // Live update color label
  const cInput=document.getElementById('w-footer-color');
  if(cInput) cInput.addEventListener('input',()=>{document.getElementById('w-footer-color-val').textContent=cInput.value;});
}
async function saveWidgetConfig(){
  saving(true);
  await evRef().update({
    widgetCtaUrl:document.getElementById('w-cta-url').value.trim(),
    uploadUrl:document.getElementById('w-upload-url').value.trim(),
    widgetFooterText:document.getElementById('w-footer-text').value.trim(),
    widgetFooterBtnLabel:document.getElementById('w-footer-btn-label').value.trim(),
    widgetFooterBtnUrl:document.getElementById('w-footer-btn-url').value.trim(),
    widgetFooterColor:document.getElementById('w-footer-color').value,
    widgetFooterLayout:document.getElementById('w-footer-layout').value
  });
  toast('Configuration enregistrée');
}
function copyEmbed(id){
  const el=document.getElementById(id);
  el.select();
  document.execCommand('copy');
  toast('Code copié !');
}
</script>
</body>
</html>
