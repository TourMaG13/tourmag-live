async function _loadQuizVotes(eventId){
  window._eventIdForQuiz = eventId;
  const uid = await _likeAuthReady;
  window._quizUid = uid;
  // Lecture PONCTUELLE des votes (pas d'écoute temps réel permanente : celle-ci bloquait
  // le scroll après un vote). On agrège une fois, puis on rafraîchit à la demande / périodiquement.
  window._loadQuizTally = async function(){
    try{
      const snap = await db.collection('events').doc(eventId).collection('quizVotes').get();
      const tally={}, totals={}, mine={};
      snap.forEach(d=>{
        const data=d.data()||{};
        const quizId=data.quizId; if(!quizId) return;
        const answers=data.answers||{};
        tally[quizId]=tally[quizId]||{}; totals[quizId]=totals[quizId]||{};
        Object.keys(answers).forEach(qId=>{
          const opts=answers[qId]||[];
          if(opts.length){ totals[quizId][qId]=(totals[quizId][qId]||0)+1; }
          tally[quizId][qId]=tally[quizId][qId]||{};
          opts.forEach(o=>{ tally[quizId][qId][o]=(tally[quizId][qId][o]||0)+1; });
        });
        if(uid && d.id===uid+'_'+quizId){ mine[quizId]=answers; }
      });
      window._quizTally=tally; window._quizTotals=totals; window._quizMyVote=mine;
      _refreshQuizResults();
    }catch(e){ console.warn('[TourMaG Live] quiz tally error:', e.message); }
  };
  // Chargement initial
  window._loadQuizTally();
  // Rafraîchissement périodique léger (toutes les 20 s) pour voir arriver les votes des autres,
  // sans connexion permanente. clearInterval si on recharge.
  if(window._quizPollTimer) clearInterval(window._quizPollTimer);
  window._quizPollTimer = setInterval(()=>{ if(!document.hidden) window._loadQuizTally(); }, 20000);
}

window._quizSelect = function(quizId, qId, optId, mode){
  const key=quizId+'__'+qId;
  window._quizPick[key]=window._quizPick[key]||new Set();
  const set=window._quizPick[key];
  if(mode==='multi'){ if(set.has(optId)) set.delete(optId); else set.add(optId); }
  else { set.clear(); set.add(optId); }
  document.querySelectorAll('[data-quiz-opt="'+quizId+'__'+qId+'"]').forEach(el=>{
    el.classList.toggle('selected', set.has(el.getAttribute('data-quiz-optid')));
  });
};

window._quizSubmit = async function(quizId, qId){
  const eventId=window._eventIdForQuiz;
  const uid=await _likeAuthReady;
  if(!eventId||!uid) return;
  const key=quizId+'__'+qId;
  const set=window._quizPick[key];
  if(!set||!set.size) return;
  const prev=(window._quizMyVote[quizId])||{};
  const answers=Object.assign({}, prev); answers[qId]=Array.from(set);
  // Affichage optimiste immédiat : on marque mon vote localement avant même la confirmation serveur
  window._quizMyVote[quizId]=answers;
  _refreshQuizResults();
  try{
    await db.collection('events').doc(eventId).collection('quizVotes').doc(uid+'_'+quizId)
      .set({quizId, uid, answers}, {merge:true});
    // Recharge une fois les compteurs à jour (pas d'écoute permanente)
    if(window._loadQuizTally) window._loadQuizTally();
  }catch(e){ console.warn('Vote non enregistré :', e.message); }
};

function _refreshQuizResults(){
  document.querySelectorAll('[data-quiz-block]').forEach(block=>{
    const quizId=block.getAttribute('data-quiz-block');
    const myVote=window._quizMyVote[quizId]||{};
    const tally=window._quizTally[quizId]||{};
    const totals=window._quizTotals[quizId]||{};
    block.querySelectorAll('[data-quiz-q]').forEach(qEl=>{
      const qId=qEl.getAttribute('data-quiz-q').split('__')[1];
      const voted=myVote[qId];
      const qTally=tally[qId]||{};
      const total=totals[qId]||0;
      qEl.querySelectorAll('[data-quiz-opt]').forEach(el=>{
        const oid=el.getAttribute('data-quiz-optid');
        const count=qTally[oid]||0;
        const pct=total?Math.round(count/total*100):0;
        const bar=el.querySelector('.quiz-bar');
        const pctLabel=el.querySelector('.quiz-pct');
        el.classList.remove('my-pick');
        if(voted){
          el.classList.add('revealed');
          if(bar) bar.style.width=pct+'%';
          if(pctLabel) pctLabel.textContent=pct+'%';
          if(voted.includes(oid)) el.classList.add('my-pick');
        } else {
          el.classList.remove('revealed');
          if(bar) bar.style.width='0%';
          if(pctLabel) pctLabel.textContent='';
        }
      });
      const totLabel=qEl.querySelector('.quiz-total');
      if(totLabel) totLabel.textContent=total?(total+' vote'+(total>1?'s':'')):'';
      const sb=qEl.querySelector('.quiz-submit'); if(sb) sb.style.display=voted?'none':'';
      const cb=qEl.querySelector('.quiz-change'); if(cb) cb.style.display=voted?'':'none';
    });
  });
}
window._quizChangeVote = function(quizId, qId){
  if(window._quizMyVote[quizId]) delete window._quizMyVote[quizId][qId];
  window._quizPick[quizId+'__'+qId]=new Set();
  document.querySelectorAll('[data-quiz-opt="'+quizId+'__'+qId+'"]').forEach(el=>{ el.classList.remove('revealed','my-pick','selected'); });
  _refreshQuizResults();
};

// Construit tous les blocs quiz actifs (filtrés par phase active). opts: {quizzes, activePhase, exp, event}
function mkQuizBlock(opts){
  opts=opts||{};
  if(opts.event && opts.event.mod && opts.event.mod.quiz===false) return '';
  const quizzes=(opts.quizzes||window._quizzes||[]).filter(qz=>qz.active===true && (qz.questions||[]).length);
  const activePhase=opts.activePhase||'';
  const shown=quizzes.filter(qz=>!qz.phase || qz.phase===activePhase || !activePhase);
  if(!shown.length) return '';
  const ev=opts.event||{};
  const sub=ev.quizSubtitle||'Participez en direct';
  let styleVars='';
  if(ev.quizAccent) styleVars+=`--quiz-accent:${ev.quizAccent};`;
  if(ev.quizCardBg) styleVars+=`--quiz-card-bg:${ev.quizCardBg};`;
  let out='';
  shown.forEach(qz=>{
    const cls=opts.exp?'quiz-block quiz-exp':'quiz-block';
    const title=qz.title||'Quiz / Sondage';
    let inner='';
    let _qnum=0;
    (qz.questions||[]).forEach(q=>{
      _qnum++;
      const isQuiz=q.type==='quiz';
      const isMulti=q.mode==='multi';
      const reveal=qz.revealAnswer!==false;
      const key=qz.id+'__'+q.id;
      let optsHtml='';
      (q.options||[]).forEach(o=>{
        const correctMark=isQuiz&&reveal&&o.correct?'<span class="quiz-correct-badge">✓ bonne réponse</span>':'';
        optsHtml+=`<button class="quiz-opt" data-quiz-opt="${key}" data-quiz-optid="${o.id}" onclick="window._quizSelect('${qz.id}','${q.id}','${o.id}','${q.mode}')">
          <span class="quiz-bar"></span>
          <span class="quiz-opt-txt">${_qEsc(o.text)}</span>
          <span class="quiz-opt-right"><span class="quiz-pct"></span>${correctMark}</span>
        </button>`;
      });
      inner+=`<div class="quiz-q" data-quiz-q="${key}" data-qnum="${String(_qnum).padStart(2,'0')}">
        <div class="quiz-q-head"><span class="quiz-q-badge">${isQuiz?'QUIZ':'SONDAGE'}</span><span class="quiz-q-text">${_qEsc(q.text)}</span></div>
        <div class="quiz-hint">${isMulti?'Plusieurs réponses possibles':'Une seule réponse'}</div>
        <div class="quiz-opts">${optsHtml}</div>
        <div class="quiz-actions">
          <button class="quiz-submit" onclick="window._quizSubmit('${qz.id}','${q.id}')">Voter</button>
          ${qz.lockVote?'':`<button class="quiz-change" style="display:none" onclick="window._quizChangeVote('${qz.id}','${q.id}')">Changer mon vote</button>`}
          <span class="quiz-total"></span>
        </div>
      </div>`;
    });
    const head=opts.exp
      ? `<h2>${_qEsc(title)}</h2><div class="rule"></div>`
      : `<div class="sec-title-icon" style="background:rgba(16,185,129,.1);color:#10B981">${ICO.chart||ICO.msgCircle||''}</div><h2>${_qEsc(title)}</h2><div class="sec-title-line"></div><p>${_qEsc(sub)}</p>`;
    out+=`<div class="${cls} fi" data-quiz-block="${qz.id}"${styleVars?` style="${styleVars}"`:''}>
      <div class="${opts.exp?'exp-section-head exp-sec-quiz':'sec-title sec-title-quiz'}">${head}</div>
      ${inner}
    </div>`;
  });
  return `<div id="section-quiz">${out}</div>`;
}

async function init(){
  const _qs = new URLSearchParams(window.location.search);
  const eventId = _qs.get('event');
  // Interrupteurs de diagnostic (à retirer une fois la cause trouvée) :
  window._DIAG = {
    noquiz: _qs.has('noquiz'),          // coupe le listener temps réel des votes de quiz
    noresize: _qs.has('noresize'),      // coupe l'observer de hauteur / hooks resize
    norealtime: _qs.has('norealtime')   // coupe toutes les mises à jour temps réel
  };
  if(!eventId){ document.getElementById('app').innerHTML='<div class="ld"><div class="tx">Aucun événement spécifié</div></div>'; return; }
  _loadUserLikes(eventId); // #5 — charge les likes de cet appareil (asynchrone, non bloquant)
  window._eventIdForQuestions = eventId; // Q&A — cible des soumissions
  if(!window._DIAG.noquiz) _loadQuizVotes(eventId); // Quiz — agrégation des votes en temps réel
  const ec=db.collection('events').doc(eventId);
  const [evS,esS,liS,ruS,ciS,arS,prS,tlS,viS,iwS,etS,qS,qzS] = await Promise.all([
    ec.get(),
    ec.collection('essential').get(),
    ec.collection('live').get(),
    ec.collection('rubriques').get(),
    ec.collection('citations').get(),
    ec.collection('articles').get(),
    ec.collection('programme').get(),
    ec.collection('timeline').get(),
    ec.collection('videos').get(),
    ec.collection('interviews').get(),
    ec.collection('etapes').get(),
    ec.collection('questions').where('status','==','approved').get(),
    ec.collection('quizzes').where('active','==',true).get()
  ]);
  var jrS=null;
  try{ jrS=await db.collection('journalists').get(); }catch(e){ console.warn('[TourMaG Live] Cannot read journalists:',e.message); }
  if(!evS.exists){ document.getElementById('app').innerHTML='<div class="ld"><div class="tx">Événement introuvable</div></div>'; return; }
  const ev=evS.data();
  function toArr(s){ const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()})); return a; }
  var _allGlobalJournalists=jrS?toArr(jrS):[];
  function resolveJournalists(evData,globalArr){
    const ej=evData.eventJournalists||[];
    return ej.sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>{const g=globalArr.find(g=>g.id===x.globalId);return g?{...g,phase:x.phase||''}:null;}).filter(Boolean);
  }
  const ess=toArr(esS).sort((a,b)=>(a.order||0)-(b.order||0));
  const li=toArr(liS).sort((a,b)=>tsVal(b.time)-tsVal(a.time));
  const ru=toArr(ruS).sort((a,b)=>(a.order||0)-(b.order||0));
  const ci=toArr(ciS).sort((a,b)=>tsVal(b.created_at)-tsVal(a.created_at));
  const ar=toArr(arS).sort((a,b)=>tsVal(b.created_at||b.date)-tsVal(a.created_at||a.date));
  const pr=toArr(prS).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||''));
  const tl=toArr(tlS).sort((a,b)=>(a.order||0)-(b.order||0));
  const vi=toArr(viS).sort((a,b)=>(a.order||0)-(b.order||0));
  const iw=toArr(iwS).sort((a,b)=>(a.order||0)-(b.order||0));
  const et=toArr(etS).sort((a,b)=>(a.order||0)-(b.order||0));
  const qu=toArr(qS).sort((a,b)=>tsVal(a.createdAt)-tsVal(b.createdAt));
  window._quizzes = toArr(qzS).sort((a,b)=>(a.order||0)-(b.order||0));
  const jr=resolveJournalists(ev,_allGlobalJournalists);
  render({event:ev,essential:ess,live:li,rubriques:ru,citations:ci,articles:ar,programme:pr,timeline:tl,videos:vi,journalists:jr,interviews:iw,etapes:et,questions:qu});

  var rtState={event:ev,essential:ess,live:li,rubriques:ru,citations:ci,articles:ar,programme:pr,timeline:tl,videos:vi,journalists:jr,interviews:iw,etapes:et,questions:qu};
  window._rtState = rtState;
  function rtRender(){ rtState.journalists=resolveJournalists(rtState.event,_allGlobalJournalists); render(rtState); if(typeof _refreshLikeButtons==='function') setTimeout(_refreshLikeButtons,0); if(typeof _refreshQuizResults==='function') setTimeout(_refreshQuizResults,0); if(typeof window._tmgResize==='function') window._tmgResize(); }

  if(!window._DIAG.norealtime){
  ec.collection('live').onSnapshot(snap=>{rtState.live=toArr(snap).sort((a,b)=>tsVal(b.time)-tsVal(a.time));rtRender();});
  ec.collection('rubriques').onSnapshot(snap=>{rtState.rubriques=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('articles').onSnapshot(snap=>{rtState.articles=toArr(snap).sort((a,b)=>tsVal(b.created_at||b.date)-tsVal(a.created_at||a.date));rtRender();});
  ec.collection('citations').onSnapshot(snap=>{rtState.citations=toArr(snap).sort((a,b)=>tsVal(b.created_at)-tsVal(a.created_at));rtRender();});
  ec.collection('essential').onSnapshot(snap=>{rtState.essential=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('programme').onSnapshot(snap=>{rtState.programme=toArr(snap).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||''));rtRender();});
  ec.collection('timeline').onSnapshot(snap=>{rtState.timeline=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('videos').onSnapshot(snap=>{rtState.videos=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('interviews').onSnapshot(snap=>{rtState.interviews=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('etapes').onSnapshot(snap=>{rtState.etapes=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();});
  ec.collection('questions').where('status','==','approved').onSnapshot(snap=>{rtState.questions=toArr(snap).sort((a,b)=>tsVal(a.createdAt)-tsVal(b.createdAt));rtRender();},err=>console.warn('[TourMaG Live] questions error:',err.message));
  if(!window._DIAG.noquiz) ec.collection('quizzes').where('active','==',true).onSnapshot(snap=>{window._quizzes=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));rtRender();},err=>console.warn('[TourMaG Live] quizzes error:',err.message));
  ec.onSnapshot(snap=>{if(snap.exists){rtState.event=snap.data();rtRender();}});
  try{
    db.collection('journalists').onSnapshot(snap=>{_allGlobalJournalists=toArr(snap);rtRender();},err=>console.warn('[TourMaG Live] journalists error:',err.message));
  }catch(e){console.warn('[TourMaG Live] Cannot subscribe to journalists:',e.message);}
  }

  // Scheduling check every 30s
  var _lastScheduleCheck=Date.now();
  setInterval(()=>{
    const now=Date.now();
    const hasNew=(rtState.live||[]).concat(rtState.citations||[]).some(e=>{
      if(!e.scheduledAt)return false;
      const sd=e.scheduledAt?.toDate?e.scheduledAt.toDate():(e.scheduledAt?.seconds?new Date(e.scheduledAt.seconds*1000):new Date(e.scheduledAt));
      return !isNaN(sd)&&sd.getTime()<=now&&sd.getTime()>_lastScheduleCheck;
    });
    _lastScheduleCheck=now;
    if(hasNew) rtRender();
  },30000);
}
init().catch(e=>{console.error(e);document.getElementById('app').innerHTML='<div class="ld" style="color:#DC2626">Erreur — voir console</div>'});

// IFRAME RESIZE + FULL-WIDTH
var _lastSentH=0, _hTimer=null;
function _computeH(){
  return Math.max(document.body.scrollHeight, document.body.offsetHeight);
}
function sendHeight(){
  const h=_computeH();
  if(Math.abs(h-_lastSentH)<=2) return; // rien d'utile à envoyer
  _lastSentH=h;
  window.parent.postMessage({type:'tourmag-live-resize',height:h},'*');
  window.parent.postMessage({type:'setHeight',height:h},'*');
}
// Debounce : on attend que ça se calme (fin des animations) avant de mesurer UNE fois.
// Lire scrollHeight force un reflow ; en debounçant on évite de le faire à chaque frame.
function scheduleHeight(){
  if(_hTimer) return; // une mesure est déjà programmée
  _hTimer=setTimeout(()=>{ _hTimer=null; sendHeight(); }, 120);
}
function requestFullWidth(){
  window.parent.postMessage({type:'tourmag-live-fullwidth'},'*');
  window.parent.postMessage({type:'tourmag-live-nooverflow'},'*');
}
window.addEventListener('load',()=>{
  document.documentElement.style.overflowY='visible';document.documentElement.style.overflowX='hidden';document.body.style.overflowY='visible';document.body.style.overflowX='hidden';
  // Si on arrive avec une ancre #live-<id> (lien partagé), on scrolle vers l'entrée une fois rendue.
  (function(){
    const hash=window.location.hash;
    if(!hash || hash.indexOf('#live-')!==0) return;
    let tries=0;
    const iv=setInterval(()=>{
      const el=document.getElementById(hash.slice(1));
      if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.transition='background .4s'; clearInterval(iv); }
      if(++tries>20) clearInterval(iv);
    },400);
  })();
  sendHeight();
  requestFullWidth();
  [100,300,600,1200,2500].forEach(d=>setTimeout(()=>{scheduleHeight();requestFullWidth();},d));
  if(window._DIAG && window._DIAG.noresize){ return; } // diagnostic : pas d'observer de hauteur
  new MutationObserver(scheduleHeight).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ _lastSentH=0; scheduleHeight(); } });
  window.addEventListener('pageshow',()=>{ _lastSentH=0; scheduleHeight(); });
  window.addEventListener('resize',scheduleHeight);
});
// Recalcul forcé après un rendu. Neutralisé en mode diagnostic noresize.
window._tmgResize=function(){ if(window._DIAG && window._DIAG.noresize) return; _lastSentH=0; if(_hTimer){clearTimeout(_hTimer);_hTimer=null;} scheduleHeight(); };
</script>
