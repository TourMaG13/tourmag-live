    const m=dayStr.match(/(\d{1,2})(?:er|e|ème|eme|nd)?\s+([a-zéûôàèê]+)\.?\s*(\d{4})?/i);
    if(m){const d=parseInt(m[1]);const mon=monthMap[m[2].toLowerCase()];const y=m[3]?parseInt(m[3]):now.getFullYear();
      if(mon!==undefined){targetDate=new Date(y,mon,d);if(!m[3]&&(now-targetDate)>180*86400000)targetDate=new Date(y+1,mon,d);}}}

    if(tds>todayStart)return 'upcoming';if(tds<todayStart)return 'past';}

  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,mi);const diff=(now-t)/60000;

}

function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function darkenHex(hex,amount){const[r,g,b]=hexToRgb(hex);return rgbToHex(r*(1-amount),g*(1-amount),b*(1-amount));}
function lightenHex(hex,amount){const[r,g,b]=hexToRgb(hex);return rgbToHex(r+(255-r)*amount,g+(255-g)*amount,b+(255-b)*amount);}

function _mkPhaseTitle(event, activePhase, phases){
  if(!activePhase) return '';
  const phase = phases.find(p => p.id === activePhase);
  if(!phase) return '';
  const mk = (event.mode==='expedition') ? 'expedition' : 'classic';
  const modeTypo = (event.typography && event.typography[mk]) || {};
  // Titre : réglage par-mode (typography[mode].phaseTitle) sinon repli global (event.phaseTitle)
  const pt = modeTypo.phaseTitle || event.phaseTitle || {};
  const ps = modeTypo.phaseSubtitle || {};
  // Décalage vertical du bloc titre/sous-titre (espace avec les onglets au-dessus)
  const topGap = (pt.topGap!=null && pt.topGap!=='') ? pt.topGap : 14;
  let out = `<div class="phase-active-head" style="margin-top:${topGap}px">`;
  if(pt.show){
    const color = pt.usePhaseColor ? (phase.color || '#6366F1') : (pt.color || '#1E293B');
    const size = pt.size || 28;
    const weight = pt.weight || 700;
    const padY = pt.padY || 10;
    const fontFam = pt.font ? `font-family:'${pt.font}',sans-serif;` : '';
    const styl = pt.italic ? 'font-style:italic;' : '';
    out += `<div class="phase-active-title" style="font-size:${size}px;font-weight:${weight};color:${color};padding:${padY}px 0;${fontFam}${styl}">${phase.name}</div>`;
  }
  // Sous-titre de la phase active (contenu par phase, style par-mode)
  const subText = (phase.subtitle||'').trim();
  if(ps.show && subText){
    const scolor = ps.usePhaseColor ? (phase.color || '#6366F1') : (ps.color || '#64748B');
    const ssize = ps.size || 15;
    const sweight = ps.weight || 400;
    const sfont = ps.font ? `font-family:'${ps.font}',sans-serif;` : '';
    const sstyl = ps.italic ? 'font-style:italic;' : '';
    const slh = ps.lineHeight || 1.4;
    // Largeur max : contrôle le retour à la ligne du sous-titre (0/vide = pleine largeur)
    const smw = (ps.maxWidth!=null && ps.maxWidth!=='' && +ps.maxWidth>0) ? `max-width:${ps.maxWidth}px;margin-left:auto;margin-right:auto;` : '';
    out += `<div class="phase-active-subtitle" style="text-align:center;font-size:${ssize}px;font-weight:${sweight};color:${scolor};line-height:${slh};padding:0 0 6px;${smw}${sfont}${sstyl}">${subText}</div>`;
  }
  return out + '</div>';
}

  function autoDefaults(mode){
    var exp = (mode==='expedition');
    return {
      reporters: {
        titleFont:'', titleSize: exp?21:13, titleColor: exp?'':'#111827',       titleLH:1.3,  titleWeight:700, titleStyle:'normal',
        textFont:'',  textSize:12.5,        textColor: exp?'':'#4B5563',         textLH:1.55,  textWeight:400,  textStyle:'normal',
        uiFont:'',    uiSize:10,            uiColor:'',                          uiLH:1.4,     uiWeight:600,    uiStyle:'normal'
      },

        uiFont:'',    uiSize:10,     uiColor:'',                                uiLH:1.4,     uiWeight:400,    uiStyle:'normal'
      }

  var ROLES = ['title','text','ui'];
  var PROPS = ['Font','Size','Color','LH','Weight','Style'];

  function modeKey(ev){ return (ev && ev.mode==='expedition') ? 'expedition' : 'classic'; }

  }

  function getModeTypoRaw(ev){
    var t = (ev && ev.typography) || {};
    var mk = modeKey(ev);
    var raw = t[mk] || {};

    ['hero','body','dark'].forEach(function(z){ out.zones[z] = Object.assign({}, (raw.zones||{})[z]||{}); });
    ['reporters','itinerary'].forEach(function(k){ out.auto[k] = Object.assign({}, (raw.auto||{})[k]||{}); });
    return out;

  function _excl(sel, removeList){
    return sel.split(',').filter(function(s){ return removeList.indexOf(s)===-1; }).join(',');
  }
  function _emit(sel, block, opts){
    if(!sel) return '';
    opts = opts||{};
    var css = '';
    if(block.Font)  css += sel+"{font-family:'"+block.Font+"',sans-serif !important}";
    if(block.Size!=null && block.Size!=='') css += sel+"{font-size:"+block.Size+"px !important}";
    if(block.Weight!=null && block.Weight!=='') css += sel+"{font-weight:"+block.Weight+" !important}";
    if(block.Style) css += sel+"{font-style:"+block.Style+" !important}";
    var selCL = opts.stripCounters ? _excl(sel, COUNTER_SEL) : sel;
    if(selCL){
      if(block.Color) css += selCL+"{color:"+block.Color+" !important}";

    return css;
  }
  function _blockOf(src, r){
    return { Font:src[r+'Font'], Size:src[r+'Size'], Color:src[r+'Color'],
             LH:src[r+'LH'], Weight:src[r+'Weight'], Style:src[r+'Style'] };
  }

  function buildCSS(modeTypo){
    var css = '';
    ['hero','body','dark'].forEach(function(z){
      var zt = modeTypo.zones[z] || {};
      ROLES.forEach(function(r){ css += _emit(ZONE_SEL[z][r], _blockOf(zt,r), { stripCounters:(z==='body') }); });
    });
    var au = modeTypo.auto || {};
    Object.keys(AUTO_SEL).forEach(function(k){
      var src = au[k]; if(!src) return;
      ROLES.forEach(function(r){ css += _emit(AUTO_SEL[k][r], _blockOf(src,r), { stripCounters:true }); });
    });
    var mods = modeTypo.modules || {};
    Object.keys(mods).forEach(function(mkey){
      var mo = mods[mkey]; if(!mo || mo.enabled===false) return;
      // Le module « kpis » cible volontairement les compteurs -> ne pas les exclure.
      var _strip = (mkey!=='kpis');
      var map = MODULE_SEL[mkey]; if(map){ ROLES.forEach(function(r){ css += _emit(map[r], _blockOf(mo,r), { stripCounters:_strip }); }); }
      // Titre/sous-titre de section propres au module (surcharge le global)
      var sec = SECTION_SEL[mkey];
      if(sec){
        if(sec.title) css += _emit(sec.title, { Font:mo.secFont, Size:mo.secSize, Color:mo.secColor, LH:mo.secLH, Weight:mo.secWeight, Style:mo.secStyle }, {});
        if(sec.sub)   css += _emit(sec.sub,   { Font:mo.secSubFont, Size:mo.secSubSize, Color:mo.secSubColor, LH:mo.secSubLH, Weight:mo.secSubWeight, Style:mo.secSubStyle }, {});
      }
    });
    css += buildPhaseTabsCSS(modeTypo.phaseTabs || {});

  // CSS des onglets de phase (typo + apparence). N'injecte que les champs réglés.
  // La couleur/fond ACTIF n'est injecté que si défini, sinon --phase-color reste.

    if(pt.bg)     base += 'background:'+pt.bg+' !important;';
    if(pt.borderColor) base += 'border-color:'+pt.borderColor+' !important;';
    if(pt.borderWidth!=null && pt.borderWidth!=='') base += 'border-width:'+pt.borderWidth+'px !important;border-style:solid !important;';
    if(pt.radius!=null && pt.radius!=='') base += 'border-radius:'+pt.radius+'px !important;';
    if(pt.padY!=null && pt.padY!=='') base += 'padding-top:'+pt.padY+'px !important;padding-bottom:'+pt.padY+'px !important;';
    if(pt.padX!=null && pt.padX!=='') base += 'padding-left:'+pt.padX+'px !important;padding-right:'+pt.padX+'px !important;';
    if(base) css += '.phase-tab{'+base+'}';
    var act = '';
    if(pt.activeColor)  act += 'color:'+pt.activeColor+' !important;';
    if(pt.activeBg)     act += 'background:'+pt.activeBg+' !important;';
    if(pt.activeBorderColor) act += 'border-color:'+pt.activeBorderColor+' !important;';
    if(act) css += '.phase-tab.active{'+act+'}';
    if(pt.gap!=null && pt.gap!=='') css += '.phase-tabs{gap:'+pt.gap+'px !important}';

  }

  function collectFonts(modeTypo, extra){
    var set = {};
    function add(f){ if(f) set[f]=1; }
    ['hero','body','dark'].forEach(function(z){ var zt=modeTypo.zones[z]||{}; ROLES.forEach(function(r){ add(zt[r+'Font']); }); });
    var au = modeTypo.auto||{};
    Object.keys(au).forEach(function(k){ var s=au[k]||{}; ROLES.forEach(function(r){ add(s[r+'Font']); }); });
    var mods = modeTypo.modules||{};
    Object.keys(mods).forEach(function(k){ var s=mods[k]||{}; ROLES.forEach(function(r){ add(s[r+'Font']); }); });
    if(modeTypo.phaseTabs && modeTypo.phaseTabs.font) add(modeTypo.phaseTabs.font);
    (extra||[]).forEach(add);
    return Object.keys(set);
  }

  var API = { TYPO_MODULES, AUTO_MODULES, ZONE_SEL, MODULE_SEL, AUTO_SEL, SECTION_SEL, COUNTER_SEL, ROLES, PROPS,

<script>
function render(data){

  window._activePhase = activePhase;

  function _pf(arr){

    // Timeline

  // ===== KPIs =====
  function mkKpis(){
    if(mod.kpis===false || !event.kpis || !event.kpis.length) return '';
    const _now = new Date(); _now.setHours(0,0,0,0);
    const kpis = event.kpis.filter(k => !activePhase || !k.phase || k.phase === activePhase).sort((a,b)=>(a.order||0)-(b.order||0)).filter(k=>{
      if(k.type==='countdown' && k.targetDate){ const d=new Date(k.targetDate); d.setHours(0,0,0,0); return Math.ceil((d-_now)/(1000*60*60*24))>0; }
      return true;
    });
    if(!kpis.length) return '';
    let o = `<div class="kpi-bar fi"><div class="kpi-bar-inner" style="--kpi-cols:${kpis.length}">`;
    kpis.forEach(k => {
      if(k.type==='countdown' && k.targetDate){
        const d=new Date(k.targetDate); d.setHours(0,0,0,0); const diff=Math.ceil((d-_now)/(1000*60*60*24));
        const cc=k.color||'var(--exp-accent,#FF6C00)';
        o += `<div class="kpi"><div class="kpi-num" style="color:${cc}">J-${diff}</div><div class="kpi-label">${k.label||''}</div></div>`;
      } else { o += `<div class="kpi"><div class="kpi-num">${k.value||''}</div><div class="kpi-label">${k.label||''}</div></div>`; }
    });
    o += `</div></div>`;
    return o;
  }

  // ===== ESSENTIAL =====
  function mkEssential(){
    if(mod.essential===false || !essential || !essential.length) return '';

    if(event.essentialShowTitle!==false) o += `<div id="section-essential"><div class="sec-title sec-title-essential fi"><div class="sec-title-icon" style="background:rgba(5,150,105,.08);color:#059669">${ICO.clipboard}</div><h2>${event.essentialTitle||"L'essentiel"}</h2><div class="sec-title-line"></div><p>${event.essentialSubtitle||'Les points clés à retenir'}</p></div></div>`;
    o += `<div class="ess-grid fi">`;
    essential.forEach((p,i) => {
      const tc = tagColorMap[(p.tag||'').toUpperCase()] || defaultColors[i % defaultColors.length];
      o += `<div class="ess-card" style="border-left-color:${tc}"><div class="ess-top"><div class="ess-num" style="color:${tc}">${String(i+1).padStart(2,'0')}</div><span class="ess-tag" style="background:${tc}20;color:${tc}">${p.tag||''}</span></div><div class="ess-txt">${p.text}</div></div>`;

  // ===== FLASH =====

    return `<div class="flash fi"${flashLink}><span class="flash-badge">${ICO.zap} FLASH</span><span class="flash-text">${event.flash_text}</span>${event.flash_link?'<span style="margin-left:auto;flex-shrink:0;font-size:11px;color:rgba(255,255,255,.6)">→</span>':''}</div>`;

  // ===== LIVE =====
  function mkLiveEntry(e, isFirst){
    const tc = e.tag_color || _tagColorMap[(e.tag||'').toUpperCase()] || '';
    // Try to find journalist photo
    const jrKey = (e.journalist||'').toLowerCase().trim();
    const jrPhoto = jrPhotoMap[jrKey] || '';
    const avatarHtml = jrPhoto
      ? `<img class="live-avatar${isFirst?' live-avatar-first':''}" src="${jrPhoto}" alt="" onerror="this.className='live-dot'">`
      : `<div class="live-dot"></div>`;
    return `<div class="live-entry" id="live-${e.id||''}"><div class="live-time-col">${avatarHtml}</div><div class="live-content"><div class="live-content-head"><span class="live-tag" ${tc?`style="background:${tc}20;color:${tc}"`:''}>${e.tag||''}</span><span class="live-timestamp">${fmtTime(e.time)}</span><span class="live-journalist">${e.journalist||''}</span></div>${e.title?`<div class="live-title">${e.title}</div>`:''}<div class="live-text">${e.text}${e.url?` <a href="${e.url}" target="_blank" style="color:var(--acc);font-size:11px;font-weight:600;text-decoration:none">→ Lire la suite</a>`:''}</div>${e.image?`<div class="live-img"><img src="${e.image}" alt="" style="height:${e.image_height||190}px;object-position:${e.image_position||'center center'}" onerror="this.parentElement.remove()"></div>`:''}<div class="live-actions">${mkLikeButton(e.id, e.likeCount)}${mkShareButton(e)}</div></div></div>`;
  }

  function mkLive(){
    if(mod.live===false || !live || !live.length) return '';
    const pubLive=live.filter(_isPublished);
    if(!pubLive.length) return '';
    let o = `<div id="section-live">${event.liveShowTitle!==false?`<div class="sec-title sec-title-live fi"><div class="sec-title-icon" style="background:rgba(220,38,38,.08);color:#DC2626">${ICO.radio}</div><h2>${event.liveTitle||'Fil Live'}</h2><div class="sec-title-line"></div><p>${event.liveSubtitle||'Minute par minute, depuis l\'événement'}</p></div>`:""}</div><div class="live-feed fi">`;
    const _liveVis = event.liveVisibleCount || LIVE_VISIBLE;
    const vis = pubLive.slice(0, _liveVis);
    const ext = pubLive.slice(_liveVis);
    vis.forEach((e,i) => { o += mkLiveEntry(e, i===0); });
    if(ext.length){
      o += `<div class="expand-wrap" id="live-expand">`;
      ext.forEach(e => { o += mkLiveEntry(e, false); });
      o += `</div>`;
      o += `<button class="voir-plus-btn" id="live-btn" onclick="toggleExpand('live-expand','live-btn',${ext.length},'Réduire','Voir les ${ext.length} entrées précédentes')">Voir les ${ext.length} entrées précédentes ${_chevSvg}</button>`;
    }
    o += `</div>`;
    return o;
  }

  // ===== ARTICLES (bento grid) =====
  const ART_VIS = event.articlesVisibleCount || ART_VISIBLE_DEFAULT;
  function mkArticle(a, featured){
    const img = a.image ? `<img class="art-card-img" src="${a.image}" alt="" onerror="this.remove()">` : '';

  function mkArticles(){
    if(mod.articles===false || !articles || !articles.length) return '';

    const artSub = event.articlesSubtitle || "L'événement vu par la rédaction";

      o += `<div class="expand-wrap" id="art-expand"><div class="art-bento" style="margin-top:14px">`;
      ea.forEach(a => { o += mkArticle(a, false); });
      o += `</div></div><div style="text-align:center"><button class="voir-plus-btn" id="art-btn" onclick="toggleExpand('art-expand','art-btn',${ea.length},'Réduire','Voir les ${ea.length} autres articles')">Voir les ${ea.length} autres articles ${_chevSvg}</button></div>`;
    }
    return o;

  // ===== INTERVIEWS (full-width bandeau) =====
  function mkInterviews(){
    if(mod.interviews===false || !interviews || !interviews.length) return '';
    const itwTitle = event.interviewsTitle || 'Interviews';
    const itwSub = event.interviewsSubtitle || 'Rencontres et visions sur l\'évolution du métier';
    let o = `<div id="section-interviews" class="itw-section fi"><div class="itw-inner">${event.interviewsShowTitle!==false?`<div class="itw-section-hd"><h2>${itwTitle}</h2><div class="itw-line"></div><p>${itwSub}</p></div>`:``}`;
    interviews.forEach(itw => {
      const avatarHtml = itw.photo_url ? `<img class="itw-avatar" src="${itw.photo_url}" alt="" onerror="this.remove()">` : '';
      o += `<div class="itw-card"><div class="itw-body">`;
      if(itw.tag) o += `<span class="itw-badge">${itw.tag}</span>`;
      o += `<div class="itw-name">${itw.name||''}</div>`;
      if(itw.quote) o += `<div class="itw-quote">« ${itw.quote} »</div>`;
      if(itw.bio) o += `<div class="itw-bio">${itw.bio}</div>`;
      if(itw.link) o += `<a class="itw-cta" href="${itw.link}" target="_blank">▸ Lire l'interview</a>`;

  // ===== CITATIONS =====
  const CIT_VISIBLE = event.citVisibleCount || 6;
  var _citAccordionCounter = 0;
  // SVG quote icon for premium cards
  function citQuoteSVG(){
    const col = event.citationAccentColor || '#E8842C';
    const sizes = {small:{w:30,h:24,s:.68},medium:{w:44,h:36,s:1},large:{w:58,h:48,s:1.32}};
    const sz = sizes[_citQuoteSize] || sizes.medium;
    return `<svg class="cit-pm-quote" width="${sz.w}" height="${sz.h}" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 21.6C0 10.08 6.72 2.16 17.28 0l1.92 4.32C12.48 6.24 9.12 11.52 8.64 17.28H17.28V36H0V21.6Z" fill="${col}"/><path d="M25.92 21.6C25.92 10.08 32.64 2.16 43.2 0l1.92 4.32c-6.72 1.92-10.08 7.2-10.56 12.96h8.64V36H25.92V21.6Z" fill="${col}"/></svg>`;
  }
  function mkCitations(){
    if(mod.citations===false || !citations || !citations.length) return '';
    const pubCitations=citations.filter(_isPublished);
    if(!pubCitations.length) return '';
    let o = `<div id="section-citations">${event.citationsShowTitle!==false?`<div class="sec-title sec-title-citations fi"><div class="sec-title-icon" style="background:rgba(124,58,237,.08);color:#7C3AED">${ICO.msgCircle}</div><h2>${event.citationsTitle||'Verbatims'}</h2><div class="sec-title-line"></div><p>${event.citationsSubtitle||'Ce qu\'ils ont dit'}</p></div>`:""}</div>`;

    // Featured citation (explicitly marked with featured:true)
    const featured = pubCitations.find(c => c.featured);
    if(featured){
      const rubMatch = (rubriques||[]).find(r=>r.id===featured.rubrique);

      if(_citStyle === 'premium'){
        // Premium featured citation
        const accentCol = event.citationAccentColor || '#E8842C';
        const bgCol = _citFeatBg;
        // Auto-detect text color from bg luminance
        const _lum = (function(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const l=v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);return 0.2126*l(r)+0.7152*l(g)+0.0722*l(b);})(bgCol);
        const _dark = _lum > 0.4;
        const txtCol = _dark ? '#1A202C' : 'rgba(255,255,255,.85)';
        const nameCol = _dark ? '#1A202C' : '#fff';
        const roleCol = _dark ? '#4A5568' : 'rgba(255,255,255,.45)';
        const ini = (featured.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        const avatarHtml = featured.avatar
          ? `<img class="cit-hero-avatar" src="${featured.avatar}" alt="" style="border-color:${accentCol};box-shadow:0 0 0 4px ${accentCol}33" onerror="this.style.display='none'">`
          : `<div class="cit-hero-avatar-placeholder" style="color:${roleCol}">${ini}</div>`;
        o += `<div class="cit-hero fi" style="background:${bgCol};border:var(--cit-bw,2.5px) solid ${accentCol};border-radius:18px 0 18px 0;position:relative;overflow:hidden">${citQuoteSVG().replace('class="cit-pm-quote"','style="position:absolute;top:16px;right:20px;pointer-events:none;z-index:0;opacity:.25"')}${avatarHtml}<div class="cit-hero-body" style="position:relative;z-index:1">`;
        if(rubMatch) o += `<span class="cit-hero-badge" style="background:${accentCol}">${rubMatch.name||''}</span>`;
        o += `<div class="cit-hero-text" style="font-size:var(--cit-ts,16px);color:${txtCol}">${featured.text}</div><div class="cit-hero-name" style="font-size:var(--cit-ns,14px);color:${nameCol}">${featured.name}</div><div class="cit-hero-role" style="font-size:var(--cit-rs,11px);color:${roleCol}">${featured.role||''}</div></div></div>`;
      } else {
        // Classic featured citation
        const ini = (featured.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        const avatarHtml = featured.avatar
          ? `<img class="cit-hero-avatar" src="${featured.avatar}" alt="" onerror="this.style.display='none'">`
          : `<div class="cit-hero-avatar-placeholder">${ini}</div>`;
        o += `<div class="cit-hero fi">${avatarHtml}<div class="cit-hero-body">`;
        if(rubMatch) o += `<span class="cit-hero-badge">${rubMatch.name||''}</span>`;
        o += `<div class="cit-hero-text">${featured.text}</div><div class="cit-hero-name">${featured.name}</div><div class="cit-hero-role">${featured.role||''}</div></div></div>`;
      }
    }

    // Rest of citations by rubrique
    function mkCitGroup(group, idx){
      let out = '';
      const c0 = group[0];
      const isLarge = c0.photoFormat === 'large';

      // ---- PREMIUM STYLE ----
      if(_citStyle === 'premium'){
        const variant = (idx||0) % 2 === 0 ? 'citation-card-pm-a' : 'citation-card-pm-b';
        if(isLarge && c0.avatar){
          out += `<div class="citation-card-pm ${variant} citation-card-large">${citQuoteSVG()}<div class="cit-pm-inner"><img class="cit-pm-photo-large" src="${c0.avatar}" alt="" onerror="this.remove()"><div style="margin-bottom:12px"><div class="cit-pm-name">${c0.name}</div><div class="cit-pm-role">${c0.role||''}</div></div>`;
        } else {
          out += `<div class="citation-card-pm ${variant}">${citQuoteSVG()}<div class="cit-pm-inner">`;
          const rubMatch = (rubriques||[]).find(r=>r.id===c0.rubrique);
          if(rubMatch) out += `<div class="cit-pm-badge">${rubMatch.name||''}</div>`;
          out += `<div class="cit-pm-top">`;
          if(c0.avatar) out += `<img class="cit-pm-avatar" src="${c0.avatar}" alt="" onerror="this.style.display='none'">`;
          else { const ini=(c0.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); out += `<div class="cit-pm-avatar-ph">${ini||ICO.user}</div>`; }
          out += `<div><div class="cit-pm-name">${c0.name}</div><div class="cit-pm-role">${c0.role||''}</div></div></div>`;
        }
        group.forEach((c,i) => { if(i>0) out += `<hr class="cit-pm-sep">`; out += `<div class="cit-pm-text">${c.text}</div>`; });
        out += `</div></div>`;
        return out;
      }

      // ---- CLASSIC STYLE (original) ----
      if(isLarge && c0.avatar){
        out += `<div class="citation-card citation-card-large"><img class="citation-photo-large" src="${c0.avatar}" alt="" onerror="this.remove()"><div class="citation-info" style="margin-bottom:12px"><div class="citation-name">${c0.name}</div><div class="citation-role">${c0.role||''}</div></div>`;
      } else {
        out += `<div class="citation-card"><div class="citation-author" style="margin-bottom:12px">`;
        if(c0.avatar) out += `<img class="citation-avatar" src="${c0.avatar}" alt="" onerror="this.style.display='none'">`;
        else { const ini=(c0.name||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); out += `<div class="citation-avatar-placeholder">${ini||ICO.user}</div>`; }
        out += `<div class="citation-info"><div class="citation-name">${c0.name}</div><div class="citation-role">${c0.role||''}</div></div></div>`;
      }
      group.forEach((c,i) => { if(i>0) out += `<hr class="citation-sep">`; out += `<div class="citation-text">${c.text}</div>`; });
      out += `</div>`;
      return out;
    }
    function groupByPerson(arr){
      const groups=[],seen=new Map();
      arr.forEach(c=>{const key=(c.name||'').toLowerCase().trim();if(seen.has(key)){groups[seen.get(key)].push(c);}else{seen.set(key,groups.length);groups.push([c]);}});
      return groups;
    }
    function renderCitBlock(rc,rubName,rubIcon,rubColor,rubBg){
      if(!rc.length) return '';
      const groups = groupByPerson(rc);
      const accId = 'cit-acc-'+(_citAccordionCounter++);
      let out = `<div class="rubrique-block fi"><div class="rubrique-header"><div class="rubrique-icon" style="background:${rubBg};color:${rubColor}">${rubIcon}</div><div class="rubrique-name">${rubName}</div><span class="rubrique-count" style="background:${rubColor}">${rc.length}</span></div><div class="citation-grid">`;
      const cards = groups.map((g,gi) => mkCitGroup(g, gi));
      const visCards = cards.slice(0,CIT_VISIBLE), extraCards = cards.slice(CIT_VISIBLE);
      visCards.forEach(c => { out += c; });
      if(extraCards.length){
        out += `</div><div class="cd-expand" id="${accId}"><div class="citation-grid">`;
        extraCards.forEach(c => { out += c; });
        out += `</div></div><div class="voir-plus" id="${accId}-btn" data-extra="${extraCards.length}" onclick="toggleCitAccordion('${accId}')">Voir les ${extraCards.length} autres citations ▾</div>`;
      } else { out += `</div>`; }
      out += `</div>`;
      return out;
    }
    // Filter out featured from grid
    const gridCitations = featured ? pubCitations.filter(c=>c!==featured) : pubCitations;
    if(rubriques && rubriques.length){
      rubriques.forEach(rub => {
        const rc = gridCitations.filter(c => c.rubrique === rub.id);
        if(!rc.length) return;
        o += renderCitBlock(rc, rub.name, rub.icon, rub.color, rub.bg);
      });
    }
    const rubIds = new Set((rubriques||[]).map(r=>r.id));
    const orphans = gridCitations.filter(c => !c.rubrique || !rubIds.has(c.rubrique));
    if(orphans.length) o += renderCitBlock(orphans,'Verbatims','💬','#475569','#F1F5F9');
    return o;
  }

  // ===== PROGRAMME =====
  function mkProgramme(){
    if(mod.programme===false || !programme || !programme.length) return '';
    const storedOrder=event.programmeDayOrder||[];
    const grouped={};const seenDays=new Set();const allDays=[];
    programme.forEach(p=>{const d=p.day||'';if(!grouped[d])grouped[d]=[];grouped[d].push(p);if(d&&!seenDays.has(d)){seenDays.add(d);allDays.push(d);}});
    const dayOrder=[...storedOrder.filter(d=>seenDays.has(d))];
    allDays.forEach(d=>{if(!dayOrder.includes(d))dayOrder.push(d);});
    if(grouped[''])dayOrder.push('');
    Object.values(grouped).forEach(items=>items.sort((a,b)=>(a.order||0)-(b.order||0)||(a.time||'').localeCompare(b.time||'')));
    const hasMultipleDays=dayOrder.filter(d=>d).length>0;
    let o = `<div class="prog-card fi"><div class="hd"><div class="ci">${ICO.clipboard}</div><span class="ct">${event.programmeTitle||'Programme'}</span></div><div class="prog-list">`;
    dayOrder.forEach(day=>{
      if(!grouped[day]||!grouped[day].length)return;
      if(hasMultipleDays && day) o += `<div style="font-family:'Josefin Sans';font-size:10px;font-weight:700;color:#B45309;margin:6px 0 4px;padding:3px 8px;background:rgba(245,158,11,.1);border-radius:5px;display:inline-block">📅 ${day}</div>`;
      grouped[day].forEach(p=>{
        const st=autoStatus(p.time,day);
        const sl=st==='past'?'Terminé':st==='active'?'● En cours':'À venir';
        const hasTime=p.time&&p.time.trim();

      if(platform==='linkedin'&&v.url){let liE=v.embedUrl||'';if(!liE){const mU=(v.url).match(/urn:li:(\w+:\d+)/);const mA=(v.url).match(/(activity|ugcPost)[:-](\d{10,})/i);if(mU)liE=`https://www.linkedin.com/embed/feed/update/urn:li:${mU[1]}`;else if(mA){const t=mA[1].toLowerCase()==='ugcpost'?'ugcPost':'activity';liE=`https://www.linkedin.com/embed/feed/update/urn:li:${t}:${mA[2]}`;}}if(liE)return `<div class="vid-frame" style="padding-top:80%"><iframe src="${liE}" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe></div>${popupLink(v.url,'LinkedIn')}`;return `<div class="vid-ext-card" onclick="window.open('${v.url}','_vidpopup','width=920,height=640')" style="cursor:pointer"><div class="vid-ext-placeholder"><div class="vid-ext-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21"/></svg></div><div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:600">Ouvrir sur LinkedIn</div></div></div>`;}

  // ===== CONTACT (mode classique) =====
  function mkContact(){
    const ctRaw = event.contact;
    if(mod.contact===false || !ctRaw) return '';
    let people = Array.isArray(ctRaw.people) ? ctRaw.people : null;
    if(!people){
      const hasSolo = ctRaw.name||ctRaw.role||ctRaw.photo_url||ctRaw.message||ctRaw.email||ctRaw.phone||ctRaw.website;
      people = hasSolo ? [{name:ctRaw.name,role:ctRaw.role,photo_url:ctRaw.photo_url,message:ctRaw.message,email:ctRaw.email,phone:ctRaw.phone,website:ctRaw.website,booking_url:ctRaw.booking_url}] : [];
    }
    const globalBooking = ctRaw.bookingUrl || '';
    const anyReachable = people.some(p=>p&&(p.email||p.phone||p.website||p.booking_url)) || globalBooking;
    if(!anyReachable) return '';

    const bgC = ctRaw.bg_color || '';

    const nameC = ctRaw.name_color || '';
    const roleC = ctRaw.role_color || '';
    const btnC = ctRaw.btn_color || '';

    if(bgI) cardStyle += `background-image:url('${bgI}');`;
    if(nameC) cardStyle += `--_ct-name-color:${nameC};`;
    if(roleC) cardStyle += `--_ct-role-color:${roleC};`;
    if(btnC) cardStyle += `--_ct-btn-color:${btnC};`;

    const svgMail = '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,4 12,13 2,4"/></svg>';
    const svgPhone = '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>';
    const svgWeb = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>';
    const svgCal = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

    function personCard(p){

  // ===== BRAND NEWS =====
  function mkBrandNews(){
    if(mod.brandnews===false) return '';
    const bn = event.brandNews;
    if(!bn || !bn.rssUrl) return '';
    const now = new Date();
    const today = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    if(bn.startDate && today < bn.startDate) return '';
    if(bn.endDate && today > bn.endDate) return '';
    const bnArticles = (articles||[]).filter(a => a.brandnews_feed === bn.rssUrl || a.rss_feed === bn.rssUrl).sort((a,b) => (b.imported_at||'').toString().localeCompare((a.imported_at||'').toString()));
    if(!bnArticles.length) return '';
    const a = bnArticles[0];
    const label = bn.label || 'Brand News';
    const st = bn.style || {};
    const badgeCss = st.accent ? `background:${st.accent}` : '';
    let titleCss='';
    if(st.titleFont) titleCss+=`font-family:'${st.titleFont}',sans-serif;`;
    if(st.titleSize) titleCss+=`font-size:${st.titleSize}px;`;
    if(st.titleColor) titleCss+=`color:${st.titleColor};`;

    return o;
  }

      essential: essential?.length||0, rawEssential: _rawEss?.length||0,
      videos: videos?.length||0, interviews: interviews?.length||0,

    },
    blockOrder: event.blockOrder,

  });

  // ===== LAYOUT ASSEMBLY — 4 zones: main, side, full, max =====
  // main  = colonne principale (dans layout 2 colonnes)
  // side  = sidebar droite

  // max   = pleine largeur viewport (sort du .dash)
  const blockRenderers = {hero:mkHero,phaseTabs:mkPhaseTabs,kpis:mkKpis,essential:mkEssential,flash:mkFlash,live:mkLive,citations:mkCitations,videos:mkVideos,programme:mkProgramme,articles:mkArticles,journalists:mkJournalists,interviews:mkInterviews,gallery:mkGallery,sponsors:mkSponsors,brandnews:mkBrandNews,contact:mkContact,questions:mkQuestions,quiz:mkQuiz};
  const defaultZones = {hero:'max',phaseTabs:'max',kpis:'max',essential:'main',flash:'main',live:'main',citations:'full',articles:'full',interviews:'max',videos:'full',gallery:'full',programme:'side',journalists:'side',sponsors:'full',brandnews:'side',contact:'full',questions:'full',quiz:'full'};
  const allBlockKeys = Object.keys(blockRenderers);
  const defaultOrder = ['hero','phaseTabs','kpis','essential','flash','live','quiz','citations','questions','articles','interviews','videos','gallery','programme','journalists','brandnews','sponsors','contact'];

  const fullBlockOrder = event.blockOrder || defaultOrder;
  const orderedKeys = [...fullBlockOrder];
  const migIdx=orderedKeys.indexOf('timeline');if(migIdx>=0)orderedKeys.splice(migIdx,1);
  function insertAfter(key, afterKey){
    if(orderedKeys.includes(key)) return;
    const idx=orderedKeys.indexOf(afterKey);
    orderedKeys.splice(idx>=0?idx+1:0, 0, key);
  }
  insertAfter('phaseTabs','hero');
  insertAfter('kpis','phaseTabs');
  insertAfter('essential','kpis');
  insertAfter('flash','essential');
  insertAfter('interviews','articles');
  insertAfter('gallery','videos');
  insertAfter('sponsors','gallery');
  insertAfter('contact','sponsors');
  allBlockKeys.forEach(k=>{if(!orderedKeys.includes(k))orderedKeys.push(k);});
  const validKeys=orderedKeys.filter(k=>allBlockKeys.includes(k));

  // Migrate old zone values: old 'full' → 'max' for hero/interviews/kpis
  const blockZones = {};
  const evZones = event.blockZones || {};
  Object.keys(evZones).forEach(k => {
    let z = evZones[k];
    if(z === 'full' && defaultZones[k] === 'max') z = 'max';
    blockZones[k] = z;
  });
  function getZone(k){ return blockZones[k] || defaultZones[k] || 'main'; }
  const _renderedBlocks = [];
  function rb(k){ const fn=blockRenderers[k]; const html=fn ? fn() : ''; if(html) _renderedBlocks.push(k); else console.log('[TourMaG Live] Block EMPTY:', k, '| mod.'+k+'=', mod[k]); return html; }

  const allSideKeys = validKeys.filter(k => getZone(k) === 'side');
  const sidebarAnchor = event.sidebarAnchor || 'live';
  let _sideRendered = false, _inDash = false, _mainBuf = [];

  function _shouldRenderSide(){
    // Render sidebar when the anchor block is in the current mainBuf
    if(_sideRendered || !allSideKeys.length) return false;
    return _mainBuf.includes(sidebarAnchor);
  }
  function _flushMain(){
    if(!_mainBuf.length) return;
    if(!_inDash){ h+='<div class="dash">'; _inDash=true; }

      if(!_inDash){ h+='<div class="dash">'; _inDash=true; }
      h+=rb(key);
    } else {
      _mainBuf.push(key);
    }
  });

  if(!_sideRendered && allSideKeys.length){
    h+='<div class="dash"><div class="layout"><div class="main-col"></div><div class="side-col">';

  let navHtml = `<div class="sticky-nav-brand"><span class="dot"></span> ${event.title||'TourMaG Live'}</div>`;
  navModules.forEach(m => { navHtml += `<a href="#${m.id}">${m.label}</a>`; });

    if(window._stickyObs) window._stickyObs.disconnect();

      document.getElementById('sticky-nav').classList.toggle('visible',!e.isIntersecting);
    },{threshold:0.05});
    window._stickyObs.observe(heroEl);
  }

  // Active section tracking
  document.querySelectorAll('.sec-title').forEach(st => {
    const parent = st.closest('[id^="section-"]') || st.parentElement;
    // Find the closest id
    let section = st;
    while(section && !section.id) section = section.parentElement;
  });

  // Smooth scroll for nav links
  document.querySelectorAll('.sticky-nav a').forEach(a=>{
    a.onclick = function(e){
      e.preventDefault();
      const tgt=document.querySelector(this.getAttribute('href'));
      if(tgt) tgt.scrollIntoView({behavior:'smooth',block:'start'});
    };
  });

  // Fade-in observer — on deconnecte le precedent avant recreation (sinon fuite d'observers -> latence scroll)
  if(window._fadeObsC) window._fadeObsC.disconnect();
  window._fadeObsC = new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');window._fadeObsC.unobserve(e.target);}});
  },{threshold:.06});
  document.querySelectorAll('.fi').forEach(el=>window._fadeObsC.observe(el));

  // Process Instagram embeds
  if(window._socialParseTimer) clearTimeout(window._socialParseTimer);
  window._socialParseTimer = setTimeout(()=>{
    try{if(window.instgrm&&window.instgrm.Embeds) window.instgrm.Embeds.process();}catch(e){}

}

// PHASE TAB NAVIGATION

window._switchPhase = function(e, phaseId){
  e.preventDefault();
  const url = new URL(window.location.href);
  if(phaseId) url.searchParams.set('phase', phaseId);
  else url.searchParams.delete('phase');
  // Update URL without reload, then re-render
  window.history.replaceState({}, '', url.toString());
  // Re-render with current data
  if(window._rtState) render(window._rtState);
  // Recalcule la hauteur de l'iframe (la nouvelle phase peut être plus courte → évite la zone blanche)
  if(typeof window._tmgResize==='function'){ window._tmgResize(); requestAnimationFrame(window._tmgResize); setTimeout(window._tmgResize,150); }
  // Remonte le parent en haut du bloc si besoin (au cas où on était scrollé bas)
  window.parent.postMessage({type:'tourmag-live-scrolltop'},'*');
};

  _b.programme = function(){

  if(filteredEtapes.length && mod.etapes!==false && document.getElementById('exp-routemap')){
    if(_expMapInstance){ _expMapInstance.remove(); _expMapInstance=null; }
    if(window._expAnimFrame){ cancelAnimationFrame(window._expAnimFrame); window._expAnimFrame=null; }

    const map = L.map('exp-routemap', {scrollWheelZoom:false});
    _expMapInstance = map;
    // Fonds de carte disponibles — serveurs communautaires OSM, sans clé API (usage léger/modéré).
    const BASEMAPS = {
      osm:          {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts:{attribution:'© OpenStreetMap', maxZoom:19}},
      osmfr:        {url:'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', opts:{attribution:'© OpenStreetMap France', subdomains:'abc', maxZoom:20}},
      humanitarian: {url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', opts:{attribution:'© OpenStreetMap, Humanitarian OSM Team', subdomains:'abc', maxZoom:20}},
      cyclosm:      {url:'https://{s}.tile.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', opts:{attribution:'© CyclOSM, © OpenStreetMap', subdomains:'abc', maxZoom:20}},
      topo:         {url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', opts:{attribution:'© OpenStreetMap, SRTM © OpenTopoMap', subdomains:'abc', maxZoom:17}}
    };
    const _mapStyle = event.expMapStyle || 'osm';
    const _bm = BASEMAPS[_mapStyle] || BASEMAPS.osm;
    // Filtre noir & blanc « carnet » : réglage indépendant, applicable à n'importe quel fond.
    const _mapGray = event.expMapGrayscale === true || event.expMapGrayscale === 'true';
    document.getElementById('exp-routemap').classList.toggle('map-grayscale', _mapGray);
    console.log('[TourMaG Live] Carte — fond:', _mapStyle, '| N&B:', _mapGray, '(valeur brute expMapGrayscale =', JSON.stringify(event.expMapGrayscale)+')');
    L.tileLayer(_bm.url, _bm.opts).addTo(map);

    // Build ordered waypoint chain (handles both stop & route étapes)
    const chain = [];
    filteredEtapes.forEach(s => {
      if(!s.lat || !s.lng) return;
      chain.push({coord:[s.lat,s.lng], status:s.status, etape:s, isEnd:false});
      if(s.type==='route' && s.latEnd && s.lngEnd){
        chain.push({coord:[s.latEnd,s.lngEnd], status:s.status, etape:s, isEnd:true});
      }
    });

    // Polylines — one segment per consecutive pair, with tooltip
    // === STEP 1: Create all markers first, stored by coord key ===
    const allCoords = [];
    const markerMap = {};
    const coordKey = (c) => c[0].toFixed(6)+','+c[1].toFixed(6);

    function bindHover(marker, popupContent){
      marker.bindTooltip(popupContent, {direction:'top', offset:[0,-8], className:'exp-seg-tip'});
      marker.on('mouseover', function(e){ this.openTooltip(); });
      marker.on('mouseout', function(e){ this.closeTooltip(); });
    }
    function bindClick(marker, etape){
      marker.on('click', function(){ openExpMapPanel(etape); });
    }
    function storeMarker(coord, marker, baseStyle, isDivIcon){
      markerMap[coordKey(coord)] = {marker, baseStyle, isDivIcon};
    }

    // — Start marker (first point)
    if(chain.length){
      const sc = chain[0].coord;
      const sn = chain[0].etape.name || 'Départ';
      allCoords.push(sc);
      const mS = L.marker(sc, {icon: L.divIcon({className:'', html:'<div class="exp-start-marker"></div>', iconSize:[24,24], iconAnchor:[12,12]}), zIndexOffset:600}).addTo(map);
      bindHover(mS, `<div class="exp-pop-name">${sn}</div><div class="exp-pop-meta">Point de départ</div>`);
      bindClick(mS, chain[0].etape);
      storeMarker(sc, mS, null, true);
    }

    filteredEtapes.forEach(s => {
      if(!s.lat || !s.lng) return;
      const isRoute = s.type==='route' && s.latEnd && s.lngEnd;
      const dc = [s.lat, s.lng];
      allCoords.push(dc);

      if(!markerMap[coordKey(dc)]){
        let m, bs=null, di=false;
        if(s.status==='now' && !isRoute){
          m = L.marker(dc, {icon: L.divIcon({className:'', html:`<div class="exp-pulse-marker" style="background:${accent}"></div>`, iconSize:[16,16], iconAnchor:[8,8]})}); di=true;
        } else if(s.status==='now' && isRoute){
          bs = {radius:5, color:accent, weight:2, fillColor:accent, fillOpacity:.5}; m = L.circleMarker(dc, bs);
        } else if(s.status==='done'){
          bs = {radius:isRoute?4:6, color:'#111', weight:2, fillColor:'#111', fillOpacity:1}; m = L.circleMarker(dc, bs);
        } else {
          bs = {radius:isRoute?4:6, color:'#999', weight:2, fillColor:'#999', fillOpacity:1}; m = L.circleMarker(dc, bs);
        }
        const pp = isRoute
          ? `<div class="exp-pop-name">${s.name}</div><div class="exp-pop-meta">Départ · ${s.dateLabel||''}</div>`
          : `<div class="exp-pop-name">${s.name}</div><div class="exp-pop-meta">${s.dateLabel||''} · ${s.km||''}</div>`;
        m.addTo(map); bindHover(m, pp); bindClick(m, s); storeMarker(dc, m, bs, di);
      }

      if(isRoute){
        const ac = [s.latEnd, s.lngEnd];
        allCoords.push(ac);
        if(!markerMap[coordKey(ac)]){
          let m, bs=null, di=false;
          if(s.status==='now'){
            m = L.marker(ac, {icon: L.divIcon({className:'', html:`<div class="exp-pulse-marker" style="background:${accent}"></div>`, iconSize:[16,16], iconAnchor:[8,8]})}); di=true;
          } else if(s.status==='done'){
            bs = {radius:6, color:'#111', weight:2, fillColor:'#111', fillOpacity:1}; m = L.circleMarker(ac, bs);
          } else {
            bs = {radius:6, color:'#999', weight:2, fillColor:'#999', fillOpacity:1}; m = L.circleMarker(ac, bs);
          }
          m.addTo(map); bindHover(m, `<div class="exp-pop-name">${s.nameEnd||''}</div><div class="exp-pop-meta">Arrivée · ${s.km||''}</div>`);
          bindClick(m, s); storeMarker(ac, m, bs, di);
        }
      }
    });

    // === STEP 2: Detect duplicate segments via geographic distance ===
    function _hvDist(a, b){
      const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLng=(b[1]-a[1])*Math.PI/180;
      const la=a[0]*Math.PI/180, lb=b[0]*Math.PI/180;
      const h=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLng/2)**2;
      return 2*R*Math.asin(Math.sqrt(h));
    }
    const MATCH_KM = 2; // 2km tolerance for "same point"
    const MIN_SEG_KM = 0.5; // skip zero-length connecting segments
    // Build list of real segments (skip zero-length connectors)
    const _realSegs = [];
    for(let i=0; i<chain.length-1; i++){
      if(_hvDist(chain[i].coord, chain[i+1].coord) >= MIN_SEG_KM) _realSegs.push(i);
    }
    // Pairwise comparison: find segments that share both endpoints (same or reversed)
    const _dupGroups = {}; // chainIndex → shared group array
    for(let a=0; a<_realSegs.length; a++){
      for(let b=a+1; b<_realSegs.length; b++){
        const ia=_realSegs[a], ib=_realSegs[b];
        const Aa=chain[ia].coord, Ab=chain[ia+1].coord;
        const Ba=chain[ib].coord, Bb=chain[ib+1].coord;
        const fwd = _hvDist(Aa,Ba)<MATCH_KM && _hvDist(Ab,Bb)<MATCH_KM;
        const rev = _hvDist(Aa,Bb)<MATCH_KM && _hvDist(Ab,Ba)<MATCH_KM;
        if(fwd||rev){
          if(!_dupGroups[ia]) _dupGroups[ia]=[ia];
          if(!_dupGroups[ia].includes(ib)) _dupGroups[ia].push(ib);
          _dupGroups[ib]=_dupGroups[ia]; // share same array reference
        }
      }
    }
    const _dupCount = Object.values(_dupGroups).filter((v,i,a)=>a.indexOf(v)===i).length;
    if(_dupCount) console.log('[TourMaG Live] Segments superposés (aller/retour):', _dupCount, 'paires');

    // Offset amount: ~0.6% of the bounding box diagonal, min ~500m
    const _lats = allCoords.map(c=>c[0]), _lngs = allCoords.map(c=>c[1]);
    const _diag = Math.sqrt(Math.pow(Math.max(..._lats)-Math.min(..._lats),2) + Math.pow(Math.max(..._lngs)-Math.min(..._lngs),2));
    const _offBase = Math.max(_diag * 0.006, 0.005);
    function _offsetSeg(a, b, side, refA, refB){
      // Perpendicular always computed from reference direction (first segment in group)
      const dx = (refB||b)[1]-(refA||a)[1], dy = (refB||b)[0]-(refA||a)[0];
      const len = Math.sqrt(dx*dx+dy*dy);
      if(len===0) return [a, b];
      const px = -dy/len, py = dx/len;
      const off = side * _offBase;
      return [[a[0]+px*off, a[1]+py*off], [b[0]+px*off, b[1]+py*off]];
    }

    // === STEP 3: Polylines with hover linked to endpoint markers ===
    for(let i=0; i<chain.length-1; i++){
      const w0=chain[i], w1=chain[i+1];
      let seg=[w0.coord, w1.coord];
      // Apply offset if this segment has a duplicate
      const _grp = _dupGroups[i];
      if(_grp && _grp.length > 1){
        const occIdx = _grp.indexOf(i);
        const n = _grp.length;
        const side = n > 1 ? (2 * Math.max(occIdx,0) / (n - 1)) - 1 : 0;
        // Always use first segment's direction as reference for perpendicular
        const refIdx = _grp[0];
        const refA = chain[refIdx].coord, refB = chain[refIdx+1].coord;
        seg = _offsetSeg(w0.coord, w1.coord, side, refA, refB);
      }
      const isDone = w0.status==='done' || w0.status==='now';
      const et = w0.etape;
      const label = et.type==='route' && et.nameEnd
        ? `${et.name} → ${et.nameEnd}` : et.name||'';
      const tipHtml = `<div class="exp-pop-name">${label}</div><div class="exp-pop-meta">${et.dateLabel||''} · ${et.km||''}</div>`;
      const baseOpts = isDone
        ? {color:accent, weight:3.5, opacity:.85}
        : {color:'#111', weight:2, dashArray:'6 8', opacity:.55};
      const hoverOpts = {color:accent, weight:baseOpts.weight, opacity:1, dashArray:null};

      // Transparent fat hit-area
      const bg = L.polyline(seg, {weight:22, color:'rgba(0,0,0,0)', opacity:1, interactive:true}).addTo(map);
      const fg = L.polyline(seg, baseOpts).addTo(map);
      fg.bindTooltip(tipHtml, {sticky:true, className:'exp-seg-tip'});

      const m0 = markerMap[coordKey(w0.coord)];
      const m1 = markerMap[coordKey(w1.coord)];
      const hiM = (m) => { if(m && !m.isDivIcon && m.marker.setStyle) m.marker.setStyle({color:accent, fillColor:accent, fillOpacity:1}); };
      const loM = (m) => { if(m && !m.isDivIcon && m.baseStyle && m.marker.setStyle) m.marker.setStyle(m.baseStyle); };

      bg.on('mouseover', function(e){ fg.setStyle(hoverOpts); fg.openTooltip(e.latlng); hiM(m0); hiM(m1); });
      bg.on('mousemove', function(e){ fg.openTooltip(e.latlng); });
      bg.on('mouseout',  function(){ fg.setStyle(baseOpts); fg.closeTooltip(); loM(m0); loM(m1); });
      // Click → open side panel
      bg.on('click', function(){ openExpMapPanel(et); });
      fg.on('click', function(){ openExpMapPanel(et); });
    }

    if(allCoords.length){
      const b=L.latLngBounds(allCoords);
      if(allCoords.length===1){
        // Un seul point : vue régionale, pas de zoom maximal
        map.setView(allCoords[0], 9);
      } else {
        // Plusieurs points : on cadre avec de la marge et on plafonne le zoom
        map.fitBounds(b.pad(0.25), {maxZoom:10, padding:[40,40]});
      }
    }

    // ===== ANIMATED DIRECTION ARROW =====
    // Build continuous path from chain (skip zero-length hops)
    const _animPath = [];
    for(let i=0; i<chain.length; i++){
      const c = chain[i].coord;
      if(_animPath.length === 0 || _hvDist(c, _animPath[_animPath.length-1]) > 0.5){
        _animPath.push(c);
      }
    }
    if(_animPath.length >= 2){
      // Compute cumulative distances for even-speed interpolation
      const _cumDist = [0];
      for(let i=1; i<_animPath.length; i++){
        _cumDist.push(_cumDist[i-1] + _hvDist(_animPath[i-1], _animPath[i]));
      }
      const _totalDist = _cumDist[_cumDist.length-1];

      // Bearing helper
      function _bearing(a, b){
        const dL=(b[1]-a[1])*Math.PI/180, la=a[0]*Math.PI/180, lb=b[0]*Math.PI/180;
        return (Math.atan2(Math.sin(dL)*Math.cos(lb), Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dL))*180/Math.PI+360)%360;
      }

      // Create arrow marker
      const _arrowSvg = `<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><path d="M4 17 L11 5 L18 17" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const _arrowMarker = L.marker(_animPath[0], {
        icon: L.divIcon({className:'exp-anim-arrow-wrap', html:`<div id="exp-anim-arrow" style="will-change:transform;transition:none">${_arrowSvg}</div>`, iconSize:[22,22], iconAnchor:[11,11]}),
        interactive: false, zIndexOffset: 900
      }).addTo(map);
      // Le marqueur reste fixe côté Leaflet ; on anime uniquement l'icône interne en pixels
      // pour un mouvement fluide sans recalcul de projection à chaque frame.
      if(_arrowMarker._icon){
        _arrowMarker._icon.style.transition='none';
        _arrowMarker._icon.style.willChange='transform';
        _arrowMarker._icon.style.margin='0';
      }

      // Animation loop: ~25 seconds per full circuit
      const LOOP_DURATION = 12000;
      let _animStart = null;
      let _prevAngle = null;
      if(window._expAnimFrame) cancelAnimationFrame(window._expAnimFrame);
      function _shortestAngle(from, to){
        let d = ((to - from + 540) % 360) - 180;
        return from + d;
      }
      // Recalcule les positions écran des points du tracé (après chaque zoom/pan)
      let _screenPts = [];
      function _computeScreenPts(){
        _screenPts = _animPath.map(p => map.latLngToLayerPoint(L.latLng(p[0], p[1])));
      }
      _computeScreenPts();
      map.on('zoomend moveend viewreset', _computeScreenPts);

      function _animStep(ts){
        if(!_animStart) _animStart = ts;
        const t = ((ts - _animStart) % LOOP_DURATION) / LOOP_DURATION;
        const targetDist = t * _totalDist;
        let segIdx = 0;
        for(let i=1; i<_cumDist.length; i++){
          if(_cumDist[i] >= targetDist){ segIdx = i-1; break; }
          if(i === _cumDist.length-1) segIdx = i-1;
        }
        const segLen = _cumDist[segIdx+1] - _cumDist[segIdx];
        const frac = segLen > 0 ? (targetDist - _cumDist[segIdx]) / segLen : 0;
        // Position en pixels (interpolation dans l'espace écran = déplacement parfaitement régulier)
        const pa = _screenPts[segIdx], pb = _screenPts[segIdx+1];
        if(pa && pb){
          const px = pa.x + (pb.x - pa.x) * frac;
          const py = pa.y + (pb.y - pa.y) * frac;
          // Angle calculé dans l'espace écran (cohérent avec le mouvement visible)
          const angle = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI + 90;
          _prevAngle = (_prevAngle===null) ? angle : (_prevAngle + (_shortestAngle(_prevAngle, angle) - _prevAngle) * 0.2);
          const el = _arrowMarker._icon;
          if(el){
            el.style.transform = 'translate3d('+(px-11)+'px,'+(py-11)+'px,0) rotate('+_prevAngle+'deg)';
            el.style.transition='none';
          }
        }
        window._expAnimFrame = requestAnimationFrame(_animStep);
      }
      window._expAnimFrame = requestAnimationFrame(_animStep);
    }

    // Auto-open panel on current étape (or first if trip hasn't started)
    const nowEtape = filteredEtapes.find(e => e.status==='now');
    const autoEtape = nowEtape || filteredEtapes[0];
    if(autoEtape) setTimeout(()=>{ openExpMapPanel(autoEtape); }, 400);
  }

  // ===== DECORATIVE ELEMENTS =====
  if(window._decorTimer) clearTimeout(window._decorTimer);
  document.querySelectorAll('[data-decor]').forEach(function(el){ el.remove(); });
  document.body.style.removeProperty('background');

  window._decorTimer = setTimeout(function(){
    // Nettoyage (au cas où un autre cycle de rendu aurait nettoyé avant nous)
    document.querySelectorAll('[data-decor]').forEach(function(el){ el.remove(); });
    document.body.style.removeProperty('background');
    try {
    var dc = event.decor;
    if(!dc || dc.enabled===false || mod.decor===false) return;

    if(dc.bgColor) document.body.style.setProperty('background', dc.bgColor, 'important');

    var SHAPES = window.DECOR_SHAPES || {};

    // ---- Rétro-compatibilité : convertit l'ancien schéma en éléments si aucun elements[] ----
    var elements = Array.isArray(dc.elements) ? dc.elements.slice() : null;
    if(!elements){
      elements = [];
      if(dc.compass && dc.compass.on!==false) elements.push({shape:'boussole',block:'etapes',corner:(dc.compass.position||'top-left'),x:2,y:2,size:120,opacity:(dc.compass.opacity||4)/20*100,color:'#999'});
      if(dc.plane && dc.plane.on!==false){ var pm={'after-map':'etapes','after-live':'live','after-citations':'citations','after-gallery':'gallery'}; elements.push({shape:'avion',block:(pm[dc.plane.position]||'etapes'),corner:'bottom-center',x:0,y:0,size:120,opacity:(dc.plane.opacity||4)/20*100,color:'#999'}); }
      if(dc.botanical && dc.botanical.on!==false){ var bs={eucalyptus:'feuille',palm:'palmier',maple:'feuille',cactus:'cactus',pine:'fougere',olive:'feuille',cherry:'feuille',wheat:'fougere'}; elements.push({shape:(bs[dc.botanical.style]||'feuille'),block:'citations',corner:'top-left',x:3,y:6,size:120,opacity:(dc.botanical.opacity||3)/20*100,color:'#888'}); }
      if(dc.stamp && dc.stamp.on!==false) elements.push({shape:'tampon',block:'gallery',corner:'top-right',x:4,y:4,size:130,opacity:(dc.stamp.opacity||4)/20*100,rotation:(dc.stamp.rotation||12),color:'#888'});
      if(dc.relief && dc.relief.on!==false){ var rs={hills:'relief',mountains:'montagne',waves:'vagues',skyline:'relief',volcano:'montagne'}; elements.push({shape:(rs[dc.relief.style]||'relief'),block:'sponsors',corner:'bottom-center',x:0,y:0,size:200,opacity:(dc.relief.opacity||4)/20*100,color:'#888'}); }
    }
    if(!elements.length) return;

    // ---- Résolution du conteneur cible pour un bloc donné ----
    function targetFor(block){
      if(!block || block==='page') return document.body;
      var el = document.querySelector('[data-exp-block="'+block+'"]');
      return el || null;
    }
    // ---- Position depuis le coin/bord d'ancrage + décalage % ----
    function place(node, corner, x, y){
      corner = corner || 'top-left';
      var px = (typeof x==='number'?x:2), py = (typeof y==='number'?y:2);
      var s = 'position:absolute;';
      var vert = corner.indexOf('bottom')>=0 ? 'bottom' : (corner.indexOf('center')>=0 && corner.indexOf('-')<0 ? 'top' : 'top');
      // corner formats: top-left, top-center, top-right, mid-left, center, mid-right, bottom-left, bottom-center, bottom-right
      var parts = corner.split('-');
      var v = parts[0], h = parts[1]||'center';
      if(corner==='center'){ v='center'; h='center'; }
      // vertical
      if(v==='top') s+='top:'+py+'%;';
      else if(v==='bottom') s+='bottom:'+py+'%;';
      else s+='top:'+(50)+'%;';
      // horizontal
      if(h==='left') s+='left:'+px+'%;';
      else if(h==='right') s+='right:'+px+'%;';
      else s+='left:'+(50)+'%;';
      // transforms for centered axes
      var tx = (h==='center')?'-50%':'0', ty=(v==='center')?'-50%':'0';
      node.setAttribute('data-tx',tx); node.setAttribute('data-ty',ty);
      return s;
    }

    var MAXW = 320; // garde-fou taille max (px)
    elements.slice(0,12).forEach(function(elDef){
      var shapeKey = elDef.shape || 'cercle';
      var raw = SHAPES[shapeKey];
      if(!raw) return;
      var tgt = targetFor(elDef.block);
      if(!tgt) return;
      if(tgt!==document.body){ tgt.style.position='relative'; tgt.style.overflow='visible'; }

      var color = elDef.color || '#8a8578';
      var size = Math.min(Math.max(parseInt(elDef.size)||120, 20), MAXW);
      var opacity = (typeof elDef.opacity==='number'?elDef.opacity:30)/100;
      var rot = parseInt(elDef.rotation)||0;

      var svg = '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" fill="none" stroke="'+color+'" stroke-width="1.4" xmlns="http://www.w3.org/2000/svg">'+raw.replace(/C/g,color)+'</svg>';

      var node = document.createElement('div');
      node.setAttribute('data-decor','1');
      var posCss = place(node, elDef.corner, elDef.x, elDef.y);
      var tx=node.getAttribute('data-tx'), ty=node.getAttribute('data-ty');
      node.style.cssText = posCss + 'pointer-events:none;z-index:'+(elDef.front?'50':'0')+';opacity:'+opacity+';transform:translate('+tx+','+ty+') rotate('+rot+'deg);width:'+size+'px;height:'+size+'px;line-height:0;';
      node.innerHTML = svg;

      if(tgt===document.body){
        node.style.position='fixed';
        tgt.appendChild(node);
      } else {
        tgt.appendChild(node);
      }
    });

    console.log('[TourMaG Live] Decor OK —', elements.length, 'élément(s)');
    }catch(e){console.error('[TourMaG Live] Decor error:',e);}
  }, 600);

  // Fade-in observer — on deconnecte le precedent avant recreation (sinon fuite d'observers)
  if(window._fadeObsE) window._fadeObsE.disconnect();
  window._fadeObsE = new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');window._fadeObsE.unobserve(e.target);}});
  },{threshold:.06});
  document.querySelectorAll('.fi').forEach(el=>window._fadeObsE.observe(el));

  // Instagram embeds
  if(window._socialParseTimer) clearTimeout(window._socialParseTimer);
  window._socialParseTimer = setTimeout(()=>{
    try{if(window.instgrm&&window.instgrm.Embeds) window.instgrm.Embeds.process();}catch(e){}
  },400);

  // Init accordion clamps after DOM update
  requestAnimationFrame(initExpClamps);
}

// Expedition toggle (simpler than live, no chevron SVG)
window.toggleExpExpand = function(expandId, btnId, count, openLabel, closedLabel){
  const el=document.getElementById(expandId), btn=document.getElementById(btnId);
  if(!el||!btn) return;
  const open=el.classList.toggle('open');
  btn.textContent = open ? (openLabel||'▴ Réduire') : (closedLabel||`▾ Voir les ${count} entrées précédentes`);
  if(open) requestAnimationFrame(initExpClamps);
  if(typeof sendHeight==='function') setTimeout(sendHeight,50);
};

// ===== MAP SIDE PANEL =====

// Expedition entry builder
function mkExpEntry(entry, etapes, jrPhotoMap, isLatest, lineClamp){
  const jrKey = (entry.journalist||'').toLowerCase().trim();
  const jrPhoto = jrPhotoMap[jrKey] || '';
  const etape = entry.etape ? (etapes||[]).find(e=>e.id===entry.etape) : null;
  const isNow = etape && etape.status === 'now';
  const clampId = 'exp-clamp-'+entry.id;

  let o = `<div class="exp-entry${isNow?' now':''}${isLatest?' exp-entry-latest':''}" id="live-${entry.id||''}">`;
  o += `<div class="exp-entry-meta">`;
  o += `<span>${fmtTime(entry.time)}</span>`;
  if(entry.tag) o += `<span class="tag">${entry.tag}</span>`;
  if(entry.journalist) o += `<span>${entry.journalist}</span>`;
  if(etape) o += `<span>📍 ${etape.name}</span>`;
  o += `</div>`;

  if(entry.title) o += `<h3>${entry.title}</h3>`;

  if(entry.text){
    let txt = entry.text;
    // Wrap «...» in verbatim spans
    txt = txt.replace(/«\s*([^»]+)\s*»/g, '<span class="verbatim">« $1 »</span>');
    // Support links
    if(entry.url) txt += ` <a href="${entry.url}" target="_blank">→ Lire la suite</a>`;
    if(lineClamp && lineClamp > 0){
      o += `<div class="exp-entry-body exp-entry-clamp" id="${clampId}" style="--exp-clamp:${lineClamp}">${txt}</div>`;
      o += `<button class="exp-entry-toggle" data-clamp="${clampId}" onclick="toggleExpClamp(this)">▼ Lire la suite</button>`;
    } else {
      o += `<div class="exp-entry-body">${txt}</div>`;
    }
  }

  if(entry.image){
    o += `<figure class="exp-entry-photo">
      <img src="${entry.image}" alt="" style="height:${entry.image_height||280}px;object-position:${entry.image_position||'center center'}" onerror="this.parentElement.remove()">
      <figcaption>
        <span>${entry.image_caption||''}</span>
        <span>${entry.image_credit ? '© '+entry.image_credit : ''}</span>
      </figcaption>
    </figure>`;
  }

  if(etape && etape.km) o += `<div class="exp-entry-km">${etape.km}</div>`;

  o += `<div class="exp-entry-actions">${mkLikeButton(entry.id, entry.likeCount)}${mkShareButton(entry)}</div>`;

  o += `</div>`;
  return o;
}

  document.querySelectorAll('.exp-entry-clamp').forEach(el => {
    const btn = el.nextElementSibling;

    if(el.scrollHeight > el.clientHeight + 2){

// Charge les likes de l'utilisateur anonyme pour l'événement courant
async function _loadUserLikes(eventId){
  window._eventIdForLikes = eventId;
  const uid = await _likeAuthReady;
  if(!uid) return; // auth indisponible → likes en lecture seule
  try{
    const snap = await db.collection('events').doc(eventId).collection('userLikes').doc(uid).get();
    if(snap.exists){
      const liked = snap.data().liked || {};
      Object.keys(liked).forEach(k=>{ if(liked[k]) window._likedSet.add(k); });
    }
  }catch(e){ console.warn('Lecture des likes impossible :', e.message); }
  // Rafraîchit l'affichage des cœurs déjà actifs
  _refreshLikeButtons();
}
function _refreshLikeButtons(){
  document.querySelectorAll('[data-like-entry]').forEach(btn=>{
    const id = btn.getAttribute('data-like-entry');
    if(window._likedSet.has(id)) btn.classList.add('liked');
    else btn.classList.remove('liked');
  });
}

// Like / unlike optimiste avec transaction
window._toggleLike = async function(entryId, btnEl){
  const eventId = window._eventIdForLikes;
  const uid = await _likeAuthReady;
  if(!eventId || !uid){ return; }
  const wasLiked = window._likedSet.has(entryId);
  const delta = wasLiked ? -1 : 1;
  // MAJ optimiste immédiate de l'UI
  if(wasLiked) window._likedSet.delete(entryId); else window._likedSet.add(entryId);
  if(btnEl){ btnEl.classList.toggle('liked', !wasLiked); btnEl.classList.add('like-bounce'); setTimeout(()=>btnEl.classList.remove('like-bounce'),300); }
  const cEl = document.querySelector('[data-like-count="'+entryId+'"]');
  if(cEl){ const cur=parseInt(cEl.textContent||'0')||0; const nv=Math.max(0,cur+delta); cEl.textContent=nv>0?nv:''; }
  // Ecriture Firestore
  const entryRef = db.collection('events').doc(eventId).collection('live').doc(entryId);
  const userRef = db.collection('events').doc(eventId).collection('userLikes').doc(uid);
  try{
    const batch = db.batch();
    batch.set(entryRef, {likeCount: firebase.firestore.FieldValue.increment(delta)}, {merge:true});
    batch.set(userRef, {liked: {[entryId]: wasLiked ? firebase.firestore.FieldValue.delete() : true}}, {merge:true});
    await batch.commit();
  }catch(e){
    console.warn('Like non enregistré :', e.message);
    // Rollback UI si échec
    if(wasLiked) window._likedSet.add(entryId); else window._likedSet.delete(entryId);
    if(btnEl) btnEl.classList.toggle('liked', wasLiked);
    if(cEl){ const cur=parseInt(cEl.textContent||'0')||0; const nv=Math.max(0,cur-delta); cEl.textContent=nv>0?nv:''; }
  }
};

window._eventIdForQuestions = null;
// Bloc HTML complet : formulaire + liste des questions validées. Réutilisé classique + expédition.
function mkQuestionsBlock(questions, opts){
  opts = opts || {};
  const cls = opts.exp ? 'qa-block qa-exp' : 'qa-block';
  const title = opts.title || 'Questions en direct';
  const sub = opts.sub || 'Une question ? Posez-la, nous y répondons.';
  const activePhase = opts.activePhase || '';
  const QA_LIMIT = opts.limit && opts.limit>0 ? opts.limit : 10;
  // Couleurs personnalisables (via variables CSS locales au bloc)
  let styleVars = '';
  if(opts.accent) styleVars += `--qa-accent:${opts.accent};`;
  if(opts.qBg) styleVars += `--qa-item-bg:${opts.qBg};`;
  if(opts.qText) styleVars += `--qa-q-color:${opts.qText};`;
  if(opts.formBg) styleVars += `--qa-form-bg:${opts.formBg};`;
  // Filtrage : questions de la phase active + questions générales (sans phase).
  // Si pas de phase active du tout (événement sans phases), on montre tout.
  let approved = (questions||[]).filter(q=>q.status==='approved');
  if(activePhase){
    approved = approved.filter(q => !q.phase || q.phase === activePhase);
  }
  // Plus récentes en premier (tri décroissant par date de création).
  approved = approved.slice().sort((a,b)=>tsVal(b.createdAt)-tsVal(a.createdAt));
  let list = '';
  const shown = approved.slice(0, QA_LIMIT);
  const rest = approved.slice(QA_LIMIT);
  function itemHTML(q){
    const who = q.name ? `<span class="qa-name">${_qEsc(q.name)}</span>` : '<span class="qa-name qa-anon">Anonyme</span>';
    const ans = q.answer ? `<div class="qa-answer"><span class="qa-answer-label">Réponse</span>${_qEsc(q.answer)}</div>` : '';
    return `<div class="qa-item"><div class="qa-q">${_qEsc(q.text)}</div><div class="qa-meta">${who}</div>${ans}</div>`;
  }
  shown.forEach(q=>{ list += itemHTML(q); });
  let hiddenList = '';
  rest.forEach(q=>{ hiddenList += itemHTML(q); });
  const moreBtn = rest.length ? `<div class="qa-more-wrap"><button class="qa-more" data-more-label="Voir ${rest.length} question${rest.length>1?'s':''} de plus" data-less-label="Réduire" onclick="window._qaShowMore(this)">Voir ${rest.length} question${rest.length>1?'s':''} de plus</button></div>` : '';
  const hiddenBlock = rest.length ? `<div class="qa-list qa-hidden" style="display:none">${hiddenList}</div>` : '';

  return `<div id="section-questions" class="${cls} fi"${styleVars?` style="${styleVars}"`:''}>
    <div class="${opts.exp?'exp-section-head exp-sec-questions':'sec-title sec-title-questions'}">${opts.exp?`<h2>${title}</h2><div class="rule"></div>`:`<div class="sec-title-icon" style="background:rgba(99,102,241,.08);color:#6366F1">${ICO.msgCircle||''}</div><h2>${title}</h2><div class="sec-title-line"></div><p>${sub}</p>`}</div>
    <div class="qa-form">
      <textarea class="qa-input" id="qa-text" rows="2" maxlength="500" placeholder="Votre question…"></textarea>
      <div class="qa-form-row">
        <input class="qa-name-input" id="qa-name" maxlength="60" placeholder="Votre prénom / nom (facultatif)">
        <button class="qa-submit" onclick="window._submitQuestion()">Envoyer</button>
      </div>
      <div class="qa-note" id="qa-note">Votre question sera publiée après validation par la rédaction.</div>
    </div>
    ${shown.length?`<div class="qa-list">${list}</div>`:''}
    ${hiddenBlock}
    ${moreBtn}
  </div>`;
}
window._qaShowMore = function(btn){
  const wrap = btn.closest('.qa-block');
  if(!wrap) return;
  const hidden = wrap.querySelector('.qa-hidden');
  if(!hidden) return;
  const isOpen = hidden.style.display !== 'none';
  if(isOpen){
    hidden.style.display = 'none';
    btn.textContent = btn.getAttribute('data-more-label') || 'Voir plus';
    btn.classList.remove('open-state');
  } else {
    hidden.style.display = '';
    btn.textContent = btn.getAttribute('data-less-label') || 'Réduire';
    btn.classList.add('open-state');
  }
};
function _qEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

window._submitQuestion = async function(){
  const eventId = window._eventIdForQuestions;
  const txtEl = document.getElementById('qa-text');
  const nameEl = document.getElementById('qa-name');
  const note = document.getElementById('qa-note');
  if(!eventId || !txtEl) return;
  const text = txtEl.value.trim();
  const name = (nameEl?.value||'').trim();
  if(text.length < 3){ if(note){ note.textContent='Merci d\'écrire une question un peu plus longue.'; note.className='qa-note qa-err'; } return; }
  // Anti-spam léger : 1 envoi / 30s par navigateur
  try{
    const last = parseInt(localStorage.getItem('tmg_q_last_'+eventId)||'0');
    if(Date.now()-last < 30000){ if(note){ note.textContent='Merci de patienter quelques instants avant de reposer une question.'; note.className='qa-note qa-err'; } return; }
  }catch(e){}
  const uid = await _likeAuthReady; // réutilise l'auth anonyme des likes
  const btn = document.querySelector('.qa-submit');
  if(btn){ btn.disabled=true; btn.textContent='Envoi…'; }
  try{
    await db.collection('events').doc(eventId).collection('questions').add({
      text: text.slice(0,500),
      name: name.slice(0,60),
      status: 'pending',
      phase: window._activePhase || '',
      uid: uid || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    try{ localStorage.setItem('tmg_q_last_'+eventId, String(Date.now())); }catch(e){}
    txtEl.value=''; if(nameEl) nameEl.value='';
    if(note){ note.textContent='✓ Merci ! Votre question a été transmise et sera publiée après validation.'; note.className='qa-note qa-ok'; }
  }catch(e){
    if(note){ note.textContent='Une erreur est survenue. Réessayez dans un instant.'; note.className='qa-note qa-err'; }
    console.warn('Question non envoyée :', e.message);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Envoyer'; }
  }
};

window._quizTotals = {};     // { quizId: { qId: total votants } }
