<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden!important;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0}
.er{--er-accent:#E8842C;--er-bg1:#1B1B2F;--er-bg2:#2D1B4E;--er-text:#ffffff;--er-fs:1;max-width:1200px;margin:0 auto;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--er-bg1) 0%,var(--er-bg2) 40%,var(--er-bg1) 100%);border-radius:16px;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
.er::before{content:'';position:absolute;top:-40px;right:-40px;width:300px;height:300px;background:radial-gradient(circle,rgba(232,132,44,.1) 0%,transparent 70%);pointer-events:none}

/* HEADER */
.er-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 12px;position:relative;z-index:2;flex-wrap:wrap;gap:10px}
.er-h-left{display:flex;align-items:center;gap:12px}
.er-h-logo{max-height:36px;max-width:80px;object-fit:contain;border-radius:6px}
.er-h-text{}
.er-h-title{font-family:'Josefin Sans';font-size:calc(16px * var(--er-fs));font-weight:700;color:var(--er-text)}
.er-h-sub{font-size:10px;color:rgba(255,255,255,.4)}
.er-cta{display:flex;align-items:center;gap:6px;padding:8px 20px;background:var(--er-accent);color:#fff;font-family:'Josefin Sans';font-size:11px;font-weight:700;border-radius:8px;text-decoration:none;transition:background .15s;letter-spacing:.3px;flex-shrink:0;animation:er-pulse 2.5s infinite}
.er-cta:hover{background:#D4731D}
@keyframes er-pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,132,44,.4)}50%{box-shadow:0 0 0 8px rgba(232,132,44,0)}}

/* FLASH */
.er-flash{display:flex;align-items:center;gap:10px;padding:8px 24px;background:rgba(220,38,38,.12);border-top:1px solid rgba(220,38,38,.15);position:relative;z-index:2;overflow:hidden}
.er-flash-badge{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:#DC2626;padding:3px 10px;border-radius:5px;flex-shrink:0;animation:er-fpls 2s infinite}
@keyframes er-fpls{0%,100%{opacity:1}50%{opacity:.5}}
.er-flash-text{font-size:calc(12px * var(--er-fs));font-weight:500;color:rgba(255,255,255,.85);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* MID: ESSENTIEL + CITATION */
.er-mid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 24px;position:relative;z-index:2}

/* ESSENTIEL CAROUSEL */
.er-ess{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 18px;position:relative;border-left:3px solid #3B82F6}
.er-ess-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.er-ess-label{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.er-ess-pag{font-family:'IBM Plex Mono';font-size:9px;color:rgba(255,255,255,.3)}
.er-ess-tag{font-family:'Josefin Sans';font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:6px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.er-ess-text{font-size:calc(11px * var(--er-fs));line-height:1.6;color:rgba(255,255,255,.75)}
.er-ess-text strong{color:#fff;font-weight:700}
.er-ess-dots{display:flex;gap:4px;margin-top:10px}
.er-ess-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .2s}
.er-ess-dot.active{background:var(--er-accent)}

/* CITATION */
.er-cit{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 18px}
.er-cit-inner{display:flex;gap:12px;align-items:center}
.er-cit-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.12);flex-shrink:0;background:rgba(255,255,255,.06)}
.er-cit-avatar-ph{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.06);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.er-cit-avatar-ph svg{width:22px;height:22px;stroke:rgba(255,255,255,.25)}
.er-cit-body{flex:1;min-width:0}
.er-cit-name{font-family:'Josefin Sans';font-size:11px;font-weight:700;color:#fff;margin-bottom:1px}
.er-cit-role{font-size:9px;color:rgba(255,255,255,.35);margin-bottom:6px}
.er-cit-text{font-size:calc(10px * var(--er-fs));font-style:italic;color:rgba(255,255,255,.65);line-height:1.5}
.er-cit-nav{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.er-cit-pag{font-family:'IBM Plex Mono';font-size:9px;color:rgba(255,255,255,.3)}

/* FRISE */
.er-frise{display:grid;grid-template-columns:repeat(var(--frise-cols,3),1fr);gap:0;padding:12px 24px 16px;position:relative;z-index:2}
.er-frise::before{content:'';position:absolute;top:20px;left:24px;right:24px;height:1.5px;background:rgba(255,255,255,.08)}
.er-fe{display:flex;flex-direction:column;align-items:center;padding:0 6px}
.er-fe-d{width:8px;height:8px;border-radius:50%;background:var(--er-accent);border:2px solid rgba(27,27,47,.9);box-shadow:0 0 0 1.5px var(--er-accent);margin-bottom:7px;z-index:1}
.er-fe-date{font-family:'IBM Plex Mono';font-size:9px;color:var(--er-accent);font-weight:600;margin-bottom:3px}
.er-fe-txt{font-size:calc(10px * var(--er-fs));color:rgba(255,255,255,.5);text-align:center;line-height:1.4}

/* FIL LIVE + ARTICLES (modules compacts) */
.er-mod{padding:12px 24px;position:relative;z-index:2}
.er-mod-label{font-family:'Josefin Sans';font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px}
.er-litem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);text-decoration:none}
.er-litem:last-child{border-bottom:none}
.er-litem-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.06)}
.er-litem-body{flex:1;min-width:0}
.er-litem-time{font-family:'IBM Plex Mono';font-size:8px;color:var(--er-accent);font-weight:600;margin-bottom:2px}
.er-litem-text{font-size:calc(11px * var(--er-fs));line-height:1.45;color:rgba(255,255,255,.8);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.er-litem-text strong{color:var(--er-text)}

.er-loading{padding:40px;text-align:center;font-size:12px;color:rgba(255,255,255,.3)}

/* FOOTER ZONE */
.er-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,.06)}
.er-footer.lay-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.er-footer.lay-col{display:flex;flex-direction:column;gap:12px}
.er-footer.lay-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.er-footer.lay-btn-only{display:flex;justify-content:center;gap:12px}
.er-footer-text{font-size:14px;color:rgba(255,255,255,.75);line-height:1.6;flex:1;min-width:0}
.er-footer-text strong{color:#fff}
.er-footer-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 24px;background:rgba(255,255,255,.12);color:#fff;font-family:'Josefin Sans';font-size:13px;font-weight:700;border-radius:8px;text-decoration:none;transition:background .15s;letter-spacing:.3px}
.er-footer-btn:hover{background:rgba(255,255,255,.2)}
.lay-btn-only .er-footer-btn{width:100%;padding:12px 24px;font-size:14px}
.lay-col .er-footer-btn,.lay-center .er-footer-btn{align-self:flex-start}
.lay-center .er-footer-btn{align-self:center}

@media(max-width:560px){
  .er-h{flex-direction:column;align-items:flex-start;gap:8px}
  .er-cta{width:100%;justify-content:center}
  .er-mid{grid-template-columns:1fr}
  .er-frise{grid-template-columns:1fr;gap:8px}
  .er-frise::before{display:none}
  .er-fe{flex-direction:row;gap:10px;align-items:flex-start}
  .er-fe-d{margin-bottom:0;margin-top:4px;flex-shrink:0}
  .er-fe-txt{text-align:left}
}
</style>
</head>
<body>

<div class="er" id="encart"><div class="er-loading">Chargement...</div></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
// CONFIG — À remplacer par le vrai projet Firebase
firebase.initializeApp({
  apiKey:"AIzaSyDtKWuGcF2MFI3Er9mRuL1qtzhbqsQP3PY",
  authDomain:"tourmag-live.firebaseapp.com",
  projectId:"tourmag-live"
});
const db=firebase.firestore();

// Helper : convertit un champ date Firestore/divers en timestamp comparable
function _wTs(v){ try{ if(v?.toDate) return v.toDate().getTime(); if(typeof v==='number') return v; if(!v) return 0; const d=new Date(v); return isNaN(d)?0:d.getTime(); }catch(e){ return 0; } }

const DEMO=false;
const DEMO_DATA={
  event:{title:"IFTM Top Resa 2026",location:"Paris — Porte de Versailles",dates:"30 sept. — 2 oct. 2026",status:"live",logo_url:"",flash_text:"Le ministre annonce un plan de 500 M€ pour le tourisme durable"},
  essential:[
    {tag:"DISTRIBUTION",text:"<strong>Orchestra / Amadeus</strong> annoncent une intégration NDC complète pour 2027."},
    {tag:"AÉRIEN",text:"<strong>Air France</strong> dévoile 12 nouvelles routes moyen-courrier."},
    {tag:"DURABILITÉ",text:"Le label <strong>ATR</strong> franchit 100 TO certifiés."},
    {tag:"DESTINATIONS",text:"L'<strong>Ouzbékistan</strong> et la <strong>Géorgie</strong> émergent comme destinations phares."},
    {tag:"HÔTELLERIE",text:"<strong>Accor</strong> annonce 45 nouvelles adresses lifestyle Ennismore."},
    {tag:"ÉCONOMIE",text:"Le tourisme français dépasse <strong>200 Mds € de CA</strong>, +8% vs 2025."}
  ],
  citation:{text:"L'IA ne remplacera pas les agents de voyages, mais les agents qui utilisent l'IA remplaceront ceux qui ne l'utilisent pas.",name:"Sophie Lacroix",role:"Directrice Innovation, Amadeus France",avatar:""},
  timeline:[
    {date:"29 sept.",text:"Workshop presse — brochures hiver 2027"},
    {date:"30 sept.",text:"J1 — Plan 500 M€ tourisme durable annoncé"},
    {date:"1 oct.",text:"J2 — Tables rondes IA et NDC"}
  ]
};

const TAG_BORDERS={"DISTRIBUTION":"#3B82F6","AÉRIEN":"#60A5FA","DURABILITÉ":"#34D399","DESTINATIONS":"#60A5FA","HÔTELLERIE":"#FB923C","ÉCONOMIE":"#94A3B8","TECH":"#2DD4BF","POLITIQUE":"#F87171","GÉNÉRAL":"rgba(255,255,255,.2)"};

let essIdx=0, essTimer=null, citIdx=0, citTimer=null;
var _essPts=[];
var _citPts=[];
var _tagColors={};
var _rendered=false; // track if initial render is done
var _lastStructureKey=''; // track if structure changed

function getStructureKey(data){
  // Key that changes when we need a full re-render (counts, flash, footer, timeline)
  return [
    (data.essential||[]).length,
    (data.citations||[]).length,
    (data.timeline||[]).length,
    (data.live||[]).length,
    (data.articles||[]).length,
    data.event?.flash_text||'',
    data.event?.widgetFooterText||'',
    data.event?.widgetFooterBtnLabel||'',
    data.event?.logo_url||'',
    JSON.stringify(data.event?.widgetConfig||{})
  ].join('|');
}

function renderEncart(data, forceRender){
  const {event,essential,citations,timeline,live,articles}=data;
  _essPts=essential||[];
  _citPts=citations||[];
  // Build dynamic tag colors from event.tags (overrides static TAG_BORDERS)
  _tagColors={...TAG_BORDERS};
  (event.tags||[]).forEach(t=>{
    if(typeof t==='string')return;
    if(t&&t.name&&t.color) _tagColors[t.name.toUpperCase()]=t.color;
  });

  // Check if we need a full re-render or just data update
  const newKey=getStructureKey(data);
  if(_rendered && !forceRender && newKey===_lastStructureKey){
    // Structure unchanged — just update data arrays, carousels will pick up on next cycle
    // But update timeline text in case it changed
    const tlContainer=document.querySelector('.er-frise');
    if(tlContainer && timeline){
      const cols=Math.min(timeline.length,5);
      let tlH='';
      timeline.slice(-5).forEach(t=>{
        tlH+=`<div class="er-fe"><div class="er-fe-d"></div><div class="er-fe-date">${t.date}</div><div class="er-fe-txt">${t.text}</div></div>`;
      });
      tlContainer.style.setProperty('--frise-cols',cols);
      tlContainer.innerHTML=tlH;
    }
    return;
  }
  _lastStructureKey=newKey;

  // Clear existing timers before full re-render
  if(essTimer){clearInterval(essTimer);essTimer=null;}
  if(citTimer){clearInterval(citTimer);citTimer=null;}

  // CTA URL: use event.widgetCtaUrl, fallback to ?cta= param, then default
  const paramCta=new URLSearchParams(window.location.search).get('cta');
  const eventId=new URLSearchParams(window.location.search).get('event')||'';
  const ctaUrl=event.widgetCtaUrl||paramCta||('index.html?event='+eventId);
  const liveUrl=ctaUrl;

  // --- CONFIG D'APPARENCE + MODULES ---
  const cfg=event.widgetConfig||{};
  const erEl=document.querySelector('.er')||document.getElementById('encart');
  // Applique les variables d'apparence sur le conteneur racine
  const rootStyle=document.getElementById('encart');
  const accent=cfg.accent||'#E8842C';
  const bg=cfg.bg||'';
  const textColor=cfg.textColor||'';
  const fsMap={small:0.9,medium:1,large:1.15};
  const fs=fsMap[cfg.textSize]||1;

  // Ordre par défaut si non configuré (rétro-compatible avec l'ancien encart)
  const DEFAULT_ORDER=['header','flash','mid','live','articles','timeline','footer'];
  const order=(cfg.order&&cfg.order.length)?cfg.order.slice():DEFAULT_ORDER.slice();
  // Ajoute les modules manquants (nouveaux) à la fin pour les events déjà configurés
  DEFAULT_ORDER.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  const off=cfg.off||[];
  const isOn=k=>!off.includes(k);

  // --- FABRIQUES DE MODULES ---
  function modHeader(){
    let s=`<div class="er-h"><div class="er-h-left">`;
    if(event.logo_url) s+=`<img class="er-h-logo" src="${event.logo_url}" alt="" onerror="this.remove()">`;
    s+=`<div class="er-h-text"><div class="er-h-title">${event.title||''}</div><div class="er-h-sub">${event.location||''} · ${event.dates||''}</div></div></div>`;
    s+=`<a class="er-cta" href="${ctaUrl}" target="_blank">Accéder au Live →</a></div>`;
    return s;
  }
  function modFlash(){
    if(!event.flash_text) return '';
    return `<div class="er-flash"><span class="er-flash-badge">DERNIÈRE INFO</span><span class="er-flash-text">${event.flash_text}</span></div>`;
  }
  function modMid(){
    const hasEss=essential&&essential.length, hasCit=citations&&citations.length;
    if(!hasEss && !hasCit) return '';
    let s=`<div class="er-mid">`;
    if(hasEss){
      const bc=_tagColors[(essential[0].tag||'').toUpperCase()]||'#3B82F6';
      s+=`<div class="er-ess" id="er-ess" style="border-left-color:${bc}">`;
      s+=`<div class="er-ess-head"><span class="er-ess-label">L'essentiel</span><span class="er-ess-pag" id="er-ess-pag">1/${essential.length}</span></div>`;
      s+=`<div id="er-ess-tag"></div><div class="er-ess-text" id="er-ess-text"></div>`;
      s+=`<div class="er-ess-dots" id="er-ess-dots">`;
      essential.forEach((_,i)=>{ s+=`<div class="er-ess-dot${i===0?' active':''}" onclick="goEss(${i})"></div>`; });
      s+=`</div></div>`;
    }
    if(hasCit){
      s+=`<div class="er-cit" id="er-cit"><div class="er-cit-inner"><div class="er-cit-media" id="er-cit-media"></div>`;
      s+=`<div class="er-cit-body"><div class="er-cit-name" id="er-cit-name"></div><div class="er-cit-role" id="er-cit-role"></div><div class="er-cit-text" id="er-cit-text"></div></div></div>`;
      if(citations.length>1){
        s+=`<div class="er-cit-nav"><span class="er-cit-pag" id="er-cit-pag">1/${citations.length}</span><div class="er-ess-dots" id="er-cit-dots">`;
        citations.forEach((_,i)=>{ s+=`<div class="er-ess-dot${i===0?' active':''}" onclick="goCit(${i})"></div>`; });
        s+=`</div></div>`;
      }
      s+=`</div>`;
    }
    s+=`</div>`;
    return s;
  }
  function modTimeline(){
    if(!timeline||!timeline.length) return '';
    const cols=Math.min(timeline.length,5);
    let s=`<div class="er-frise" style="--frise-cols:${cols}">`;
    timeline.slice(-5).forEach(t=>{
      s+=`<div class="er-fe"><div class="er-fe-d"></div><div class="er-fe-date">${t.date}</div><div class="er-fe-txt">${t.text}</div></div>`;
    });
    s+=`</div>`;
    return s;
  }
  function modLive(){
    const items=(live||[]).slice(0,3);
    if(!items.length) return '';
    let s=`<div class="er-mod"><div class="er-mod-label">En direct</div>`;
    items.forEach(it=>{
      const time=it.time||it.hour||'';
      const txt=it.text||it.content||'';
      s+=`<a class="er-litem" href="${liveUrl}" target="_blank">${time?`<div class="er-litem-body"><div class="er-litem-time">${time}</div><div class="er-litem-text">${txt}</div></div>`:`<div class="er-litem-body"><div class="er-litem-text">${txt}</div></div>`}</a>`;
    });
    s+=`</div>`;
    return s;
  }
  function modArticles(){
    const items=(articles||[]).slice(0,3);
    if(!items.length) return '';
    let s=`<div class="er-mod"><div class="er-mod-label">À lire</div>`;
    items.forEach(it=>{
      const img=it.image||it.image_url||it.thumb||'';
      const title=it.title||it.text||'';
      const url=it.url||it.link||liveUrl;
      s+=`<a class="er-litem" href="${url}" target="_blank">${img?`<img class="er-litem-thumb" src="${img}" alt="" onerror="this.remove()">`:''}<div class="er-litem-body"><div class="er-litem-text"><strong>${title}</strong></div></div></a>`;
    });
    s+=`</div>`;
    return s;
  }
  function modFooter(){
    const fText=event.widgetFooterText||'';
    const fBtnLabel=event.widgetFooterBtnLabel||'';
    const fBtnUrl=event.widgetFooterBtnUrl||'';
    const fColor=event.widgetFooterColor||'#1B1B2F';
    const fLayout=event.widgetFooterLayout||'row';
    if(!fText && !fBtnLabel) return '';
    let s=`<div class="er-footer lay-${fLayout}" style="background:${fColor}">`;
    if(fLayout!=='btn-only' && fText) s+=`<div class="er-footer-text">${fText}</div>`;
    if(fBtnLabel&&fBtnUrl) s+=`<a class="er-footer-btn" href="${fBtnUrl}" target="_blank">${fBtnLabel} →</a>`;
    s+=`</div>`;
    return s;
  }
  const MODS={header:modHeader,flash:modFlash,mid:modMid,timeline:modTimeline,live:modLive,articles:modArticles,footer:modFooter};

  let h='';
  order.forEach(k=>{ if(isOn(k) && MODS[k]) h+=MODS[k](); });

  // Garde-fou : l'encart doit toujours mener au live. Si ni header ni footer-bouton visibles, on ajoute un CTA discret.
  const headerOn=isOn('header') && order.includes('header');
  const footerHasBtn=isOn('footer') && (event.widgetFooterBtnLabel&&event.widgetFooterBtnUrl);
  if(!headerOn && !footerHasBtn){
    h+=`<div class="er-footer lay-btn-only" style="background:transparent"><a class="er-footer-btn" href="${ctaUrl}" target="_blank" style="background:var(--er-accent)">Accéder au Live →</a></div>`;
  }

  document.getElementById('encart').innerHTML=h;
  // Applique les variables d'apparence
  if(rootStyle){
    rootStyle.style.setProperty('--er-accent',accent);
    rootStyle.style.setProperty('--er-fs',fs);
    if(bg){ rootStyle.style.setProperty('--er-bg1',bg); rootStyle.style.setProperty('--er-bg2',bg); }
    if(textColor){ rootStyle.style.setProperty('--er-text',textColor); }
  }

  // After rendering, measure max heights then lock everything
  requestAnimationFrame(()=>{
    const essEl=document.getElementById('er-ess');
    const citEl=document.getElementById('er-cit');

    // Measure max essential height
    if(essEl && essential && essential.length>1){
      let maxH=0;
      for(let i=0;i<essential.length;i++){
        showEss(i, essential);
        maxH=Math.max(maxH, essEl.scrollHeight);
      }
      essEl.style.height=maxH+'px';
      essEl.style.overflow='hidden';
      showEss(0, essential);
    } else if(essential&&essential.length===1){
      showEss(0, essential);
    }

    // Measure max citation height
    if(citEl && citations && citations.length>1){
      let maxH=0;
      for(let i=0;i<citations.length;i++){
        showCit(i);
        maxH=Math.max(maxH, citEl.scrollHeight);
      }
      citEl.style.height=maxH+'px';
      citEl.style.overflow='hidden';
      showCit(0);
    } else if(citations&&citations.length){
      showCit(0);
    }

    // Lock total widget height after one more frame
    requestAnimationFrame(()=>{
      const encart=document.getElementById('encart');
      if(encart){
        _maxHeight=encart.scrollHeight;
        encart.style.height=_maxHeight+'px';
        encart.style.overflow='hidden';
      }
      sendHeight();

      // NOW start the carousels (after height is locked)
      if(essential&&essential.length>1){
        essTimer=setInterval(()=>{
          essIdx=(essIdx+1)%_essPts.length;
          showEss(essIdx, _essPts);
        },8000);
      }
      if(citations&&citations.length>1){
        citTimer=setInterval(()=>{
          citIdx=(citIdx+1)%_citPts.length;
          showCit(citIdx);
        },10000);
      }
      _rendered=true;
    });
  });
}

function showEss(idx, pts){
  essIdx=idx;
  const tag=document.getElementById('er-ess-tag');
  const text=document.getElementById('er-ess-text');
  const pag=document.getElementById('er-ess-pag');
  const ess=document.getElementById('er-ess');
  const dots=document.querySelectorAll('.er-ess-dot');
  if(!tag||!text||!pts[idx])return;
  const p=pts[idx];
  const bc=_tagColors[(p.tag||'').toUpperCase()]||'#3B82F6';
  tag.innerHTML=`<span class="er-ess-tag" style="${bc!=='#3B82F6'?'background:'+bc+'20;color:'+bc:''}">${p.tag}</span>`;
  text.innerHTML=p.text;
  if(pag) pag.textContent=`${idx+1}/${pts.length}`;
  if(ess) ess.style.borderLeftColor=bc;
  dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
}

window.goEss=function(idx){
  if(essTimer){clearInterval(essTimer);essTimer=null;}
  showEss(idx, _essPts);
  essTimer=setInterval(()=>{
    essIdx=(essIdx+1)%_essPts.length;
    showEss(essIdx, _essPts);
  },8000);
};

function showCit(idx){
  citIdx=idx;
  const pts=_citPts;
  if(!pts[idx])return;
  const c=pts[idx];
  const media=document.getElementById('er-cit-media');
  const name=document.getElementById('er-cit-name');
  const role=document.getElementById('er-cit-role');
  const text=document.getElementById('er-cit-text');
  const pag=document.getElementById('er-cit-pag');
  const dots=document.querySelectorAll('#er-cit-dots .er-ess-dot');
  if(!text)return;
  if(media){
    if(c.avatar){
      media.innerHTML=`<img class="er-cit-avatar" src="${c.avatar}" alt="" onerror="this.outerHTML='<div class=er-cit-avatar-ph><svg viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'rgba(255,255,255,.25)\\' stroke-width=\\'2\\'><path d=\\'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\\'/><circle cx=\\'12\\' cy=\\'7\\' r=\\'4\\'/></svg></div>'">`;
    } else {
      media.innerHTML=`<div class="er-cit-avatar-ph"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;
    }
  }
  if(name) name.textContent=c.name||'';
  if(role) role.textContent=c.role||'';
  if(text) text.textContent='« '+(c.text||'')+' »';
  if(pag) pag.textContent=`${idx+1}/${pts.length}`;
  dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
}

window.goCit=function(idx){
  if(citTimer){clearInterval(citTimer);citTimer=null;}
  showCit(idx);
  citTimer=setInterval(()=>{
    citIdx=(citIdx+1)%_citPts.length;
    showCit(citIdx);
  },10000);
};

// INIT
async function init(){
  if(DEMO){
    renderEncart(DEMO_DATA);
    return;
  }
  const eventId=new URLSearchParams(window.location.search).get('event');
  if(!eventId){document.getElementById('encart').innerHTML='<div class="er-loading">?event= manquant</div>';return;}
  try{
    const ec=db.collection('events').doc(eventId);
    // Initial load
    const [evS,esS,ciS,tlS,lvS,arS]=await Promise.all([
      ec.get(),
      ec.collection('essential').get(),
      ec.collection('citations').get(),
      ec.collection('timeline').get(),
      ec.collection('live').get(),
      ec.collection('articles').get()
    ]);
    if(!evS.exists){document.getElementById('encart').innerHTML='<div class="er-loading">Événement introuvable</div>';return;}
    function toArr(snap){const a=[];snap.forEach(d=>a.push(d.data()));return a;}
    const state={
      event:evS.data(),
      essential:toArr(esS).sort((a,b)=>(a.order||0)-(b.order||0)),
      citations:toArr(ciS).sort((a,b)=>{const ta=a.created_at?.toDate?a.created_at.toDate().getTime():0;const tb=b.created_at?.toDate?b.created_at.toDate().getTime():0;return tb-ta;}),
      timeline:toArr(tlS).sort((a,b)=>(a.order||0)-(b.order||0)),
      live:toArr(lvS).sort((a,b)=>_wTs(b.time)-_wTs(a.time)),
      articles:toArr(arS).sort((a,b)=>_wTs(b.created_at||b.date)-_wTs(a.created_at||a.date))
    };
    renderEncart(state, true);

    // Real-time listeners — update widget when data changes
    // Skip first snapshot fire (already loaded above)
    let skipEv=true,skipEs=true,skipCi=true,skipTl=true,skipLv=true,skipAr=true;
    ec.onSnapshot(snap=>{if(skipEv){skipEv=false;return;}if(snap.exists){state.event=snap.data();renderEncart(state);}});
    ec.collection('essential').onSnapshot(snap=>{if(skipEs){skipEs=false;return;}state.essential=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));renderEncart(state);});
    ec.collection('citations').onSnapshot(snap=>{if(skipCi){skipCi=false;return;}state.citations=toArr(snap).sort((a,b)=>{const ta=a.created_at?.toDate?a.created_at.toDate().getTime():0;const tb=b.created_at?.toDate?b.created_at.toDate().getTime():0;return tb-ta;});renderEncart(state);});
    ec.collection('timeline').onSnapshot(snap=>{if(skipTl){skipTl=false;return;}state.timeline=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));renderEncart(state);});
    ec.collection('live').onSnapshot(snap=>{if(skipLv){skipLv=false;return;}state.live=toArr(snap).sort((a,b)=>_wTs(b.time)-_wTs(a.time));renderEncart(state);});
    ec.collection('articles').onSnapshot(snap=>{if(skipAr){skipAr=false;return;}state.articles=toArr(snap).sort((a,b)=>_wTs(b.created_at||b.date)-_wTs(a.created_at||a.date));renderEncart(state);});
  }catch(e){
    console.error(e);
    document.getElementById('encart').innerHTML='<div class="er-loading">Erreur de chargement</div>';
  }
}
init();

// IFRAME RESIZE — envoie toujours la hauteur maximale observée (ne rétrécit jamais)
var _maxHeight=0;
function sendHeight(){
  const h=document.getElementById('encart');
  if(!h)return;
  const height=h.scrollHeight;
  if(height>_maxHeight) _maxHeight=height;
  window.parent.postMessage({type:'tourmag-live-resize',height:_maxHeight},'*');
  window.parent.postMessage({type:'setHeight',height:_maxHeight},'*');
}
window.addEventListener('load',()=>{sendHeight();setInterval(sendHeight,1500);new ResizeObserver(sendHeight).observe(document.getElementById('encart'));});
</script>
