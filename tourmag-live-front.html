<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourMaG Live — Couverture événementielle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{--pri:#1B1B2F;--acc:#E8842C;--acc2:#D4731D;--blue:#0C6CA1;--green:#059669;--orange:#EA580C;--red:#DC2626;--amber:#D97706;--violet:#7C3AED;--cyan:#0891B2;--bg:#FFFFFF;--card:#FFF;--text:#111827;--text2:#4B5563;--text3:#9CA3AF;--border:#E5E7EB;--rl:16px;--shadow:0 2px 12px rgba(0,0,0,.06);--hero-color:#2D1B4E;--live:#DC2626}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* LOADER */
.ld{text-align:center;padding:80px}
.ld .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.ld .tx{font-size:14px;color:var(--text3)}

/* FADE IN */
.fi{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}.fi.vis{opacity:1;transform:translateY(0)}

/* UPDATE BAR */
.upd-bar{display:flex;justify-content:flex-end;padding:8px 28px 0;font-family:'IBM Plex Mono';font-size:9px;color:var(--text3)}
@media(max-width:768px){.upd-bar{padding:6px 8px 0}}

/* CONTAINER */
.dash{max-width:1200px;margin:0 auto;padding:24px 28px}
@media(max-width:768px){.dash{padding:12px 8px}}

/* SECTION LABELS */
.sl{font-family:'Josefin Sans';font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:3px;color:var(--text3);margin:36px 0 14px;display:flex;align-items:center;gap:8px}
.sl::after{content:'';flex:1;height:1px;background:var(--border)}

/* BADGES */
.bdg-live{display:inline-flex;align-items:center;gap:6px;font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--live);padding:5px 14px;border-radius:6px}
.bdg-live::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:livepulse 1.5s infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ==================== HERO ==================== */
.hero{background:linear-gradient(135deg,#1B1B2F 0%,#2D1B4E 40%,#1B1B2F 100%);border-radius:var(--rl);padding:28px 36px 24px;margin-bottom:28px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:340px;height:340px;background:radial-gradient(circle,rgba(232,132,44,.12) 0%,transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-30px;left:-30px;width:240px;height:240px;background:radial-gradient(circle,rgba(220,38,38,.08) 0%,transparent 70%);pointer-events:none}
.hero-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;position:relative;flex-wrap:wrap;gap:12px}
.hero-left{flex:1;display:flex;align-items:center;gap:16px}
.hero-logo{max-height:56px;max-width:120px;object-fit:contain;border-radius:8px;flex-shrink:0}
.hero-text{flex:1}
.hero-title{font-family:'Josefin Sans';font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
.hero-subtitle{font-size:12px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-subtitle span{display:flex;align-items:center;gap:4px}
.hero-subtitle svg{width:14px;height:14px;stroke:rgba(255,255,255,.45)}
.hero-meta{display:flex;align-items:center;gap:16px;flex-shrink:0}
@media(max-width:768px){.hero{padding:20px 14px 18px;border-radius:12px}.hero-title{font-size:18px}.hero-logo{max-height:40px;max-width:80px}}

/* HERO ESSENTIAL CARDS (IA) */
.hero-ess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
@media(max-width:768px){.hero-ess-grid{grid-template-columns:1fr}}
.hero-ess-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:3px solid transparent}
.hero-ess-card:nth-child(1){border-left-color:#3B82F6}
.hero-ess-card:nth-child(2){border-left-color:#DC2626}
.hero-ess-card:nth-child(3){border-left-color:#D97706}
.hero-ess-card:nth-child(4){border-left-color:#059669}
.hero-ess-card:nth-child(5){border-left-color:#7C3AED}
.hero-ess-card:nth-child(6){border-left-color:#0891B2}
.hero-ess-top{display:flex;align-items:center;gap:8px}
.hero-ess-num{font-family:'Josefin Sans';font-size:20px;font-weight:700;line-height:1}
.hero-ess-card:nth-child(1) .hero-ess-num{color:#60A5FA}
.hero-ess-card:nth-child(2) .hero-ess-num{color:#F87171}
.hero-ess-card:nth-child(3) .hero-ess-num{color:#FBBF24}
.hero-ess-card:nth-child(4) .hero-ess-num{color:#34D399}
.hero-ess-card:nth-child(5) .hero-ess-num{color:#A78BFA}
.hero-ess-card:nth-child(6) .hero-ess-num{color:#22D3EE}
.hero-ess-tag{font-family:'Josefin Sans';font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.hero-ess-txt{font-size:11px;line-height:1.55;color:rgba(255,255,255,.7)}
.hero-ess-txt strong{font-weight:700;color:#fff}
.hero-ess-ia{font-family:'IBM Plex Mono';font-size:8px;color:rgba(255,255,255,.25);margin-top:12px;text-align:right;letter-spacing:.5px}

/* HERO TIMELINE (frise articles) */
.hero-tl{position:relative;margin-top:18px;padding-top:8px}
.hero-tl-track{display:grid;grid-template-columns:repeat(var(--tl-cols,5),1fr);gap:0;position:relative}
.hero-tl-track::before{content:'';position:absolute;top:14px;left:0;right:0;height:2px;background:rgba(255,255,255,.12)}
.hero-tl-item{display:flex;flex-direction:column;align-items:center;padding:0 4px;cursor:pointer;transition:opacity .15s}
.hero-tl-item:hover{opacity:.8}
.hero-tl-dot{width:10px;height:10px;border-radius:50%;background:var(--acc);border:2.5px solid rgba(27,27,47,.85);box-shadow:0 0 0 1.5px var(--acc);z-index:1;margin-bottom:8px}
.hero-tl-date{font-family:'IBM Plex Mono';font-size:9px;color:var(--acc);font-weight:600;margin-bottom:3px}
.hero-tl-ev{font-size:10px;color:rgba(255,255,255,.55);text-align:center;line-height:1.4;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:768px){.hero-tl-track{grid-template-columns:1fr;gap:8px}.hero-tl-track::before{display:none}.hero-tl-item{flex-direction:row;gap:10px;align-items:flex-start}.hero-tl-dot{margin-bottom:0;margin-top:4px;flex-shrink:0}.hero-tl-ev{text-align:left}}

/* ==================== LAYOUT ==================== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr;gap:20px}}
.main-col{min-width:0;max-width:100%;overflow:hidden}
.side-col{min-width:0}
@media(max-width:960px){.side-col{order:10}}

/* ==================== LIVE FEED ==================== */
.live-feed{position:relative}

.live-entry{position:relative;display:flex;gap:16px;padding:0 0 24px 0}
.live-entry::before{content:'';position:absolute;left:19px;top:32px;bottom:0;width:2px;background:var(--border)}
.live-entry:last-child::before{display:none}

.live-time-col{flex-shrink:0;width:40px;display:flex;flex-direction:column;align-items:center;padding-top:2px}
.live-dot{width:12px;height:12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--acc);z-index:1;margin-bottom:6px}
.live-entry:first-child .live-dot{background:var(--live);box-shadow:0 0 0 2px var(--live);animation:livepulse 1.5s infinite}

.live-content{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s}
.live-content:hover{transform:translateY(-1px)}
.live-entry:first-child .live-content{border-color:rgba(220,38,38,.2);box-shadow:0 2px 12px rgba(220,38,38,.06)}

.live-content-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.live-tag{font-family:'Josefin Sans';font-size:7px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:#F1F5F9;color:#475569}
.live-timestamp{font-family:'IBM Plex Mono';font-size:9px;color:var(--text3)}
.live-journalist{font-size:9px;color:var(--acc);font-weight:600}
.live-text{font-size:13px;line-height:1.6;color:var(--text)}
.live-text strong{font-weight:600}

.live-img{margin-top:10px;border-radius:8px;overflow:hidden}
.live-img img{width:100%;display:block;object-fit:cover}

/* LIVE EXPAND (accordéon) */
.live-expand{display:none}
.live-expand.open{display:block}
.voir-plus-live{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;font-size:11px;font-weight:600;color:var(--acc2);cursor:pointer;transition:color .15s;margin-top:-8px}
.voir-plus-live:hover{color:var(--acc)}
.voir-plus-live svg{width:14px;height:14px;transition:transform .2s}
.voir-plus-live.open-state svg{transform:rotate(180deg)}

@media(max-width:768px){.live-entry{gap:10px}.live-time-col{width:30px}}

/* ==================== CITATIONS / RUBRIQUES ==================== */
.rubrique-block{margin-bottom:24px}
.rubrique-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.rubrique-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.rubrique-name{font-family:'Josefin Sans';font-size:15px;font-weight:700;color:var(--text)}
.rubrique-count{font-size:9px;font-weight:700;color:#fff;padding:2px 8px;border-radius:20px;margin-left:auto}

.citation-card{background:var(--pri);border-radius:14px;padding:28px 26px;margin-bottom:14px;position:relative;overflow:hidden;border-left:4px solid var(--acc)}
.citation-card::before{content:'\201C';position:absolute;top:10px;left:18px;font-family:'Playfair Display',Georgia,serif;font-size:120px;color:rgba(232,132,44,.15);line-height:1;pointer-events:none}
.citation-card::after{content:'\201D';position:absolute;bottom:-20px;right:20px;font-family:'Playfair Display',Georgia,serif;font-size:120px;color:rgba(232,132,44,.08);line-height:1;pointer-events:none}
.citation-text{font-size:15px;line-height:1.75;color:rgba(255,255,255,.9);font-style:italic;position:relative;z-index:1;margin-bottom:14px;padding-left:16px}
.citation-text strong{color:#FDBA74;font-weight:600;font-style:normal}
.citation-author{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.citation-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid rgba(232,132,44,.35);box-shadow:0 4px 16px rgba(0,0,0,.25);flex-shrink:0}
.citation-avatar-placeholder{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.citation-avatar-placeholder svg{width:40px;height:40px}
.citation-info{flex:1}
.citation-name{font-family:'Josefin Sans';font-size:15px;font-weight:700;color:#fff}
.citation-role{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.citation-sep{border:none;border-top:1px solid rgba(255,255,255,.08);margin:16px 0}
.citation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:768px){.citation-grid{grid-template-columns:1fr}}

/* ==================== SIDEBAR CARDS ==================== */
.cd{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow);border-top:3px solid var(--hero-color);margin-bottom:14px}
.cd .hd{display:flex;align-items:center;gap:8px;padding:12px 14px}
.cd .ci{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#FEF3C7;color:#92400E}
.cd .ci svg{width:16px;height:16px}
.cd .ct{font-family:'Josefin Sans';font-size:15px;font-weight:700}
.cd .cc{font-size:9px;font-weight:700;color:#fff;padding:2px 8px;border-radius:20px;margin-left:auto;background:var(--hero-color)}

/* ARTICLES LIÉS — images grosses style cfg-a du dashboard crise */
.ni{padding:10px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .1s;display:flex;gap:12px;align-items:center}
.ni:first-of-type{border-top:none}
.ni:hover{background:#F8FAFC}
.ni-img{width:100px;height:75px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#F1F5F9}
.ni-body{flex:1;min-width:0}
.ni .nt{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.ni .nm{font-size:10px;color:var(--text3);margin-top:2px}

/* Accordéon voir plus (identique dashboard crise) */
.voir-plus{display:block;padding:8px 14px;font-size:10px;font-weight:600;color:var(--acc2);text-align:center;cursor:pointer;border-top:1px solid var(--border);transition:background .1s}
.voir-plus:hover{background:#FFF7ED}
.cd-expand{display:none}
.cd-expand.open{display:block}

/* ==================== PROGRAMME — style warm gradient ==================== */
.prog-card{background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 50%,#FDE68A 100%);border:1.5px solid #F59E0B40;border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 12px rgba(245,158,11,.08);margin-bottom:14px}
.prog-card .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #F59E0B25}
.prog-card .ci{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#F59E0B20;color:#92400E}
.prog-card .ci svg{width:16px;height:16px}
.prog-card .ct{font-family:'Josefin Sans';font-size:15px;font-weight:700;color:#78350F}
.prog-list{padding:10px 14px}
.prog-item{display:flex;gap:12px;padding:10px 12px;margin-bottom:6px;border:1px solid #F59E0B20;border-radius:10px;background:rgba(255,255,255,.55);align-items:flex-start;transition:background .15s}
.prog-item:hover{background:rgba(255,255,255,.8)}
.prog-item:last-child{margin-bottom:0}
.prog-time{font-family:'IBM Plex Mono';font-size:11px;font-weight:600;color:#B45309;flex-shrink:0;width:42px;padding-top:2px}
.prog-body{flex:1}
.prog-label{font-size:12px;font-weight:600;color:#1C1917;line-height:1.4}
.prog-desc{font-size:10px;color:#57534E;margin-top:2px;line-height:1.5}
.prog-status{display:inline-block;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:5px;margin-top:4px}
.prog-status.past{background:#E7E5E4;color:#78716C}
.prog-status.active{background:#DC2626;color:#fff;animation:pulse 1.5s infinite}
.prog-status.upcoming{background:#FEF3C7;color:#92400E;border:1px solid #F59E0B50}

/* ==================== FLASH ==================== */
.flash{display:flex;align-items:center;gap:12px;padding:12px 20px;background:linear-gradient(90deg,#7F1D1D,#991B1B);border-radius:var(--rl);margin-bottom:14px;overflow:hidden}
.flash-badge{display:flex;align-items:center;gap:5px;font-family:'Josefin Sans';font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 12px;border-radius:6px;flex-shrink:0;white-space:nowrap;animation:fpls 2s infinite}
.flash-badge svg{width:12px;height:12px;stroke:#fff}
@keyframes fpls{0%,100%{opacity:1}50%{opacity:.6}}
.flash-text{font-size:14px;font-weight:500;color:rgba(255,255,255,.9);flex:1;line-height:1.4}
@media(max-width:768px){.flash{flex-wrap:wrap;gap:8px;padding:10px 12px}.flash-text{font-size:12px;order:3;flex-basis:100%}}

/* ==================== FOOTER ==================== */
.ft{font-size:10px;color:var(--text3);text-align:center;padding:20px 0;border-top:1px solid var(--border);margin-top:24px}
.ft a{color:var(--acc2);text-decoration:none}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}
</style>
</head>

const LIVE_VISIBLE = 5;
const ART_VISIBLE = 6;

function fmtTime(v){ try{ const d=v?.toDate?v.toDate():(v?new Date(v):null); return d&&!isNaN(d)?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'--:--'; }catch(e){return '--:--';} }
function fmtDT(v){ try{ const d=v?.toDate?v.toDate():(v?new Date(v):null); return d&&!isNaN(d)?d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''; }catch(e){return '';} }
function autoStatus(timeStr){
  if(!timeStr) return 'upcoming';
  const now=new Date();
  const parts=timeStr.split(':');
  const h=parseInt(parts[0])||0, m=parseInt(parts[1])||0;
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
  const diff=(now-t)/60000;
  if(diff>60) return 'past';
  if(diff>=-5&&diff<=60) return 'active';
  return 'upcoming';
}

var _tagColorMap = {};
function mkLiveEntry(e){
  const tc = e.tag_color || _tagColorMap[(e.tag||'').toUpperCase()] || '';
  return `<div class="live-entry"><div class="live-time-col"><div class="live-dot"></div></div><div class="live-content"><div class="live-content-head"><span class="live-tag" ${tc?`style="background:${tc}20;color:${tc}"`:''}>${e.tag}</span><span class="live-timestamp">${fmtTime(e.time)}</span><span class="live-journalist">${e.journalist}</span></div><div class="live-text">${e.text}${e.url?` <a href="${e.url}" target="_blank" style="color:var(--acc);font-size:11px;font-weight:600;text-decoration:none">→ Lire la suite</a>`:''}</div>${e.image?`<div class="live-img"><img src="${e.image}" alt="" style="height:${e.image_height||200}px;object-position:${e.image_position||'center center'}" onerror="this.parentElement.remove()"></div>`:''}</div></div>`;
}

function mkArticle(a){
  const img = a.image ? `<img class="ni-img" src="${a.image}" alt="" onerror="this.remove()">` : '';
  return `<div class="ni" onclick="window.open('${a.link}','_blank')">${img}<div class="ni-body"><div class="nt">${a.title}</div><div class="nm">${a.author} · ${a.date}</div></div></div>`;
}

// TOGGLE FUNCTIONS (global)
window.toggleLive = function(){
  const el=document.getElementById('live-expand'), btn=document.getElementById('live-btn');
  if(!el||!btn)return;
  const open=el.classList.toggle('open');
  btn.classList.toggle('open-state',open);
  const n=parseInt(btn.dataset.extra);
  btn.innerHTML = open ? `Réduire ${ICO.chevDown}` : `Voir les ${n} entrées précédentes ${ICO.chevDown}`;
  if(typeof sendHeight==='function') setTimeout(sendHeight,50);
};
window.toggleArticles = function(){
  const el=document.getElementById('art-expand'), btn=document.getElementById('art-btn');
  if(!el||!btn)return;
  const open=el.classList.toggle('open');
  const n=parseInt(btn.dataset.extra);
  btn.textContent = open ? 'Réduire ▴' : `Voir les ${n} autres articles ▾`;
  if(typeof sendHeight==='function') setTimeout(sendHeight,50);
};
window.toggleCitAccordion = function(accId){
  const el=document.getElementById(accId), btn=document.getElementById(accId+'-btn');
  if(!el||!btn)return;
  const open=el.classList.toggle('open');
  const n=parseInt(btn.dataset.extra);
  btn.textContent = open ? 'Réduire ▴' : `Voir les ${n} autres citations ▾`;
  if(typeof sendHeight==='function') setTimeout(sendHeight,50);
};

function render(data){
  const {event, essential, live, rubriques, citations, articles, programme, timeline} = data;
  const mod = event.modules || {};
  let h = '';

  // Build tag color lookup from event tags
  const eventTags = event.tags || [];
  const tagColorMap = {};
  eventTags.forEach(t => {
    if(typeof t === 'string') return;
    if(t && t.name && t.color) tagColorMap[t.name.toUpperCase()] = t.color;
  });
  _tagColorMap = tagColorMap;

  // ===== BLOCS RÉORDONNABLES =====
  function mkHero(){
    // Hero = titre + points essentiels + timeline — un seul bloc cohérent
    let o = `<div class="hero fi"><div class="hero-header"><div class="hero-left">`;
    if(event.logo_url) o += `<img class="hero-logo" src="${event.logo_url}" alt="" onerror="this.remove()">`;
    o += `<div class="hero-text"><div class="hero-title">${event.title}</div><div class="hero-subtitle"><span>${ICO.mapPin} ${event.location}</span><span>${ICO.calendar} ${event.dates}</span></div></div></div>`;
    o += `<div class="hero-meta">${event.status==='live'?'<span class="bdg-live">EN DIRECT</span>':''}</div></div>`;

    // Essential (IA + manuels)
    if(mod.essential!==false && essential && essential.length){
      o += `<div class="hero-ess-grid">`;
      essential.forEach((p,i) => {
        const tc = tagColorMap[(p.tag||'').toUpperCase()] || '';
        const tagStyle = tc ? `style="background:${tc}25;color:${tc}"` : '';
        o += `<div class="hero-ess-card"${tc?` style="border-left-color:${tc}"`:''}><div class="hero-ess-top"><div class="hero-ess-num"${tc?` style="color:${tc}"`:''}>${String(i+1).padStart(2,'0')}</div><span class="hero-ess-tag" ${tagStyle}>${p.tag}</span></div><div class="hero-ess-txt">${p.text}</div></div>`;
      });
      const hasIA = essential.some(p => p.source === 'ia');
      const hasManual = essential.some(p => p.source === 'manual' || !p.source);
      o += `</div>`;
      if(hasIA && !hasManual) o += `<div class="hero-ess-ia">✦ Synthèse générée par IA à partir des articles liés</div>`;
      else if(hasIA && hasManual) o += `<div class="hero-ess-ia">✦ Points essentiels — IA + rédaction</div>`;
    }

    // Timeline
    if(mod.timeline!==false && timeline && timeline.length){
      const tlCount = Math.min(timeline.length, 6);
      o += `<div class="hero-tl"><div class="hero-tl-track" style="--tl-cols:${tlCount}">`;
      timeline.slice(0, 6).forEach(t => {
        const link = t.link ? ` onclick="window.open('${t.link}','_blank')"` : '';
        o += `<div class="hero-tl-item"${link}><div class="hero-tl-dot"></div><div class="hero-tl-date">${t.date}</div><div class="hero-tl-ev">${t.text}</div></div>`;
      });
      o += `</div></div>`;
    }

    o += `</div>`; // end hero
    return o;
  }

  function mkFlash(){
    if(!mod.flash || !event.flash_text) return '';
    const flashLink = event.flash_link ? ` onclick="window.open('${event.flash_link}','_blank')" style="cursor:pointer"` : '';
    return `<div class="flash fi"${flashLink}><span class="flash-badge">${ICO.zap} FLASH</span><span class="flash-text">${event.flash_text}</span>${event.flash_link?'<span style="margin-left:auto;flex-shrink:0;font-size:11px;color:rgba(255,255,255,.6)">→</span>':''}</div>`;
  }

  function mkLive(){
    if(mod.live===false || !live || !live.length) return '';
    let o = `<div class="sl fi">Fil live — Minute par minute</div><div class="live-feed fi">`;
    const vis = live.slice(0, LIVE_VISIBLE);
    const ext = live.slice(LIVE_VISIBLE);
    vis.forEach(e => { o += mkLiveEntry(e); });
    if(ext.length){
      o += `<div class="live-expand" id="live-expand">`;
      ext.forEach(e => { o += mkLiveEntry(e); });
      o += `</div>`;
      o += `<div class="voir-plus-live" id="live-btn" data-extra="${ext.length}" onclick="toggleLive()">Voir les ${ext.length} entrées précédentes ${ICO.chevDown}</div>`;
    }
    o += `</div>`;
    return o;
  }

  const CIT_VISIBLE = event.citVisibleCount || 6;
  var _citAccordionCounter = 0;

  function mkCitations(){
    if(mod.citations===false || !citations || !citations.length) return '';
    let o = `<div class="sl fi">Ce qu'ils ont dit</div>`;
    function mkCitGroup(group){
      let out = '';
      const c0 = group[0];
      out += `<div class="citation-card"><div class="citation-author" style="margin-bottom:14px">`;
      if(c0.avatar){
        out += `<img class="citation-avatar" src="${c0.avatar}" alt="" onerror="this.style.display='none'">`;
      } else {
        out += `<div class="citation-avatar-placeholder">${ICO.user}</div>`;
      }
      out += `<div class="citation-info"><div class="citation-name">${c0.name}</div><div class="citation-role">${c0.role||''}</div></div></div>`;
      group.forEach((c,i) => {
        if(i>0) out += `<hr class="citation-sep">`;
        out += `<div class="citation-text">${c.text}</div>`;
      });
      out += `</div>`;
      return out;
    }
    function groupByPerson(arr){
      const groups=[];const seen=new Map();
      arr.forEach(c=>{const key=(c.name||'').toLowerCase().trim();if(seen.has(key)){groups[seen.get(key)].push(c);}else{seen.set(key,groups.length);groups.push([c]);}});
      return groups;
    }
    function renderCitBlock(rc, rubName, rubIcon, rubColor, rubBg){
      if(!rc.length) return '';
      const groups = groupByPerson(rc);
      const accId = 'cit-acc-' + (_citAccordionCounter++);
      let out = `<div class="rubrique-block fi"><div class="rubrique-header"><div class="rubrique-icon" style="background:${rubBg};color:${rubColor}">${rubIcon}</div><div class="rubrique-name">${rubName}</div><span class="rubrique-count" style="background:${rubColor}">${rc.length}</span></div><div class="citation-grid">`;
      // Flatten groups into cards, count total citation cards
      const cards = groups.map(g => mkCitGroup(g));
      const visCards = cards.slice(0, CIT_VISIBLE);
      const extraCards = cards.slice(CIT_VISIBLE);
      visCards.forEach(c => { out += c; });
      if(extraCards.length){
        out += `</div><div class="cd-expand" id="${accId}"><div class="citation-grid">`;
        extraCards.forEach(c => { out += c; });
        out += `</div></div>`;
        out += `<div class="voir-plus" id="${accId}-btn" data-extra="${extraCards.length}" onclick="toggleCitAccordion('${accId}')">Voir les ${extraCards.length} autres citations ▾</div>`;
      } else {
        out += `</div>`;
      }
      out += `</div>`;
      return out;
    }
    if(rubriques && rubriques.length){
      rubriques.forEach(rub => {
        const rc = citations.filter(c => c.rubrique === rub.id);
        if(!rc.length) return;
        o += renderCitBlock(rc, rub.name, rub.icon, rub.color, rub.bg);
      });
    }
    const rubIds = new Set((rubriques||[]).map(r=>r.id));
    const orphans = citations.filter(c => !c.rubrique || !rubIds.has(c.rubrique));
    if(orphans.length){
      o += renderCitBlock(orphans, 'Verbatims', '💬', '#475569', '#F1F5F9');
    }
    return o;
  }

  function mkProgramme(){
    if(mod.programme===false || !programme || !programme.length) return '';
    // Group by day
    const grouped={};
    const dayOrder=[];
    programme.forEach(p => {
      const d=p.day||'';
      if(!grouped[d]){grouped[d]=[];dayOrder.push(d);}
      grouped[d].push(p);
    });
    const hasMultipleDays=dayOrder.length>1 || (dayOrder.length===1 && dayOrder[0]!=='');
    let o = `<div class="prog-card fi"><div class="hd"><div class="ci">${ICO.clipboard}</div><span class="ct">Programme</span></div><div class="prog-list">`;
    dayOrder.forEach(day => {
      if(hasMultipleDays && day) o += `<div style="font-family:'Josefin Sans';font-size:11px;font-weight:700;color:#B45309;margin:10px 0 6px;padding:5px 10px;background:rgba(245,158,11,.1);border-radius:6px;display:inline-block">📅 ${day}</div>`;
      grouped[day].forEach(p => {
        const st = autoStatus(p.time);
        const sl = st==='past'?'Terminé':st==='active'?'● En cours':'À venir';
        o += `<div class="prog-item"><div class="prog-time">${p.time}</div><div class="prog-body"><div class="prog-label">${p.label}</div>${p.desc?`<div class="prog-desc">${p.desc}</div>`:''}<span class="prog-status ${st}">${sl}</span></div></div>`;
      });
    });
    o += `</div></div>`;
    return o;
  }

  function mkArticles(){
    if(mod.articles===false || !articles || !articles.length) return '';
    const va = articles.slice(0, ART_VISIBLE);
    const ea = articles.slice(ART_VISIBLE);
    let o = `<div class="cd fi"><div class="hd"><div class="ci">${ICO.newspaper}</div><span class="ct">Articles liés</span><span class="cc">${articles.length}</span></div>`;
    va.forEach(a => { o += mkArticle(a); });
    if(ea.length){
      o += `<div class="cd-expand" id="art-expand">`;
      ea.forEach(a => { o += mkArticle(a); });
      o += `</div>`;
      o += `<div class="voir-plus" id="art-btn" data-extra="${ea.length}" onclick="toggleArticles()">Voir les ${ea.length} autres articles ▾</div>`;
    }
    o += `</div>`;
    return o;
  }

  const blockRenderers = {hero:mkHero,flash:mkFlash,live:mkLive,citations:mkCitations,programme:mkProgramme,articles:mkArticles};

  // Use stored zone assignments or defaults
  const defaultZones={hero:'main',flash:'main',live:'main',citations:'main',programme:'side',articles:'side'};
  const blockZones=event.blockZones||defaultZones;
  const allBlockKeys=['hero','flash','live','citations','programme','articles'];

  // Build ordered lists per zone from blockOrder
  const fullBlockOrder = event.blockOrder || ['hero','flash','live','citations','programme','articles'];
  const orderedKeys=[...fullBlockOrder];
  // Migration: if old format had essential/timeline separately, merge them into hero
  const migIdx=orderedKeys.indexOf('essential');
  if(migIdx>=0){
    orderedKeys.splice(migIdx,1);
    const tlIdx=orderedKeys.indexOf('timeline');
    if(tlIdx>=0) orderedKeys.splice(tlIdx,1);
    if(!orderedKeys.includes('hero')) orderedKeys.unshift('hero');
  }
  allBlockKeys.forEach(k=>{if(!orderedKeys.includes(k))orderedKeys.push(k);});
  const validKeys=orderedKeys.filter(k=>allBlockKeys.includes(k));

  const mainBlocks=validKeys.filter(k=>(blockZones[k]||defaultZones[k])!=='side');
  const sideBlocks=validKeys.filter(k=>(blockZones[k]||defaultZones[k])==='side');

  h += `<div class="layout"><div class="main-col">`;
  mainBlocks.forEach(key=>{
    const fn=blockRenderers[key];if(fn)h+=fn();
  });
  h += `</div><div class="side-col">`;
  sideBlocks.forEach(key=>{const fn=blockRenderers[key];if(fn)h+=fn();});
  h += `</div></div>`;
  h += `<div class="ft">Couverture en direct <a href="https://www.tourmag.com" target="_blank">TourMaG.com</a> · Synthèse IA par Claude</div>`;

  document.getElementById('app').innerHTML = h;
  document.getElementById('upd-bar').innerHTML = `Dernière mise à jour : ${fmtDT(new Date().toISOString())}`;

  // Fade-in observer
  const obs = new IntersectionObserver(es => {
    es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('vis'); obs.unobserve(e.target); }});
  },{threshold:.08});
  document.querySelectorAll('.fi').forEach(el => obs.observe(el));
}

// ============================================================
// INIT
// ============================================================
async function init(){
  if(DEMO){
    await new Promise(r => setTimeout(r, 600));
    render({event:DEMO_EVENT,essential:DEMO_ESSENTIAL,live:DEMO_LIVE,rubriques:DEMO_RUBRIQUES,citations:DEMO_CITATIONS,articles:DEMO_ARTICLES,programme:DEMO_PROGRAMME,timeline:DEMO_TIMELINE});
    return;
  }
  const eventId = new URLSearchParams(window.location.search).get('event');
  if(!eventId){ document.getElementById('app').innerHTML='<div class="ld"><div class="tx">Aucun événement spécifié</div></div>'; return; }
  const ec=db.collection('events').doc(eventId);
  const [evS,esS,liS,ruS,ciS,arS,prS,tlS] = await Promise.all([
    ec.get(),
    ec.collection('essential').get(),
    ec.collection('live').get(),
    ec.collection('rubriques').get(),
    ec.collection('citations').get(),
    ec.collection('articles').get(),
    ec.collection('programme').get(),
    ec.collection('timeline').get()
  ]);
  if(!evS.exists){ document.getElementById('app').innerHTML='<div class="ld"><div class="tx">Événement introuvable</div></div>'; return; }
  const ev=evS.data();
  function toArr(s){ const a=[]; s.forEach(d=>a.push({id:d.id,...d.data()})); return a; }
  function tsVal(v){ try{ return v?.toDate?v.toDate().getTime():(v?new Date(v).getTime():0); }catch(e){return 0;} }
  const ess=toArr(esS).sort((a,b)=>(a.order||0)-(b.order||0));
  const li=toArr(liS).sort((a,b)=>tsVal(b.time)-tsVal(a.time));
  const ru=toArr(ruS).sort((a,b)=>(a.order||0)-(b.order||0));
  const ci=toArr(ciS).sort((a,b)=>tsVal(b.created_at)-tsVal(a.created_at));
  const ar=toArr(arS);
  const pr=toArr(prS).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.time||'').localeCompare(b.time||''));
  const tl=toArr(tlS).sort((a,b)=>(a.order||0)-(b.order||0));
  render({event:ev,essential:ess,live:li,rubriques:ru,citations:ci,articles:ar,programme:pr,timeline:tl});

  // Real-time listeners — le front se met à jour dès qu'un contenu est publié depuis le back-office
  var rtState={event:ev,essential:ess,live:li,rubriques:ru,citations:ci,articles:ar,programme:pr,timeline:tl};
  function rtRender(){ render(rtState); }

  ec.collection('live').onSnapshot(snap => {
    rtState.live=toArr(snap).sort((a,b)=>tsVal(b.time)-tsVal(a.time));
    rtRender();
  });
  ec.collection('rubriques').onSnapshot(snap => {
    rtState.rubriques=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));
    rtRender();
  });
  ec.collection('articles').onSnapshot(snap => {
    rtState.articles=toArr(snap);
    rtRender();
  });
  ec.collection('citations').onSnapshot(snap => {
    rtState.citations=toArr(snap).sort((a,b)=>tsVal(b.created_at)-tsVal(a.created_at));
    rtRender();
  });
  ec.collection('essential').onSnapshot(snap => {
    rtState.essential=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));
    rtRender();
  });
  ec.collection('programme').onSnapshot(snap => {
    rtState.programme=toArr(snap).sort((a,b)=>(a.day||'').localeCompare(b.day||'')||(a.time||'').localeCompare(b.time||''));
    rtRender();
  });
  ec.collection('timeline').onSnapshot(snap => {
    rtState.timeline=toArr(snap).sort((a,b)=>(a.order||0)-(b.order||0));
    rtRender();
  });
  // Event doc (flash, modules, status)
  ec.onSnapshot(snap => {
    if(snap.exists){ rtState.event=snap.data(); rtRender(); }
  });
}
init().catch(e=>{console.error(e);document.getElementById('app').innerHTML='<div class="ld" style="color:#DC2626">Erreur — voir console</div>'});

// IFRAME RESIZE
function sendHeight(){
  const h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,document.documentElement.offsetHeight);
  window.parent.postMessage({type:'tourmag-live-resize',height:h},'*');
  window.parent.postMessage({type:'setHeight',height:h},'*');
}
window.addEventListener('load',()=>{
  document.documentElement.style.overflow='visible';document.body.style.overflow='visible';
  sendHeight();
  new MutationObserver(sendHeight).observe(document.body,{childList:true,subtree:true});
  new ResizeObserver(sendHeight).observe(document.body);
  setInterval(sendHeight,1500);
});
</script>
